<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智慧帳本 - 理財</title>

    <meta name="theme-color" content="#c89b3c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="智慧帳本">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="manifest" id="manifest-link">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --color-gold: #c89b3c;
            --color-blue: #3a6b88;
            --color-red: #b84a39;
            --color-green: #5b8c5a;
            --color-dark: #2c2e2b;

            --bg-app: #f6f4ee;
            --bg-surface: #ffffff;
            --bg-card: #ece8df;
            --bg-input: #ffffff;
            --text-main: #2c2e2b;
            --text-muted: #7a7f78;
            --border-line: #d8d2c4;
            --phone-border: #d2cbba;
        }

        body.theme-dark {
            --bg-app: #1c1d1b;
            --bg-surface: #272825;
            --bg-card: #333530;
            --bg-input: #21221f;
            --text-main: #f0eee6;
            --text-muted: #939890;
            --border-line: #454841;
            --phone-border: #2b2c28;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background-color 0.35s ease, color 0.35s ease;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body.modal-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .phone-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 100vh;
            margin: 0 auto;
            position: relative;
            background-color: var(--bg-app);
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-color: var(--phone-border);
            touch-action: none;
            overscroll-behavior: none;
            /* 啟用頂部動態島 / 安全區域 */
            padding-top: env(safe-area-inset-top);
        }

        @media (min-width: 640px) {
            .phone-container {
                height: 96vh;
                max-height: 940px;
                margin-top: 2vh;
                border-radius: 40px;
                border-width: 8px;
                padding-top: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .modal-backdrop {
            animation: fadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .modal-backdrop.is-closing {
            animation: fadeOut 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-sheet {
            will-change: transform, opacity;
            transform: scale(0.92) translateY(10px);
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s ease;
            max-height: 82vh;
            border-radius: 24px !important;
            width: 100%;
            max-width: 400px;
        }

        .modal-sheet.is-open {
            transform: scale(1) translateY(0) !important;
            opacity: 1 !important;
        }

        .modal-sheet.is-closing {
            transform: scale(0.92) translateY(10px) !important;
            opacity: 0 !important;
        }

        /* 超即點即響應之手指觸控回饋動畫 */
        button, a, label[class*="cursor-pointer"] {
            transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1), opacity 0.08s ease;
            will-change: transform;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        button:active, label[class*="cursor-pointer"]:active {
            transform: scale(0.95) !important;
            opacity: 0.82 !important;
            transition-duration: 0.01s !important;
        }

        /* 系統設定卡片按鈕專用微亮點擊動畫 */
        .accordion-header-btn {
            transition: background-color 0.15s ease, opacity 0.12s ease, transform 0.12s cubic-bezier(0.2, 0, 0, 1);
            will-change: background-color, transform, opacity;
            -webkit-tap-highlight-color: transparent;
        }
        .accordion-header-btn:hover {
            background-color: rgba(200, 155, 60, 0.06);
        }
        .accordion-header-btn:active {
            transform: scale(0.988) translateY(1px) !important;
            background-color: rgba(200, 155, 60, 0.14) !important;
            opacity: 0.92 !important;
            transition-duration: 0.03s !important;
        }

        .pulse-gold { animation: pulseGold 2.5s infinite; }
        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 12px rgba(200, 155, 60, 0.25); }
            50% { box-shadow: 0 0 22px rgba(200, 155, 60, 0.5); }
        }

        .bg-app-bg { background-color: var(--bg-app); }
        .bg-app-surface { background-color: var(--bg-surface); }
        .bg-app-card { background-color: var(--bg-card); }
        .bg-app-input { background-color: var(--bg-input); }
        .text-app-main { color: var(--text-main); }
        .text-app-muted { color: var(--text-muted); }
        .border-app-line { border-color: var(--border-line); }

        .bg-brand-gold { background-color: var(--color-gold); }
        .bg-brand-blue { background-color: var(--color-blue); }
        .bg-brand-red { background-color: var(--color-red); }
        .bg-brand-green { background-color: var(--color-green); }

        .text-brand-gold { color: var(--color-gold); }
        .text-brand-blue { color: var(--color-blue); }
        .text-brand-red { color: var(--color-red); }
        .text-brand-green { color: var(--color-green); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-line); border-radius: 4px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen theme-light" style="touch-action: none; overscroll-behavior: none;">

    <div class="phone-container text-app-main flex flex-col relative overflow-hidden border-gray-300" id="app-phone-container" style="touch-action: none; overscroll-behavior: none;">

        <!-- Header Bar (Locked) -->
        <header class="px-5 py-3.5 bg-app-surface border-b border-app-line flex justify-between items-center z-20 shrink-0 shadow-sm" style="touch-action: none; overscroll-behavior: none;">
            <div class="flex items-center gap-1.5">
                <button onclick="switchTab('settings')" id="nav-settings-header" class="relative p-2 rounded-xl bg-app-card hover:opacity-80 text-app-main transition-all active:scale-95 border border-app-line" title="系統設定">
                    <i data-lucide="settings" class="w-5 h-5 text-brand-gold"></i>
                </button>
            </div>
            <div class="text-center">
                <h1 id="app-title-display" class="font-bold text-lg text-brand-gold tracking-wide flex items-center justify-center gap-2">
                    智慧帳本
                </h1>
                <p class="text-[11px] text-app-muted" id="header-date">2026 年 8 月 10 日</p>
            </div>
            <div class="flex items-center gap-1.5">
                <button id="pwa-install-btn" onclick="triggerPWAInstall()" class="hidden relative p-2 rounded-xl bg-brand-gold text-white hover:opacity-95 transition-all active:scale-95 border border-brand-gold/40 flex items-center gap-1 text-xs font-bold shadow-xs">
                    <i data-lucide="download" class="w-4 h-4"></i> 安裝
                </button>
                <button onclick="toggleNotificationDrawer()" class="relative p-2 rounded-xl bg-app-card hover:opacity-80 text-app-main transition-all active:scale-95 border border-app-line" title="通知紀錄">
                    <i data-lucide="bell" class="w-5 h-5 text-brand-gold"></i>
                    <span id="notif-badge" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-brand-red rounded-full ring-2 ring-white dark:ring-gray-900"></span>
                </button>
            </div>
        </header>

        <main class="flex-1 relative w-full overflow-hidden" id="main-content">
            <!-- Real-Time Swipe Track Container -->
            <div id="swipe-track-container" class="w-full h-full relative overflow-hidden">
                <div id="swipe-slider" class="flex w-[300%] h-full transition-transform duration-300 ease-out">
                    <div id="panel-home" class="w-[33.333333%] h-full overflow-y-auto p-4 space-y-4 pb-28 touch-pan-y" style="overscroll-behavior-y: none;"></div>
                    <div id="panel-details" class="w-[33.333333%] h-full overflow-y-auto p-4 space-y-4 pb-28 touch-pan-y" style="overscroll-behavior-y: none;"></div>
                    <div id="panel-stock-stats" class="w-[33.333333%] h-full overflow-y-auto p-4 space-y-4 pb-28 touch-pan-y" style="overscroll-behavior-y: none;"></div>
                </div>
            </div>
            <!-- Overlay Settings View -->
            <div id="panel-settings" class="hidden absolute inset-0 w-full h-full overflow-y-auto p-4 space-y-4 pb-28 bg-app-bg z-10 touch-pan-y" style="overscroll-behavior-y: none;"></div>
        </main>

        <!-- Floating Action Button -->
        <div class="absolute bottom-20 right-5 z-20">
            <button onclick="openTransactionModal()" class="bg-brand-gold text-white p-4 rounded-full shadow-xl flex items-center justify-center pulse-gold active:scale-90 hover:scale-110 transition-transform">
                <i data-lucide="plus" class="w-6 h-6 stroke-[2.5]"></i>
            </button>
        </div>

        <nav class="w-full bg-app-surface/95 backdrop-blur-lg border-t border-app-line px-3 py-2 flex justify-around items-center absolute bottom-0 left-0 z-30 shrink-0" style="touch-action: none; overscroll-behavior: none;">
            <button onclick="switchTab('home', true)" id="nav-home" class="flex flex-col items-center py-1 px-4 text-brand-gold transition-all duration-200 active:scale-95">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">首頁資產</span>
            </button>
            <button onclick="switchTab('details', true)" id="nav-details" class="flex flex-col items-center py-1 px-4 text-app-muted transition-all duration-200 active:scale-95">
                <i data-lucide="receipt" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">資產明細</span>
            </button>
            <button onclick="switchTab('stock-stats')" id="nav-stock-stats" class="flex flex-col items-center py-1 px-4 text-app-muted transition-all duration-200 active:scale-95">
                <i data-lucide="trending-up" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">持股統計</span>
            </button>
        </nav>

        <!-- Splash Screen -->
        <div id="splash-screen" class="absolute inset-0 bg-app-bg z-50 flex flex-col items-center justify-center transition-opacity duration-700">
            <div class="relative flex flex-col items-center animate-pop">
                <div class="w-24 h-24 rounded-3xl bg-app-surface p-1 shadow-xl flex items-center justify-center mb-5 border border-brand-gold/40">
                    <div class="w-full h-full bg-app-card rounded-[22px] flex items-center justify-center">
                        <i data-lucide="wallet" class="w-12 h-12 text-brand-gold"></i>
                    </div>
                </div>
                <h1 class="text-2xl font-bold tracking-wider text-brand-gold mb-1">智慧帳本</h1>
                <p class="text-xs text-brand-blue tracking-widest uppercase font-mono">Personal Wealth Ledger</p>
                <div class="mt-8 flex gap-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-brand-gold animate-ping"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-brand-blue animate-ping" style="animation-delay: 0.2s"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-brand-green animate-ping" style="animation-delay: 0.4s"></div>
                </div>
            </div>
        </div>

        <div id="notif-drawer" onclick="closeModal('notif-drawer')" class="modal-backdrop absolute inset-0 bg-black/60 backdrop-blur-xs z-40 hidden flex items-center justify-center p-4">
            <div class="modal-sheet w-full bg-app-surface shadow-2xl p-5 flex flex-col border border-app-line max-w-sm rounded-3xl" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center pb-3 border-b border-app-line">
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-2xl bg-brand-gold/15 text-brand-gold flex items-center justify-center shadow-2xs">
                            <i data-lucide="activity" class="w-4.5 h-4.5"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-app-main text-xs">系統動態與通知紀錄</h3>
                            <p class="text-[10px] text-app-muted">自動扣款&入款與分期執行(最近7天)</p>
                        </div>
                    </div>
                    <button onclick="closeModal('notif-drawer')" class="text-app-muted hover:text-app-main p-1.5 rounded-xl bg-app-card active:scale-90 border border-app-line">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="notif-list" class="flex-1 overflow-y-auto my-3 space-y-2.5 pr-0.5 max-h-[50vh]"></div>
                <button onclick="clearNotifications()" class="text-xs text-app-muted hover:text-brand-red text-center py-3 border-t border-app-line active:scale-95 font-medium flex items-center justify-center gap-1.5 bg-app-card/50 rounded-xl">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 清空所有紀錄
                </button>
            </div>
        </div>

        <div id="transaction-modal" onclick="closeModal('transaction-modal')" class="modal-backdrop absolute inset-0 bg-black/60 backdrop-blur-xs z-40 hidden flex items-center justify-center p-4">
            <div class="modal-sheet w-full bg-app-surface p-5 border border-app-line overflow-y-auto shadow-2xl rounded-3xl" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-brand-gold flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> 新增帳務交易
                    </h2>
                    <button onclick="closeModal('transaction-modal')" class="text-app-muted hover:text-app-main p-1 active:scale-90">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2 bg-app-card p-1 rounded-xl mb-4 text-sm">
                    <button type="button" onclick="setModalMode('cash')" id="btn-mode-cash" class="py-2 rounded-lg font-medium transition-all bg-brand-gold text-white shadow active:scale-90">現金收支</button>
                    <button type="button" onclick="setModalMode('stock')" id="btn-mode-stock" class="py-2 rounded-lg font-medium transition-all text-app-muted active:scale-90">股票買賣</button>
                </div>

                <form id="tx-form" onsubmit="handleTransactionSubmit(event)" class="space-y-3 text-xs pb-6">
                    <div class="flex gap-2">
                        <label onclick="setTxType('支出')" class="flex-1 text-center py-2.5 rounded-xl border-2 border-brand-red bg-brand-red/10 cursor-pointer transition-all shadow-sm active:scale-95" id="label-type-out">
                            <input type="radio" name="txType" value="支出" class="hidden" checked onchange="setTxType('支出')">
                            <span class="font-bold text-brand-red text-sm" id="txt-type-out">支出</span>
                        </label>
                        <label onclick="setTxType('存入')" class="flex-1 text-center py-2.5 rounded-xl border border-app-line opacity-60 cursor-pointer transition-all hover:opacity-100 active:scale-95" id="label-type-in">
                            <input type="radio" name="txType" value="存入" class="hidden" onchange="setTxType('存入')">
                            <span class="font-bold text-brand-green text-sm" id="txt-type-in">存入</span>
                        </label>
                    </div>

                    <div id="field-asset-select">
                        <label class="block text-app-muted mb-1">選擇資產帳戶</label>
                        <input type="hidden" id="input-asset-type" value="TWD">
                        <button type="button" onclick="triggerTxAssetPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium active:scale-98">
                            <span id="tx-asset-btn-txt">台幣帳戶 (TWD)</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                        </button>
                    </div>

                    <div id="field-stock-market" class="hidden">
                        <label class="block text-app-muted mb-1">股票市場</label>
                        <input type="hidden" id="input-stock-market" value="TW_STOCK">
                        <button type="button" onclick="triggerTxMarketPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium active:scale-98">
                            <span id="tx-market-btn-txt">台股 (TWD)</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                        </button>
                    </div>

                    <div id="field-stock-details" class="hidden space-y-3">
                        <div>
                            <label class="block text-app-muted mb-1">股票標的 / 代碼</label>
                            <div class="relative flex items-center">
                                <input type="text" id="input-stock-symbol" placeholder="例：2330 台積電 或 AAPL" oninput="toggleClearBtn(this)" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold">
                                <button type="button" onclick="clearInput('input-stock-symbol')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-app-muted mb-1">交易股數</label>
                                <div class="relative flex items-center">
                                    <input type="number" id="input-stock-shares" step="any" placeholder="0" oninput="toggleClearBtn(this); calculateStockTotal();" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold placeholder:text-app-muted/30 font-mono text-xs">
                                    <button type="button" onclick="clearInput('input-stock-shares', 'calculateStockTotal')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-app-muted mb-1">每股成交價</label>
                                <div class="relative flex items-center">
                                    <input type="number" id="input-stock-price" step="any" placeholder="0" oninput="toggleClearBtn(this); calculateStockTotal();" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold placeholder:text-app-muted/30 font-mono text-xs">
                                    <button type="button" onclick="clearInput('input-stock-price', 'calculateStockTotal')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-app-muted mb-1">手續費金額</label>
                            <div class="relative flex items-center">
                                <input type="number" id="input-stock-fee" step="any" placeholder="0" oninput="toggleClearBtn(this); calculateStockTotal();" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold placeholder:text-app-muted/30 font-mono text-xs">
                                <button type="button" onclick="clearInput('input-stock-fee', 'calculateStockTotal')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                            </div>
                        </div>
                    </div>

                    <div id="field-category">
                        <label id="tx-category-label" class="block text-app-muted mb-1">支出分類</label>
                        <input type="hidden" id="input-category" value="🍱 餐飲美食">
                        <button type="button" onclick="triggerTxCategoryPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium active:scale-98">
                            <span id="tx-category-btn-txt">🍱 餐飲美食</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                        </button>
                    </div>

                    <div>
                        <label class="block text-app-muted mb-1">金額 <span id="auto-calc-notice" class="text-brand-gold text-[10px] font-normal hidden">(自動計算總額)</span></label>
                        <div class="relative flex items-center">
                            <input type="number" id="input-amount" step="any" required placeholder="0" oninput="toggleClearBtn(this)" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main font-mono outline-none focus:border-brand-gold placeholder:text-app-muted/30 text-xs">
                            <button type="button" onclick="clearInput('input-amount')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-app-muted mb-1">日期</label>
                            <button type="button" onclick="openCustomDatePicker('TX_INPUT')" class="w-full bg-app-input border border-app-line rounded-xl px-2.5 py-2.5 text-app-main text-left flex items-center justify-between active:scale-98">
                                <span class="flex items-center gap-1.5 font-mono text-xs">
                                    <i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i>
                                    <span id="input-date-display">2026-08-10</span>
                                </span>
                                <input type="hidden" id="input-date" value="2026-08-10">
                                <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-app-muted shrink-0"></i>
                            </button>
                        </div>
                        <div>
                            <label class="block text-app-muted mb-1">備註說明</label>
                            <div class="relative flex items-center">
                                <input type="text" id="input-note" placeholder="可選填..." oninput="toggleClearBtn(this)" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none text-xs">
                                <button type="button" onclick="clearInput('input-note')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                            </div>
                        </div>

        function loadAppData() {
            const saved = localStorage.getItem('wealth_app_data_v18_final');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (!parsed.categories || !Array.isArray(parsed.categories)) {
                        parsed.categories = ['🍱 餐飲美食', '🛒 日常購物', '🚗 交通出行', '🎮 娛樂休閒', '📝 其他款項'];
                    } else {
                        parsed.categories = parsed.categories.map(c => c === '📝 其他雜項' ? '📝 其他款項' : c);
                    }
                    if (!parsed.budgets || typeof parsed.budgets !== 'object' || Array.isArray(parsed.budgets)) {
                        parsed.budgets = {};
                    }
                    if (parsed.assets) {
                        if (parsed.assets.MYR === undefined) parsed.assets.MYR = 0;
                    }
                    if (parsed.enableTWD === undefined) parsed.enableTWD = true;
                    if (parsed.enableTWStock === undefined) parsed.enableTWStock = true;
                    if (parsed.enableUSD === undefined) parsed.enableUSD = true;
                    if (parsed.enableUSStock === undefined) parsed.enableUSStock = true;
                    if (parsed.enableMYR === undefined) parsed.enableMYR = false;
                    if (parsed.myrExchangeRate === undefined) parsed.myrExchangeRate = 7.25;
                    if (parsed.hasUnreadNotifications === undefined) parsed.hasUnreadNotifications = false;
                    return parsed;
                } catch(e) { console.error(e); }
            }
            return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }

        async function updateExchangeRateAuto(isManual = false) {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.rates) {
                        if (data.rates.TWD) {
                            appData.usdExchangeRate = parseFloat(data.rates.TWD.toFixed(2));
                        }
                        if (data.rates.TWD && data.rates.MYR) {
                            appData.myrExchangeRate = parseFloat((data.rates.TWD / data.rates.MYR).toFixed(2));
                        }
                        saveData(true);
                        if (isManual) {
                            let msg = `1 USD = ${appData.usdExchangeRate} TWD`;
                            if (appData.enableMYR) msg += `\n1 MYR = ${appData.myrExchangeRate} TWD`;
                            showToast("匯率即時更新成功", msg);
                        }
                    }
                }
            } catch (err) {
                if (isManual) showToast("更新失敗", "無法取得最新匯率，已保留當前匯率。");
            }
        }

        function initRealtimeSwipe() {
            const trackContainer = document.getElementById('swipe-track-container');
            const slider = document.getElementById('swipe-slider');
            if (!trackContainer || !slider) return;

            trackContainer.addEventListener('touchstart', (e) => {
                if (currentTab === 'settings') return;
                swipeStartX = e.touches[0].clientX;
                swipeStartY = e.touches[0].clientY;
                swipeCurrentX = swipeStartX;
                isHorizontalSwiping = false;
                isVerticalScrolling = false;
                slider.style.transition = 'none';
                slider.style.willChange = 'transform';
            }, { passive: true });

            trackContainer.addEventListener('touchmove', (e) => {
                if (currentTab === 'settings') return;
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const deltaX = currentX - swipeStartX;
                const deltaY = currentY - swipeStartY;

                if (!isHorizontalSwiping && !isVerticalScrolling) {
                    if (Math.abs(deltaY) > Math.abs(deltaX) * 0.8) {
                        isVerticalScrolling = true;
                    } else if (Math.abs(deltaX) > 10) {
                        isHorizontalSwiping = true;
                    }
                }

                if (isHorizontalSwiping) {
                    swipeCurrentX = currentX;
                    const containerWidth = trackContainer.offsetWidth || 380;
                    const currentIdx = tabIndexes[currentTab] || 0;
                    let effectiveDeltaX = deltaX;
                    if ((currentIdx === 0 && deltaX > 0) || (currentIdx === 2 && deltaX < 0)) {
                        effectiveDeltaX = deltaX * 0.3;
                    }
                    const offsetPct = - (currentIdx * (100 / 3)) + (effectiveDeltaX / containerWidth * (100 / 3));
                    slider.style.transform = `translate3d(${offsetPct}%, 0, 0)`;
                }
            }, { passive: true });

            trackContainer.addEventListener('touchend', (e) => {
                if (currentTab === 'settings') return;
                slider.style.transition = 'transform 0.24s cubic-bezier(0.16, 1, 0.3, 1)';
                if (isHorizontalSwiping) {
                    const deltaX = swipeCurrentX - swipeStartX;
                    const threshold = 50;
                    const currentIdx = tabIndexes[currentTab] || 0;

                    if (deltaX < -threshold && currentIdx < 2) {
                        const tabKeys = ['home', 'details', 'stock-stats'];
                        switchTabWithAnimation(tabKeys[currentIdx + 1], 'none', false);
                    } else if (deltaX > threshold && currentIdx > 0) {
                        const tabKeys = ['home', 'details', 'stock-stats'];
                        switchTabWithAnimation(tabKeys[currentIdx - 1], 'none', false);
                    } else {
                        updateSliderPosition();
                    }
                } else {
                    updateSliderPosition();
                }
                isHorizontalSwiping = false;
                isVerticalScrolling = false;
            }, { passive: true });
        }

        function updateSliderPosition() {
            const slider = document.getElementById('swipe-slider');
            if (!slider) return;
            const currentIdx = tabIndexes[currentTab] || 0;
            slider.style.transform = `translate3d(-${currentIdx * (100 / 3)}%, 0, 0)`;
        }

                document.getElementById('txt-type-in').innerText = '買進股票';
            }
            setTxType(currentTxType);
        }

        function setTxType(val) {
            currentTxType = val;
            document.getElementsByName('txType').forEach(r => { if (r.value === val) r.checked = true; });
            const labelOut = document.getElementById('label-type-out');
            const labelIn = document.getElementById('label-type-in');
            const categoryLabel = document.getElementById('tx-category-label');
            const isSellOrExpense = (val === '支出' || val === '賣出股票');

            if (categoryLabel) {
                if (val === '支出') {
                    categoryLabel.innerText = '支出分類';
                } else if (val === '存入') {
                    categoryLabel.innerText = '存入分類';
                }
            }

            const categoryInput = document.getElementById('input-category');
            const categoryBtnTxt = document.getElementById('tx-category-btn-txt');
            const foodCategoryName = appData.categories[0] || '🍱 餐飲美食';
            if (categoryInput && categoryBtnTxt) {
                if (val === '支出') {
                    if (['💰 薪資收入', '📈 投資收益', '🔄 固定扣款'].includes(categoryInput.value)) {
                        categoryInput.value = foodCategoryName;
                        categoryBtnTxt.innerText = foodCategoryName;
                    }
                } else if (val === '存入') {
                    if (!['💰 薪資收入', '📈 投資收益', '📝 其他款項'].includes(categoryInput.value)) {
                        categoryInput.value = '💰 薪資收入';
                        categoryBtnTxt.innerText = '💰 薪資收入';
                    }
                }
            }

            if (isSellOrExpense) {
                if (labelOut) {
                    labelOut.className = "flex-1 text-center py-2.5 rounded-xl border-2 border-brand-red bg-brand-red/10 cursor-pointer transition-all shadow-sm active:scale-95";
                    labelOut.style.borderColor = "var(--color-red)";
                }
                if (labelIn) {
                    labelIn.className = "flex-1 text-center py-2.5 rounded-xl border border-app-line opacity-60 cursor-pointer transition-all hover:opacity-100 active:scale-95";
                    labelIn.style.borderColor = "";
                }
            } else {
                if (labelIn) {
                    labelIn.className = "flex-1 text-center py-2.5 rounded-xl border-2 border-brand-green bg-brand-green/10 cursor-pointer transition-all shadow-sm active:scale-95";
                    labelIn.style.borderColor = "var(--color-green)";
                }
                if (labelOut) {
                    labelOut.className = "flex-1 text-center py-2.5 rounded-xl border border-app-line opacity-60 cursor-pointer transition-all hover:opacity-100 active:scale-95";
                    labelOut.style.borderColor = "";
                }
            }
        }

        function calculateStockTotal() {
            if (currentModalMode !== 'stock') return;
            const shares = parseFloat(document.getElementById('input-stock-shares').value) || 0;
            const price = parseFloat(document.getElementById('input-stock-price').value) || 0;
            const fee = parseFloat(document.getElementById('input-stock-fee').value) || 0;
            const total = (shares * price) + fee;
            const amountElem = document.getElementById('input-amount');
            amountElem.value = total > 0 ? total.toFixed(2) : '';
            toggleClearBtn(amountElem);
        }

        function handleTransactionSubmit(e) {
            e.preventDefault();
            const txType = document.querySelector('input[name="txType"]:checked').value;
            const amount = parseFloat(document.getElementById('input-amount').value) || 0;
            const date = document.getElementById('input-date').value || getLocalDateStr();
            const note = document.getElementById('input-note').value || '';

            let asset = 'TWD', category = '🍱 餐飲美食', stockSymbol = '', shares = 0, price = 0, fee = 0;
            if (currentModalMode === 'cash') {
                asset = document.getElementById('input-asset-type').value;
                category = document.getElementById('input-category').value;
                if (txType === '存入') {
                    appData.assets[asset] = (appData.assets[asset] || 0) + amount;
                } else {
                    appData.assets[asset] = (appData.assets[asset] || 0) - amount;
                }
            } else {
                asset = document.getElementById('input-stock-market').value;
                stockSymbol = document.getElementById('input-stock-symbol').value || '股票交易';
                shares = parseFloat(document.getElementById('input-stock-shares').value) || 0;
                price = parseFloat(document.getElementById('input-stock-price').value) || 0;
                fee = parseFloat(document.getElementById('input-stock-fee').value) || 0;
                category = txType === '存入' ? '股票買進' : '股票賣出';
                if (txType === '存入') {
                    appData.assets[asset] = (appData.assets[asset] || 0) + amount;
                } else {
                    appData.assets[asset] = (appData.assets[asset] || 0) - amount;
                }
            }

            const newTx = { id: 'tx_' + Date.now(), type: txType, asset, category, amount, note, date, stockSymbol, shares, price, fee };
            
            appData.transactions.unshift(newTx);
            saveData(true);
            closeModal('transaction-modal');
        }

        function deleteTransaction(id, stockSymbol = null) {
            pendingDeleteTxId = id;
            pendingDeleteSymbol = stockSymbol;
            openModal('confirm-delete-modal');
        }

        function confirmExecuteDeleteTx() {
            if (!pendingDeleteTxId) {
                closeModal('confirm-delete-modal');
                return;
            }
            const id = pendingDeleteTxId;
            const stockSymbol = pendingDeleteSymbol;

            const idx = appData.transactions.findIndex(t => t.id === id);
            if (idx !== -1) {
                const tx = appData.transactions[idx];
                if (['TWD', 'USD', 'TW_STOCK', 'US_STOCK', 'MYR'].includes(tx.asset)) {
                    if (tx.type === '存入') {
                        appData.assets[tx.asset] = (appData.assets[tx.asset] || 0) - tx.amount;
                    } else {
                        appData.assets[tx.asset] = (appData.assets[tx.asset] || 0) + tx.amount;
                    }
                }
                appData.transactions.splice(idx, 1);
                saveData(true);
            }

            closeModal('confirm-delete-modal');
            pendingDeleteTxId = null;

            if (stockSymbol) {
                openStockHistoryModal(stockSymbol);
            }
        }

        function openStockHistoryModal(symbol) {
            const stockTxList = appData.transactions.filter(tx => (tx.asset === 'TW_STOCK' || tx.asset === 'US_STOCK') && tx.stockSymbol === symbol);
            let totalShares = 0, totalCost = 0;
            stockTxList.forEach(tx => {
                const s = Number(tx.shares) || 0, a = Number(tx.amount) || 0;
                if (tx.type === '存入') { totalShares += s; totalCost += a; }
                else { totalShares -= s; totalCost -= a; }
            });
            const avgPrice = totalShares > 0 ? (totalCost / totalShares).toFixed(2) : 0;
            const isTW = stockTxList.length > 0 && stockTxList[0].asset === 'TW_STOCK';
            const currSymbol = isTW ? 'NT$' : '$';

            document.getElementById('stock-modal-symbol').innerText = `${symbol} 交易歷史`;
            document.getElementById('stock-modal-summary').innerHTML = `
                <div class="flex justify-between items-center text-xs">
                    <div><span class="text-app-muted">持股總數:</span> <strong class="font-mono text-app-main">${totalShares.toLocaleString()} 股</strong></div>
                    <div><span class="text-app-muted">平均成本:</span> <strong class="font-mono text-brand-gold">${currSymbol}${Number(avgPrice).toLocaleString()}</strong></div>
                </div>
            `;
            const listContainer = document.getElementById('stock-modal-list');
            if (stockTxList.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-app-muted py-4 text-xs">查無該股票的歷史紀錄</div>`;
            } else {
                listContainer.innerHTML = stockTxList.map(tx => `
                    <div class="bg-app-card border border-app-line p-2.5 rounded-xl flex justify-between items-center text-xs">
                        <div>
                            <div class="font-bold text-app-main flex items-center gap-1">
                                <span class="${tx.type === '存入' ? 'text-brand-green' : 'text-brand-red'} font-bold">${tx.type === '存入' ? '買進' : '賣出'}</span>
                                <span class="font-mono text-[10px] text-app-muted">(${tx.date})</span>
                            </div>
                            <div class="text-[10px] text-app-muted font-mono mt-0.5">${tx.shares} 股 @ ${currSymbol}${tx.price} (手續費: ${tx.fee || 0})</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold font-mono text-xs ${tx.type === '存入' ? 'text-brand-green' : 'text-brand-red'}">${currSymbol}${Number(tx.amount).toLocaleString()}</div>
                            <button onclick="deleteTransaction('${tx.id}', '${symbol.replace(/'/g, "\\'")}')" class="text-[10px] text-app-muted hover:text-brand-red active:scale-75">刪除</button>
                        </div>
                    </div>
                `).join('');
            }
            openModal('stock-history-modal');
        }

        function saveTitleSetting() {
            const val = document.getElementById('setting-title')?.value;
            if (val !== undefined) {
                appData.appTitle = val;
                saveData(true);
                updateHeaderDate();
                showToast("更新成功", "App 標題名稱已更新。");
            }
        }

        function removeBudgetCategory(catName) {
            if (appData.budgets && appData.budgets[catName]) {
                delete appData.budgets[catName];
                saveData(true);
                showToast("已移除", `已停止追蹤「${catName}」的預算。`);
            }
        }

        function saveBudgetCategoryAmount(catName, val) {
            if (!appData.budgets) appData.budgets = {};
            if (!appData.budgets[catName]) appData.budgets[catName] = { amount: 0, currency: 'TWD' };
            appData.budgets[catName].amount = val === '' ? 0 : (parseFloat(val) || 0);
            saveData(true);
        }

        function saveBudgetCategoryFromInput(catName, inputId) {
            const val = document.getElementById(inputId)?.value;
            if (!appData.budgets) appData.budgets = {};
            if (!appData.budgets[catName]) appData.budgets[catName] = { amount: 0, currency: 'TWD' };
            appData.budgets[catName].amount = val === '' || val === undefined ? 0 : (parseFloat(val) || 0);
            saveData(true);
            const curr = appData.budgets[catName].currency || 'TWD';
            const symbol = curr === 'USD' ? 'USD $' : (curr === 'MYR' ? 'RM ' : 'NT$');
            showToast("預算設定完成", `${catName}預算已成功更新為 ${symbol} ${appData.budgets[catName].amount.toLocaleString()} (${curr})。`);

        function selectBudgetCurrency(catName, curr) {
            if (!appData.budgets) appData.budgets = {};
            if (!appData.budgets[catName]) appData.budgets[catName] = { amount: 0, currency: 'TWD' };
            appData.budgets[catName].currency = curr;
            saveData(true);
            closeModal('custom-option-modal');
        }

        function triggerBudgetCurrencyPicker(catName) {
            const opts = [];
            if (appData.enableTWD) opts.push({ label: '台幣 (TWD)', value: 'TWD' });
            if (appData.enableUSD) opts.push({ label: '美金 (USD)', value: 'USD' });
            if (appData.enableMYR) opts.push({ label: '馬幣 (MYR)', value: 'MYR' });
            if (opts.length === 0) opts.push({ label: '台幣 (TWD)', value: 'TWD' });

            const currentVal = appData.budgets && appData.budgets[catName] ? (appData.budgets[catName].currency || 'TWD') : 'TWD';
            const title = `選擇 ${catName} 預算幣別`;

            currentOptionTarget = `BUDGET_CURR_${catName}`;
            document.getElementById('option-modal-title').innerHTML = `<i data-lucide="list" class="w-4 h-4"></i> ${title}`;
            document.getElementById('option-modal-list').innerHTML = opts.map(opt => {
                const isSelected = opt.value === currentVal;

                    <div onclick="selectBudgetCurrency('${catName.replace(/'/g, "\\'")}', '${opt.value}')" class="w-full p-2.5 rounded-xl border ${isSelected ? 'border-brand-gold bg-brand-gold/10 font-bold' : 'border-app-line bg-app-card'} hover:border-brand-gold flex justify-between items-center text-xs transition-all cursor-pointer">

            openModal('custom-option-modal');

            const expenseCategories = (appData.categories || []).filter(c => !['💰 薪資收入', '📈 投資收益', '🔄 固定扣款'].includes(c) && (!appData.budgets || !appData.budgets[c]));

        function toggleEnableAsset(assetFlagKey, enabled) {
            const flags = ['enableTWD', 'enableTWStock', 'enableUSD', 'enableUSStock', 'enableMYR'];
            const activeCount = flags.reduce((count, k) => count + (appData[k] ? 1 : 0), 0);

            if (!enabled && activeCount <= 1) {
                showToast("無法停用", "系統至少需要保留一個開啟的資產帳戶。");
                renderCurrentView();
                return;
            }

            appData[assetFlagKey] = enabled;
            saveData(true);

            const labels = {
                enableTWD: '台幣現金 (TWD)',
                enableTWStock: '台股市值 (TW Stock)',
                enableUSD: '美金現金 (USD)',
                enableUSStock: '美股市值 (US Stock)',
                enableMYR: '馬幣現金 (MYR)'
            };
            showToast("帳戶設定已更新", enabled ? `已成功啟用「${labels[assetFlagKey]}」！` : `已停用「${labels[assetFlagKey]}」。`);
        }

                            <div onclick="navigateToDetails('MYR')" class="bg-app-card border border-brand-gold/40 p-3.5 rounded-2xl cursor-pointer hover:border-brand-gold active:scale-95">
                                <div class="flex justify-between items-start mb-1.5">
                                    <span class="text-xs font-bold text-app-main flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-brand-gold"></span> 馬幣現金</span>
                                    <span class="text-[10px] bg-app-surface text-brand-gold px-1.5 py-0.5 rounded border border-brand-gold/30 font-mono">MYR</span>
                                </div>
                                <div class="text-base font-bold text-brand-gold font-mono">RM ${(appData.assets.MYR || 0).toLocaleString()}</div>
                                <div class="flex justify-between items-center mt-1"><span class="text-[10px] text-app-muted font-mono">≈ NT$ ${((appData.assets.MYR || 0) * (appData.myrExchangeRate || 7.25)).toLocaleString('zh-TW', {maximumFractionDigits:0})}</span><i data-lucide="chevron-right" class="w-3.5 h-3.5 text-brand-gold"></i></div>
                            </div>
                        ` : ''}
                    </div>

                    ${enabledBudgets.length > 0 ? `
                        <div class="bg-app-card border border-app-line rounded-2xl p-4 shadow-sm space-y-3 w-full">
                            <div class="flex justify-between items-center pb-1 border-b border-app-line">
                                <div class="text-xs font-bold text-app-main flex items-center gap-1.5">
                                    <i data-lucide="pie-chart" class="w-4 h-4 text-brand-gold"></i> 本月預算 (${enabledBudgets.length} 項目)
                                </div>
                                <button onclick="navigateToSettingsBudget()" class="text-[11px] text-brand-blue hover:underline font-medium active:scale-95">
                                    預算設定
                                </button>
                            </div>
                            <div class="space-y-2.5">
                                ${enabledBudgets.map(b => `
                                    <div onclick="navigateToCategoryDetails('${b.catName.replace(/'/g, "\\'")}', '${b.curr}')" class="bg-app-surface p-3 rounded-xl border border-app-line cursor-pointer hover:border-brand-gold active:scale-98">
                                        <div class="flex justify-between items-center text-xs mb-1.5">
                                            <span class="text-app-main font-medium flex items-center gap-1">${b.catName} <i data-lucide="chevron-right" class="w-3 h-3 text-brand-gold"></i></span>
                                            <span class="${b.percent > 90 ? 'text-brand-red' : 'text-brand-gold'} font-bold font-mono">${b.sym}${Math.round(b.spent).toLocaleString()} / ${b.sym}${b.amount.toLocaleString()} (${b.percent}%)</span>
                                        </div>
                                        <div class="w-full bg-app-bg h-2 rounded-full overflow-hidden">
                                            <div class="h-full ${b.percent > 90 ? 'bg-brand-red' : 'bg-brand-gold'} transition-all duration-500" style="width: ${b.percent}%"></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-app-card border border-app-line rounded-2xl p-4 shadow-sm space-y-3 w-full">
                        <div class="flex justify-between items-center pb-1 border-b border-app-line">
                            <h3 class="text-xs font-bold text-app-main tracking-wider uppercase flex items-center gap-1.5"><i data-lucide="history" class="w-4 h-4 text-brand-gold"></i> 近期帳務動態</h3>
                            <button onclick="switchTab('details')" class="text-[11px] text-brand-blue hover:underline">查看全部</button>
                        </div>
                        <div class="space-y-2 w-full">${renderTxList(appData.transactions.slice(0, 5))}</div>
                    </div>
                </div>
            `;
        }

        function navigateToCategoryDetails(categoryName, currency = 'TWD') {
            filterAsset = currency === 'USD' ? 'USD' : (currency === 'MYR' ? 'MYR' : 'TWD');
            filterRange = 'MONTHLY';
            filterType = '支出';
            filterMonthDate = getLocalMonthStr();
            filterCategoryName = categoryName;
            filterSearchQuery = '';
            switchTabWithAnimation('details', 'none', false);
        }

        function getFilteredDetailsList() {
            let list = [...appData.transactions];
            if (filterAsset !== 'ALL') list = list.filter(tx => tx.asset === filterAsset);
            if (filterType !== 'ALL') list = list.filter(tx => tx.type === filterType);
            if (filterCategoryName && filterCategoryName !== 'ALL') list = list.filter(tx => tx.category === filterCategoryName);
            if (filterRange === 'RECENT30') list = list.slice(0, 30);
            else if (filterRange === 'SINGLE_DAY') list = list.filter(tx => tx.date === filterCustomDate);
            else if (filterRange === 'MONTHLY') list = list.filter(tx => tx.date.startsWith(filterMonthDate));
            else if (filterRange === 'CUSTOM') list = list.filter(tx => tx.date >= filterStartDate && tx.date <= filterEndDate);

            if (filterSearchQuery.trim() !== '') {
                const q = filterSearchQuery.trim().toLowerCase();
                list = list.filter(tx => {
                    const sym = (tx.stockSymbol || '').toLowerCase();
                    const note = (tx.note || '').toLowerCase();
                    const cat = (tx.category || '').toLowerCase();
                    const amt = (tx.amount !== undefined && tx.amount !== null) ? tx.amount.toString() : '';
                    const date = (tx.date || '');
                    const asset = (tx.asset || '').toLowerCase();
                    return sym.includes(q) || note.includes(q) || cat.includes(q) || amt.includes(q) || date.includes(q) || asset.includes(q);
                });
            }
            return list;
        }

        function renderDetailsSummaryHtml(list) {
            const netChange = list.reduce((sum, t) => sum + (t.type === '存入' ? t.amount : -t.amount), 0);
            return `
                <span>共找到 ${list.length} 筆資料</span>
                <span>淨變動: <strong class="text-brand-gold font-mono">$ ${netChange.toLocaleString()}</strong></span>
            `;
        }

        function handleDetailsSearch(inputElem) {
            filterSearchQuery = inputElem.value;
            const clearBtn = document.getElementById('details-search-clear-btn');
            if (clearBtn) {
                if (filterSearchQuery.trim() !== '') clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }
            updateDetailsListContainer();
        }

        function clearDetailsSearch() {
            filterSearchQuery = '';
            const inputElem = document.getElementById('details-search-input');
            if (inputElem) inputElem.value = '';
            const clearBtn = document.getElementById('details-search-clear-btn');
            if (clearBtn) clearBtn.classList.add('hidden');
            updateDetailsListContainer();
        }

        function updateDetailsListContainer() {
            const list = getFilteredDetailsList();
            const summaryElem = document.getElementById('details-count-summary');
            if (summaryElem) summaryElem.innerHTML = renderDetailsSummaryHtml(list);
            const containerElem = document.getElementById('details-tx-list-container');
            if (containerElem) containerElem.innerHTML = renderTxList(list);
            if (window.lucide) lucide.createIcons();
        }

        function updateDetailsViewDOM() {
            const availableAssets = ['ALL'];
            if (appData.enableTWD) availableAssets.push('TWD');
            if (appData.enableTWStock) availableAssets.push('TW_STOCK');
            if (appData.enableUSD) availableAssets.push('USD');
            if (appData.enableUSStock) availableAssets.push('US_STOCK');
            if (appData.enableMYR) availableAssets.push('MYR');

            const assetContainer = document.getElementById('details-asset-pills');
            if (assetContainer) {
                assetContainer.innerHTML = availableAssets.map(a => `
                    <button onclick="setFilterAsset('${a}')" class="px-3 py-1.5 rounded-lg whitespace-nowrap font-medium transition-all ${filterAsset === a ? 'bg-brand-gold text-white font-bold' : 'bg-app-surface text-app-muted hover:text-app-main'}">
                        ${a === 'ALL' ? '全部資產' : a === 'TW_STOCK' ? '台股' : a === 'US_STOCK' ? '美股' : a}
                    </button>
                `).join('');
            }

            ['RECENT30', 'SINGLE_DAY', 'MONTHLY', 'CUSTOM'].forEach(r => {
                const btn = document.getElementById(`btn-range-${r}`);
                if (btn) {
                    btn.className = `py-1.5 rounded-lg font-medium ${filterRange === r ? 'bg-brand-blue text-white font-bold' : 'bg-app-surface text-app-muted'}`;
                }
            });

            const datePickerBox = document.getElementById('details-range-picker-box');
            if (datePickerBox) {
                if (filterRange === 'SINGLE_DAY') {
                    datePickerBox.className = "flex items-center gap-2 pt-1 text-xs text-app-muted";
                    datePickerBox.innerHTML = `<span>選擇日期:</span><button onclick="openCustomDatePicker('SINGLE_DAY')" class="bg-app-input text-xs text-app-main border border-app-line rounded-lg px-2.5 py-2 font-mono active:scale-95 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i> <span>${filterCustomDate}</span></button>`;
                } else if (filterRange === 'MONTHLY') {
                    datePickerBox.className = "flex items-center gap-2 pt-1 text-xs text-app-muted";
                    datePickerBox.innerHTML = `<span>選擇月份:</span><button onclick="openCustomDatePicker('MONTHLY')" class="bg-app-input text-xs text-app-main border border-app-line rounded-lg px-2.5 py-2 font-mono active:scale-95 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i> <span>${filterMonthDate}</span></button>`;
                } else if (filterRange === 'CUSTOM') {
                    datePickerBox.className = "flex flex-wrap items-center gap-1.5 pt-1 text-xs text-app-muted";
                    datePickerBox.innerHTML = `<span>選擇區間:</span><button onclick="openCustomDatePicker('CUSTOM_START')" class="bg-app-input text-xs text-app-main border border-app-line rounded-lg px-2 py-2 font-mono active:scale-95 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i> <span>${filterStartDate}</span></button><span>至</span><button onclick="openCustomDatePicker('CUSTOM_END')" class="bg-app-input text-xs text-app-main border border-app-line rounded-lg px-2 py-2 font-mono active:scale-95 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i> <span>${filterEndDate}</span></button>`;
                } else {
                    datePickerBox.className = "hidden";
                    datePickerBox.innerHTML = "";
                }
            }

            const typeAll = document.getElementById('btn-type-ALL');
            const typeOut = document.getElementById('btn-type-支出');
            const typeIn = document.getElementById('btn-type-存入');
            if (typeAll) typeAll.className = `flex-1 py-1 rounded-md text-center ${filterType === 'ALL' ? 'text-brand-gold font-bold bg-app-surface' : 'text-app-muted'}`;
            if (typeOut) typeOut.className = `flex-1 py-1 rounded-md text-center ${filterType === '支出' ? 'text-brand-red font-bold bg-app-surface' : 'text-app-muted'}`;
            if (typeIn) typeIn.className = `flex-1 py-1 rounded-md text-center ${filterType === '存入' ? 'text-brand-green font-bold bg-app-surface' : 'text-app-muted'}`;

            updateDetailsListContainer();
        }

        function renderDetailsView(container) {
            if (!container) return;
            const availableAssets = ['ALL'];
            if (appData.enableTWD) availableAssets.push('TWD');
            if (appData.enableTWStock) availableAssets.push('TW_STOCK');
            if (appData.enableUSD) availableAssets.push('USD');
            if (appData.enableUSStock) availableAssets.push('US_STOCK');
            if (appData.enableMYR) availableAssets.push('MYR');

            container.innerHTML = `
                <div class="animate-fade space-y-3 w-full">
                    <div class="bg-app-card p-3 rounded-2xl border border-app-line space-y-2.5 w-full">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-brand-gold flex items-center gap-1">
                                <i data-lucide="filter" class="w-3.5 h-3.5"></i> 篩選條件
                            </span>
                            <div class="flex items-center gap-2">
                                ${filterSearchQuery.trim() !== '' ? `<button onclick="clearDetailsSearch()" class="text-[10px] text-brand-blue hover:underline font-bold">清除搜尋 ✕</button>` : ''}
                                ${filterCategoryName && filterCategoryName !== 'ALL' ? `<button onclick="filterCategoryName='ALL'; renderCurrentView();" class="text-[10px] text-brand-blue hover:underline font-bold">清除分類篩選 (${filterCategoryName}) ✕</button>` : ''}
                            </div>
                        </div>

                        <div class="relative flex items-center">
                            <i data-lucide="search" class="w-3.5 h-3.5 text-app-muted absolute left-3 pointer-events-none"></i>
                            <input type="text" id="details-search-input" value="${filterSearchQuery}" placeholder="搜尋股票代碼、備註、分類或金額..." oninput="handleDetailsSearch(this)" class="w-full bg-app-input border border-app-line rounded-xl pl-8 pr-8 py-2 text-xs text-app-main outline-none focus:border-brand-gold transition-all">
                            <button type="button" id="details-search-clear-btn" onclick="clearDetailsSearch()" class="${filterSearchQuery ? '' : 'hidden'} absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                        </div>

                        <div id="details-asset-pills" class="flex gap-1 overflow-x-auto pb-1 text-xs">
                            ${availableAssets.map(a => `
                                <button onclick="setFilterAsset('${a}')" class="px-3 py-1.5 rounded-lg whitespace-nowrap font-medium transition-all ${filterAsset === a ? 'bg-brand-gold text-white font-bold' : 'bg-app-surface text-app-muted hover:text-app-main'}">
                                    ${a === 'ALL' ? '全部資產' : a === 'TW_STOCK' ? '台股' : a === 'US_STOCK' ? '美股' : a}
                                </button>
                            `).join('')}
                        </div>
                        <div class="grid grid-cols-4 gap-1 text-[11px]">
                            <button onclick="setFilterRange('RECENT30')" id="btn-range-RECENT30" class="py-1.5 rounded-lg font-medium ${filterRange === 'RECENT30' ? 'bg-brand-blue text-white font-bold' : 'bg-app-surface text-app-muted'}">最近30筆</button>
                            <button onclick="setFilterRange('SINGLE_DAY')" id="btn-range-SINGLE_DAY" class="py-1.5 rounded-lg font-medium ${filterRange === 'SINGLE_DAY' ? 'bg-brand-blue text-white font-bold' : 'bg-app-surface text-app-muted'}">單日明細</button>
                            <button onclick="setFilterRange('MONTHLY')" id="btn-range-MONTHLY" class="py-1.5 rounded-lg font-medium ${filterRange === 'MONTHLY' ? 'bg-brand-blue text-white font-bold' : 'bg-app-surface text-app-muted'}">月度總覽</button>
                            <button onclick="setFilterRange('CUSTOM')" id="btn-range-CUSTOM" class="py-1.5 rounded-lg font-medium ${filterRange === 'CUSTOM' ? 'bg-brand-blue text-white font-bold' : 'bg-app-surface text-app-muted'}">自訂區間</button>
                        </div>
                        <div id="details-range-picker-box" class="${filterRange === 'RECENT30' ? 'hidden' : ''}">
                            ${filterRange === 'SINGLE_DAY' ? `<div class="flex items-center gap-2 pt-1 text-xs text-app-muted"><span>選擇日期:</span><button onclick="openCustomDatePicker('SINGLE_DAY')" class="bg-app-input text-xs text-app-main border border-app-line rounded-lg px-2.5 py-2 font-mono active:scale-95 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i> <span>${filterCustomDate}</span></button></div>` : ''}
                            ${filterRange === 'MONTHLY' ? `<div class="flex items-center gap-2 pt-1 text-xs text-app-muted"><span>選擇月份:</span><button onclick="openCustomDatePicker('MONTHLY')" class="bg-app-input text-xs text-app-main border border-app-line rounded-lg px-2.5 py-2 font-mono active:scale-95 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i> <span>${filterMonthDate}</span></button></div>` : ''}
                            ${filterRange === 'CUSTOM' ? `<div class="flex flex-wrap items-center gap-1.5 pt-1 text-xs text-app-muted"><span>選擇區間:</span><button onclick="openCustomDatePicker('CUSTOM_START')" class="bg-app-input text-xs text-app-main border border-app-line rounded-lg px-2 py-2 font-mono active:scale-95 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i> <span>${filterStartDate}</span></button><span>至</span><button onclick="openCustomDatePicker('CUSTOM_END')" class="bg-app-input text-xs text-app-main border border-app-line rounded-lg px-2 py-2 font-mono active:scale-95 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i> <span>${filterEndDate}</span></button></div>` : ''}
                        </div>
                        <div class="flex gap-2 text-xs border-t border-app-line pt-2">
                            <button onclick="setFilterType('ALL')" id="btn-type-ALL" class="flex-1 py-1 rounded-md text-center ${filterType === 'ALL' ? 'text-brand-gold font-bold bg-app-surface' : 'text-app-muted'}">全部種類</button>
                            <button onclick="setFilterType('支出')" id="btn-type-支出" class="flex-1 py-1 rounded-md text-center ${filterType === '支出' ? 'text-brand-red font-bold bg-app-surface' : 'text-app-muted'}">支出明細</button>
                            <button onclick="setFilterType('存入')" id="btn-type-存入" class="flex-1 py-1 rounded-md text-center ${filterType === '存入' ? 'text-brand-green font-bold bg-app-surface' : 'text-app-muted'}">存入明細</button>
                        </div>
                    </div>
                    <div id="details-count-summary" class="flex justify-between items-center px-1 text-xs text-app-muted">
                        ${renderDetailsSummaryHtml(getFilteredDetailsList())}
                    </div>
                    <div id="details-tx-list-container" class="space-y-2 w-full">${renderTxList(getFilteredDetailsList())}</div>
                </div>
            `;
        }

        function setFilterAsset(asset) { filterAsset = asset; updateDetailsViewDOM(); }
        function setFilterRange(range) { filterRange = range; updateDetailsViewDOM(); }
        function setFilterType(type) { filterType = type; updateDetailsViewDOM(); }

        function setStockSubFilter(val) {
            stockSubFilter = val;
            updateStockStatsViewDOM();
        }

        function updateStockStatsViewDOM() {
            const stockTxList = appData.transactions.filter(tx => tx.asset === 'TW_STOCK' || tx.asset === 'US_STOCK');
            const holdingsMap = {};
            stockTxList.forEach(tx => {
                const sym = tx.stockSymbol || '未知股票';
                if (!holdingsMap[sym]) holdingsMap[sym] = { symbol: sym, asset: tx.asset, totalShares: 0, totalSpent: 0, txCount: 0 };
                const s = Number(tx.shares) || 0, a = Number(tx.amount) || 0;
                if (tx.type === '存入') { holdingsMap[sym].totalShares += s; holdingsMap[sym].totalSpent += a; }
                else { holdingsMap[sym].totalShares -= s; holdingsMap[sym].totalSpent -= a; }
                holdingsMap[sym].txCount += 1;
            });
            const holdingsList = Object.values(holdingsMap);
            const twHoldings = holdingsList.filter(h => h.asset === 'TW_STOCK');
            const usHoldings = holdingsList.filter(h => h.asset === 'US_STOCK');

            ['ALL', 'TW_STOCK', 'US_STOCK'].forEach(sub => {
                const btn = document.getElementById(`btn-stock-sub-${sub}`);
                if (btn) {
                    const count = sub === 'ALL' ? holdingsList.length : sub === 'TW_STOCK' ? twHoldings.length : usHoldings.length;
                    const label = sub === 'ALL' ? `全部 (${count})` : sub === 'TW_STOCK' ? `🇹🇼 台股 (${count})` : `🇺🇸 美股 (${count})`;
                    btn.innerText = label;
                    btn.className = `py-2 rounded-xl transition-all ${stockSubFilter === sub ? 'bg-brand-blue text-white font-bold shadow' : 'bg-app-surface text-app-muted'}`;
                }
            });

            const holdingsContainer = document.getElementById('stock-holdings-container');
            if (holdingsContainer) {
                const showTW = appData.enableTWStock && (stockSubFilter === 'ALL' || stockSubFilter === 'TW_STOCK');
                const showUS = appData.enableUSStock && (stockSubFilter === 'ALL' || stockSubFilter === 'US_STOCK');

                const renderStockItem = (h) => {
                    const avgCost = h.totalShares > 0 ? (h.totalSpent / h.totalShares).toFixed(2) : 0;
                    const isTW = h.asset === 'TW_STOCK';
                    const currencySymbol = isTW ? 'NT$' : '$';
                    return `
                        <div onclick="openStockHistoryModal('${h.symbol.replace(/'/g, "\\'")}')" class="bg-app-card border border-app-line p-3 rounded-2xl flex justify-between items-center w-full hover:border-brand-blue cursor-pointer active:scale-95 shadow-xs">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 bg-brand-blue/15 text-brand-blue"><i data-lucide="candlestick-chart" class="w-5 h-5"></i></div>
                                <div class="min-w-0">
                                    <div class="font-bold text-xs text-app-main flex items-center gap-1.5 truncate">
                                        <span class="truncate">${h.symbol}</span>
                                        <span class="text-[9px] px-1.5 py-0.2 rounded font-mono shrink-0 border ${isTW ? 'bg-app-surface text-brand-blue border-brand-blue/30' : 'bg-app-surface text-brand-gold border-brand-gold/30'}">${isTW ? '台股' : '美股'}</span>
                                    </div>
                                    <div class="text-[10px] text-app-muted mt-0.5 font-mono truncate">${h.totalShares.toLocaleString()} 股 • 均價 ${currencySymbol}${Number(avgCost).toLocaleString()}</div>
                                </div>
                            </div>
                            <div class="text-right shrink-0">
                                <div class="font-bold font-mono text-sm text-brand-gold">${currencySymbol} ${h.totalSpent.toLocaleString()}</div>
                                <div class="text-[10px] text-app-muted font-mono">${h.txCount} 筆交易 ›</div>
                            </div>
                        </div>
                    `;
                };

                if (holdingsList.length === 0) {
                    holdingsContainer.innerHTML = `
                        <div class="text-center py-12 text-app-muted bg-app-card rounded-2xl border border-app-line w-full">
                            <i data-lucide="line-chart" class="w-12 h-12 mx-auto mb-2 opacity-30 text-brand-gold"></i>
                            <p class="text-xs">尚無股票交易紀錄</p>
                            <button onclick="openTransactionModal(); setModalMode('stock');" class="mt-3 text-xs bg-brand-gold text-white px-3 py-1.5 rounded-lg font-bold active:scale-95">新增首筆股票交易</button>
                        </div>
                    `;
                } else {
                    const twStockVal = appData.enableTWStock ? appData.assets.TW_STOCK : 0;
                    const usStockValUSD = appData.enableUSStock ? appData.assets.US_STOCK : 0;
                    const usStockValTWD = usStockValUSD * appData.usdExchangeRate;

                    holdingsContainer.innerHTML = `
                        <div class="space-y-4 w-full">
                            ${showTW ? `
                                <div class="space-y-2">
                                    <div class="flex justify-between items-center px-1"><h4 class="text-xs font-bold text-brand-blue uppercase">🇹🇼 台股證券 (${twHoldings.length})</h4><span class="text-xs font-mono font-bold text-brand-gold">NT$ ${twStockVal.toLocaleString()}</span></div>
                                    ${twHoldings.length === 0 ? '<div class="bg-app-card border border-app-line p-4 rounded-2xl text-center text-xs text-app-muted">尚無台股持股紀錄</div>' : twHoldings.map(renderStockItem).join('')}
                                </div>
                            ` : ''}
                            ${showUS ? `
                                <div class="space-y-2">
                                    <div class="flex justify-between items-center px-1">
                                        <h4 class="text-xs font-bold text-brand-gold uppercase">🇺🇸 美股證券 (${usHoldings.length})</h4>

        function renderStockStatsView(container) {
            if (!container) return;
            const stockTxList = appData.transactions.filter(tx => tx.asset === 'TW_STOCK' || tx.asset === 'US_STOCK');

                if (!holdingsMap[sym]) holdingsMap[sym] = { symbol: sym, asset: tx.asset, totalShares: 0, totalSpent: 0, txCount: 0 };
                const s = Number(tx.shares) || 0, a = Number(tx.amount) || 0;
                if (tx.type === '存入') { holdingsMap[sym].totalShares += s; holdingsMap[sym].totalSpent += a; }
                else { holdingsMap[sym].totalShares -= s; holdingsMap[sym].totalSpent -= a; }
                holdingsMap[sym].txCount += 1;
            });
            const holdingsList = Object.values(holdingsMap);
            const twHoldings = holdingsList.filter(h => h.asset === 'TW_STOCK');
            const usHoldings = holdingsList.filter(h => h.asset === 'US_STOCK');
            const twStockVal = appData.enableTWStock ? appData.assets.TW_STOCK : 0;
            const usStockValUSD = appData.enableUSStock ? appData.assets.US_STOCK : 0;
            const usStockValTWD = usStockValUSD * appData.usdExchangeRate;

        function confirmEditCategory() {
            const oldName = document.getElementById('edit-category-old-name').value;
            const newName = document.getElementById('edit-category-new-name').value.trim();
            if (!newName || oldName === newName) { closeModal('category-edit-modal'); return; }
            if (appData.categories.includes(newName)) { showToast("修改失敗", "該分類名稱已存在。"); return; }
            
            const idx = appData.categories.indexOf(oldName);
            if (idx !== -1) appData.categories[idx] = newName;
            appData.transactions.forEach(t => { if (t.category === oldName) t.category = newName; });
            
            if (appData.budgets && appData.budgets[oldName]) {
                appData.budgets[newName] = appData.budgets[oldName];
                delete appData.budgets[oldName];
            }

            const inputCat = document.getElementById('input-category');
            if (inputCat && inputCat.value === oldName) {
                inputCat.value = newName;
                document.getElementById('tx-category-btn-txt').innerText = newName;
            }
            
            saveData(true);
            closeModal('category-edit-modal');
            closeModal('custom-option-modal');
            showToast("修改成功", `已將分類更名為「${newName}」。`);
        }

        function deleteCategoryItem(catName) {
            if (appData.categories.length <= 1) { showToast("無法刪除", "至少需保留一個分類。"); return; }
            appData.categories = appData.categories.filter(c => c !== catName);
            if (appData.budgets && appData.budgets[catName]) {
                delete appData.budgets[catName];
            }
            appData.transactions.forEach(t => { if (t.category === catName) t.category = '其他款項'; });
            
            const inputCat = document.getElementById('input-category');
            if (inputCat && inputCat.value === catName) {
                const fallback = appData.categories[0] || '其他款項';
                inputCat.value = fallback;
                document.getElementById('tx-category-btn-txt').innerText = fallback;
            }
            
            saveData(true);
            closeModal('custom-option-modal');
            showToast("已刪除", `分類「${catName}」已刪除。`);
        }

        function handleRecurringSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('rec-name').value;
