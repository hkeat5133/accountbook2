            const startDateStr = document.getElementById('rec-date-val').value || getLocalDateStr();
            const day = parseInt(startDateStr.split('-')[2]) || 1;
            const amount = parseFloat(document.getElementById('rec-amount').value) || 0;
            const asset = document.getElementById('rec-asset-val').value || 'TWD';
            if (!name || amount <= 0) return;

            appData.recurringRules.push({ id: 'r_' + Date.now(), name, type, startDate: startDateStr, day, amount, asset, category: '固定支出/存入', lastExecutedMonth: '' });
            saveData(true);
            closeModal('recurring-modal');
            checkRecurringTransactions();
            showToast("建立成功", `已新增「${name}」規則（日期：${startDateStr}）。`);
        }

        function handleInstallmentSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('inst-name').value;
            const total = parseFloat(document.getElementById('inst-total').value) || 0;
            const months = parseInt(document.getElementById('inst-months').value) || 12;
            const startDate = document.getElementById('inst-date-val').value || getLocalDateStr();
            const deductionDay = parseInt(startDate.split('-')[2]) || 1;
            if (!name || total <= 0 || months <= 0) return;

            const monthlyAmount = Math.round(total / months);
            appData.installments.push({ id: 'inst_' + Date.now(), name, totalAmount: total, monthlyAmount, totalMonths: months, paidMonths: 0, startDate, day: deductionDay, lastPaidMonth: '', asset: 'TWD' });
            saveData(true);
            closeModal('installment-modal');
            checkRecurringTransactions();
            showToast("建立成功", `已新增分期「${name}」（起始日：${startDate}）。`);
        }

        function checkRecurringTransactions() {
            const today = new Date();
            const currentDay = today.getDate();
            const todayStr = getLocalDateStr(today);
            const currentMonthStr = getLocalMonthStr(today);
            let triggeredCount = 0;

            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            const sevenDaysAgoStr = getLocalDateStr(sevenDaysAgo);
            if (appData.notifications && appData.notifications.length > 0) {
                appData.notifications = appData.notifications.filter(n => {
                    const nDate = n.date || todayStr;
                    return nDate >= sevenDaysAgoStr;
                });
            }

            appData.recurringRules.forEach(rule => {
                const ruleStart = rule.startDate || todayStr;
                if (todayStr >= ruleStart && rule.lastExecutedMonth !== currentMonthStr) {
                    if (currentDay >= rule.day || todayStr >= ruleStart) {
                        rule.lastExecutedMonth = currentMonthStr;
                        const assetKey = rule.asset || 'TWD';
                        const amount = Number(rule.amount) || 0;
                        if (rule.type === '存入') {
                            appData.assets[assetKey] = (appData.assets[assetKey] || 0) + amount;
                        } else {
                            appData.assets[assetKey] = (appData.assets[assetKey] || 0) - amount;
                        }
                        const newTx = { id: 'auto_' + Date.now() + '_' + rule.id, type: rule.type, asset: assetKey, category: rule.category || '固定支出/存入', amount: amount, note: `[自動週期] ${rule.name}`, date: todayStr };
                        appData.transactions.unshift(newTx);
                        appData.notifications.unshift({ 
                            id: 'notif_' + Date.now(), 
                            title: '固定項目執行通知', 
                            message: `已自動執行「${rule.name}」固定${rule.type} NT$ ${amount.toLocaleString()}`, 
                            date: todayStr,
                            time: `${todayStr} ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}` 
                        });
                        appData.hasUnreadNotifications = true;
                        triggeredCount++;
                    }
                }
            });

            appData.installments.forEach(inst => {
                const instStart = inst.startDate || todayStr;
                if (inst.paidMonths < inst.totalMonths && todayStr >= instStart && inst.lastPaidMonth !== currentMonthStr) {
                    if (currentDay >= inst.day || todayStr >= instStart) {
                        inst.paidMonths += 1;
                        inst.lastPaidMonth = currentMonthStr;
                        const assetKey = inst.asset || 'TWD';
                        const monthlyAmt = Number(inst.monthlyAmount) || 0;
                        appData.assets[assetKey] = (appData.assets[assetKey] || 0) - monthlyAmt;

                        const newTx = { id: 'inst_tx_' + Date.now() + '_' + inst.id, type: '支出', asset: assetKey, category: '固定支出/存入', amount: monthlyAmt, note: `[分期自動扣款] ${inst.name} (${inst.paidMonths}/${inst.totalMonths}期)`, date: todayStr };
                        appData.transactions.unshift(newTx);
                        appData.notifications.unshift({ 
                            id: 'notif_' + Date.now(), 
                            title: '分期付款扣款通知', 
                            message: `已自動扣款分期項目「${inst.name}」第 ${inst.paidMonths}/${inst.totalMonths} 期，金額 NT$ ${monthlyAmt.toLocaleString()}`, 
                            date: todayStr,
                            time: `${todayStr} ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}` 
                        });
                        appData.hasUnreadNotifications = true;
                        triggeredCount++;
                    }
                }
            });

            if (triggeredCount > 0) saveData(true);
        }

                filterEndDate = selectedDate;

                updateDetailsViewDOM();

            const box = document.getElementById('export-jpg-date-picker-box');
            if (rangeVal === 'ALL' || rangeVal === 'RECENT30') { box.classList.add('hidden'); box.innerHTML = ''; }
            else if (rangeVal === 'SINGLE_DAY') {
                box.classList.remove('hidden');
                box.innerHTML = `<div class="flex items-center justify-between bg-app-input border border-app-line p-2 rounded-xl text-xs"><span class="text-app-muted">選擇日期:</span><button type="button" onclick="openCustomDatePicker('EXPORT_JPG_SINGLE')" class="bg-app-card text-brand-gold font-mono font-bold px-2.5 py-1 rounded-lg border border-brand-gold/40 flex items-center gap-1 active:scale-95"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${exportJpgCustomDate}</button></div>`;
            } else if (rangeVal === 'MONTHLY') {
                box.classList.remove('hidden');
                box.innerHTML = `<div class="flex items-center justify-between bg-app-input border border-app-line p-2 rounded-xl text-xs"><span class="text-app-muted">選擇月份:</span><button type="button" onclick="openCustomDatePicker('EXPORT_JPG_MONTH')" class="bg-app-card text-brand-gold font-mono font-bold px-2.5 py-1 rounded-lg border border-brand-gold/40 flex items-center gap-1 active:scale-95"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${exportJpgMonthDate}</button></div>`;
            } else if (rangeVal === 'CUSTOM') {
                box.classList.remove('hidden');
                box.innerHTML = `
                    <div class="space-y-1.5">
                        <div class="flex items-center justify-between bg-app-input border border-app-line p-2 rounded-xl text-xs"><span class="text-app-muted">起始日期:</span><button type="button" onclick="openCustomDatePicker('EXPORT_JPG_START')" class="bg-app-card text-brand-gold font-mono font-bold px-2.5 py-1 rounded-lg border border-brand-gold/40 flex items-center gap-1 active:scale-95"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${exportJpgStartDate}</button></div>
                        <div class="flex items-center justify-between bg-app-input border border-app-line p-2 rounded-xl text-xs"><span class="text-app-muted">結束日期:</span><button type="button" onclick="openCustomDatePicker('EXPORT_JPG_END')" class="bg-app-card text-brand-gold font-mono font-bold px-2.5 py-1 rounded-lg border border-brand-gold/40 flex items-center gap-1 active:scale-95"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${exportJpgEndDate}</button></div>
                    </div>
                `;
            }
            if (window.lucide) lucide.createIcons();
        }

        function generateAndDownloadJPG() {
            const assetKey = document.getElementById('export-jpg-asset-select').value;
            const rangeVal = document.getElementById('export-jpg-range-select').value;
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 1050;
            const ctx = canvas.getContext('2d');

            const isDark = appData.theme === 'dark';
            const bgColor = isDark ? '#1c1d1b' : '#f6f4ee';
            const cardBg = isDark ? '#272825' : '#ffffff';
            const borderCol = isDark ? '#454841' : '#d8d2c4';
            const textMain = isDark ? '#f0eee6' : '#2c2e2b';
            const textMuted = isDark ? '#939890' : '#7a7f78';
            const goldCol = '#c89b3c', blueCol = '#3a6b88', redCol = '#b84a39', greenCol = '#5b8c5a';

            ctx.fillStyle = bgColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = goldCol; ctx.lineWidth = 4; ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

            ctx.fillStyle = goldCol; ctx.font = '32px sans-serif'; ctx.fillText(appData.appTitle || '智慧帳本', 50, 75);
            ctx.fillStyle = textMuted; ctx.font = '16px sans-serif'; ctx.fillText(`產生日期：${new Date().toLocaleDateString('zh-TW')}`, 50, 110);

            ctx.strokeStyle = borderCol; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(50, 130); ctx.lineTo(750, 130); ctx.stroke();

            const twdCashInTWD = appData.enableTWD ? appData.assets.TWD : 0;
            const twdStockInTWD = appData.enableTWStock ? appData.assets.TW_STOCK : 0;
            const usdCashInTWD = appData.enableUSD ? (appData.assets.USD * appData.usdExchangeRate) : 0;
            const usdStockInTWD = appData.enableUSStock ? (appData.assets.US_STOCK * appData.usdExchangeRate) : 0;
            const myrCashInTWD = appData.enableMYR ? ((appData.assets.MYR || 0) * (appData.myrExchangeRate || 7.25)) : 0;
            const grandTotalTWD = twdCashInTWD + twdStockInTWD + usdCashInTWD + usdStockInTWD + myrCashInTWD;

            let assetName = '全部資產總覽', mainValStr = `$ ${grandTotalTWD.toLocaleString()} NTD`, subValStr = '';
            if (assetKey === 'TWD') { assetName = '台幣現金 (TWD)'; mainValStr = `$ ${appData.assets.TWD.toLocaleString()} NTD`; }
            else if (assetKey === 'TW_STOCK') { assetName = '台股市值 (TW Stock)'; mainValStr = `$ ${appData.assets.TW_STOCK.toLocaleString()} NTD`; }
            else if (assetKey === 'USD') { assetName = '美金現金 (USD)'; mainValStr = `$ ${appData.assets.USD.toLocaleString()} USD`; subValStr = `折合台幣約：NT$ ${(appData.assets.USD * appData.usdExchangeRate).toLocaleString('zh-TW', {maximumFractionDigits:0})}`; }
            else if (assetKey === 'US_STOCK') { assetName = '美股市值 (US Stock)'; mainValStr = `$ ${appData.assets.US_STOCK.toLocaleString()} USD`; subValStr = `折合台幣約：NT$ ${(appData.assets.US_STOCK * appData.usdExchangeRate).toLocaleString('zh-TW', {maximumFractionDigits:0})}`; }
            else if (assetKey === 'MYR') { assetName = '馬幣現金 (MYR)'; mainValStr = `$ ${(appData.assets.MYR || 0).toLocaleString()} MYR`; subValStr = `折合台幣約：NT$ ${((appData.assets.MYR || 0) * (appData.myrExchangeRate || 7.25)).toLocaleString('zh-TW', {maximumFractionDigits:0})}`; }

            ctx.fillStyle = cardBg;
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(50, 150, 700, 140, 16); ctx.fill(); }
            else ctx.fillRect(50, 150, 700, 140);
            ctx.strokeStyle = goldCol; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = textMuted; ctx.font = '18px sans-serif'; ctx.fillText(assetName, 80, 185);
            ctx.fillStyle = goldCol; ctx.font = '38px sans-serif'; ctx.fillText(mainValStr, 80, 240);
            if (subValStr) { ctx.fillStyle = textMuted; ctx.font = '16px sans-serif'; ctx.fillText(subValStr, 80, 270); }

            let startY = 320;
            if (assetKey === 'ALL') {
                ctx.fillStyle = textMain; ctx.font = '20px sans-serif'; ctx.fillText('資產配置分布', 50, startY + 25);
                startY += 40;
                const cards = [];
                if (appData.enableTWD) cards.push({ title: '台幣現金', val: `$ ${appData.assets.TWD.toLocaleString()} TWD`, col: goldCol });
                if (appData.enableTWStock) cards.push({ title: '台股市值', val: `$ ${appData.assets.TW_STOCK.toLocaleString()} TWD`, col: blueCol });
                if (appData.enableUSD) cards.push({ title: '美金現金', val: `$ ${appData.assets.USD.toLocaleString()} USD`, col: goldCol });
                if (appData.enableUSStock) cards.push({ title: '美股市值', val: `$ ${appData.assets.US_STOCK.toLocaleString()} USD`, col: blueCol });
                if (appData.enableMYR) cards.push({ title: '馬幣現金', val: `$ ${(appData.assets.MYR || 0).toLocaleString()} MYR`, col: goldCol });

                cards.forEach((c, idx) => {
                    const x = 50 + (idx % 2) * 360, y = startY + Math.floor(idx / 2) * 100;
                    ctx.fillStyle = cardBg;
                    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, 340, 85, 12); ctx.fill(); ctx.strokeStyle = borderCol; ctx.stroke(); }
                    else ctx.fillRect(x, y, 340, 85);
                    ctx.fillStyle = textMuted; ctx.font = '15px sans-serif'; ctx.fillText(c.title, x + 20, y + 30);
                    ctx.fillStyle = c.col; ctx.font = '20px sans-serif'; ctx.fillText(c.val, x + 20, y + 65);
                });
                startY += Math.ceil(cards.length / 2) * 105;
            }

            ctx.fillStyle = textMain; ctx.font = '20px sans-serif'; ctx.fillText('近期交易紀錄', 50, startY + 25);
            startY += 40;

            let filteredTxs = appData.transactions;
            if (assetKey !== 'ALL') filteredTxs = filteredTxs.filter(t => t.asset === assetKey);
            if (rangeVal === 'RECENT30') filteredTxs = filteredTxs.slice(0, 30);
            else if (rangeVal === 'SINGLE_DAY') filteredTxs = filteredTxs.filter(t => t.date === exportJpgCustomDate);
            else if (rangeVal === 'MONTHLY') filteredTxs = filteredTxs.filter(t => t.date.startsWith(exportJpgMonthDate));
            else if (rangeVal === 'CUSTOM') filteredTxs = filteredTxs.filter(t => t.date >= exportJpgStartDate && t.date <= exportJpgEndDate);
            filteredTxs = filteredTxs.slice(0, 7);

            if (filteredTxs.length === 0) {
                ctx.fillStyle = textMuted; ctx.font = '16px sans-serif'; ctx.fillText('尚無符合條件的交易明細紀錄', 50, startY + 30);
            } else {
                filteredTxs.forEach((tx, idx) => {
                    const y = startY + idx * 75;
                    ctx.fillStyle = cardBg;
                    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(50, y, 700, 65, 12); ctx.fill(); ctx.strokeStyle = borderCol; ctx.lineWidth = 1; ctx.stroke(); }
                    else ctx.fillRect(50, y, 700, 65);
                    const isExpense = tx.type === '支出';
                    const curStr = (tx.asset === 'USD' || tx.asset === 'US_STOCK') ? 'USD' : (tx.asset === 'MYR' ? 'RM' : 'NT$');
                    ctx.fillStyle = textMain; ctx.font = '16px sans-serif'; ctx.fillText(`${tx.stockSymbol ? tx.stockSymbol : tx.category || '一般交易'}`, 70, y + 32);
                    ctx.fillStyle = textMuted; ctx.font = '13px sans-serif'; ctx.fillText(`${tx.date} ${tx.note ? ' • ' + tx.note : ''} ${tx.shares ? ' • ' + tx.shares + '股' : ''}`, 70, y + 52);
                    ctx.fillStyle = isExpense ? redCol : greenCol; ctx.font = '18px sans-serif'; ctx.textAlign = 'right';
                    ctx.fillText(`${isExpense ? '-' : '+'} ${curStr} ${Number(tx.amount).toLocaleString()}`, 730, y + 40);
                    ctx.textAlign = 'left';
                });
            }

            ctx.fillStyle = textMuted; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`${appData.appTitle || '智慧帳本'} 報表`, canvas.width / 2, canvas.height - 35);
            ctx.textAlign = 'left';

            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/jpeg', 0.92);
            a.download = `資產報表_${assetKey}_${getLocalDateStr()}.jpg`;
            a.click();
            closeModal('export-jpg-modal');
            showToast("匯出成功", `已成功匯出「${assetName}」JPG 報表！`);
        }

        function exportJSONData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `wealth_backup_${getLocalDateStr()}.json`; a.click();
        }

        function importJSONData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.assets && imported.transactions) { appData = imported; saveData(true); showToast("還原成功", "備份資料已成功還原！"); }
                    else showToast("格式不符", "匯入的檔案格式不合。");
                } catch(err) { showToast("讀取失敗", "無法解析 JSON 檔案。"); }
            };
            reader.readAsText(file);
        }

        async function executeResetData() {
            closeModal('confirm-modal');
            const resetMode = document.querySelector('input[name="resetMode"]:checked')?.value || 'dataOnly';
            if (resetMode === 'all') {
                appData = JSON.parse(JSON.stringify(DEFAULT_STATE));
                appData.appTitle = "智慧帳本";
                saveData(true);
                await updateExchangeRateAuto(false);
                updateHeaderDate();
                showToast("完全重置完成", "系統所有資料與所有設定已恢復為出廠預設狀態！");
                setTimeout(() => location.reload(), 400);
            } else {
                appData.assets = { TWD: 0, TW_STOCK: 0, USD: 0, US_STOCK: 0, MYR: 0 };
                appData.transactions = [];
                appData.recurringRules = [];
                appData.installments = [];
                appData.notifications = [];
                appData.hasUnreadNotifications = false;
                appData.budgets = {};
                saveData(true);
                updateHeaderDate();
                showToast("資料重置完成", "所有資產、交易與預算資料已清空，設定已保留。");
                setTimeout(() => location.reload(), 400);
            }
        }
    </script>
</body>
