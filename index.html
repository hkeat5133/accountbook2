<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智慧帳本 - iPhone 15 Pro Max 模擬</title>

    <meta name="theme-color" content="#c89b3c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" id="manifest-link">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --color-gold: #c89b3c;
            --color-blue: #3a6b88;
            --color-red: #b84a39;
            --color-green: #5b8c5a;
            --color-dark: #2c2e2b;

            --bg-app: #f6f4ee;
            --bg-surface: #ffffff;
            --bg-card: #ece8df;
            --bg-input: #ffffff;
            --text-main: #2c2e2b;
            --text-muted: #7a7f78;
            --border-line: #d8d2c4;
            --phone-border: #222222;
            --outer-bg: #1c1c1e;
        }

        body.theme-dark {
            --bg-app: #1c1d1b;
            --bg-surface: #272825;
            --bg-card: #333530;
            --bg-input: #21221f;
            --text-main: #f0eee6;
            --text-muted: #939890;
            --border-line: #454841;
            --phone-border: #444446;
            --outer-bg: #000000;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--outer-bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        body.modal-open {
            overflow: hidden;
        }

        /* iPhone 15 Pro Max Mockup Frame (430px x 932px Ratio) */
        @media (min-width: 640px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: var(--outer-bg);
            }
            .phone-container {
                width: 430px;
                height: 932px;
                max-height: 96vh;
                margin: 0 auto;
                position: relative;
                background-color: var(--bg-app);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                border-radius: 55px;
                border: 12px solid var(--phone-border);
                box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
            }
        }

        @media (max-width: 639px) {
            .phone-container {
                width: 100vw;
                height: 100dvh;
                position: fixed;
                inset: 0;
                margin: 0;
                background-color: var(--bg-app);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                border: none;
                border-radius: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes slideLeft {
            from { opacity: 0; transform: translate3d(25px, 0, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        @keyframes slideRight {
            from { opacity: 0; transform: translate3d(-25px, 0, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .animate-fade { animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-left { animation: slideLeft 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-right { animation: slideRight 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 12px rgba(200, 155, 60, 0.25); }
            50% { box-shadow: 0 0 22px rgba(200, 155, 60, 0.5); }
        }

        .modal-backdrop {
            will-change: opacity;
            animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-backdrop.is-closing {
            animation: fadeOut 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-sheet {
            will-change: transform, opacity;
            transform: translate3d(0, 100%, 0);
            opacity: 0;
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
        }

        .modal-sheet.is-open {
            transform: translate3d(0, 0, 0);
            opacity: 1;
        }

        .modal-sheet.is-closing {
            transform: translate3d(0, 100%, 0) !important;
            opacity: 0 !important;
        }

        button, a, label[class*="cursor-pointer"], .cursor-pointer {
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), opacity 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }
        button:active, a:active, label[class*="cursor-pointer"]:active, .cursor-pointer:active {
            transform: scale(0.96) !important;
            opacity: 0.85 !important;
        }

        .pulse-gold { animation: pulseGold 2.5s infinite; }

        .bg-app-bg { background-color: var(--bg-app); }
        .bg-app-surface { background-color: var(--bg-surface); }
        .bg-app-card { background-color: var(--bg-card); }
        .bg-app-input { background-color: var(--bg-input); }
        .text-app-main { color: var(--text-main); }
        .text-app-muted { color: var(--text-muted); }
        .border-app-line { border-color: var(--border-line); }

        .bg-brand-gold { background-color: var(--color-gold); }
        .bg-brand-blue { background-color: var(--color-blue); }
        .bg-brand-red { background-color: var(--color-red); }
        .bg-brand-green { background-color: var(--color-green); }

        .text-brand-gold { color: var(--color-gold); }
        .text-brand-blue { color: var(--color-blue); }
        .text-brand-red { color: var(--color-red); }
        .text-brand-green { color: var(--color-green); }

        ::-webkit-scrollbar {
            display: none;
            width: 0px;
            height: 0px;
            background: transparent;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="theme-light">

    <div class="phone-container text-app-main flex flex-col relative overflow-hidden" id="app-phone-container">

        <!-- iPhone 15 Pro Max Dynamic Island & Status Bar -->
        <div class="w-full bg-app-surface px-6 pt-3 pb-2 flex justify-between items-center z-30 text-xs text-app-muted font-mono shrink-0 select-none">
            <span class="font-bold text-app-main" id="current-time">09:41</span>
            <!-- Dynamic Island Simulation -->
            <div class="w-28 h-7 bg-black rounded-full mx-auto flex items-center justify-between px-2 shadow-sm">
                <div class="w-2.5 h-2.5 bg-neutral-900 rounded-full"></div>
                <div class="w-2.5 h-2.5 bg-brand-gold rounded-full animate-pulse"></div>
            </div>
            <div class="flex items-center gap-1.5 font-bold text-app-main">
                <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                <span class="text-[10px]">100%</span>
                <i data-lucide="battery" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- Top Header Bar -->
        <header class="px-5 py-3 bg-app-surface border-b border-app-line flex justify-between items-center z-20 shrink-0 shadow-xs">
            <div class="flex items-center gap-1.5">
                <button onclick="toggleSettingsDrawer()" class="relative p-2 rounded-xl bg-app-card text-app-main border border-app-line" title="系統設定">
                    <i data-lucide="settings" class="w-5 h-5 text-brand-gold"></i>
                </button>
            </div>
            <div class="text-center">
                <h1 id="app-title-display" class="font-bold text-lg text-brand-gold tracking-wide flex items-center justify-center gap-2">
                    智慧帳本
                </h1>
                <p class="text-[11px] text-app-muted" id="header-date">2026 年 8 月 7 日</p>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="toggleNotificationDrawer()" class="relative p-2 rounded-xl bg-app-card text-app-main border border-app-line" title="通知紀錄">
                    <i data-lucide="bell" class="w-5 h-5 text-brand-gold"></i>
                    <span id="notif-badge" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-brand-red rounded-full ring-2 ring-white"></span>
                </button>
            </div>
        </header>

        <!-- Main Content Scroll Area -->
        <main class="flex-1 overflow-y-scroll p-4 space-y-4 pb-28 relative w-full touch-pan-y" id="main-content"></main>

        <!-- Floating Action Button -->
        <div class="absolute bottom-20 right-5 z-30">
            <button onclick="openTransactionModal()" class="bg-brand-gold text-white p-4 rounded-full shadow-2xl flex items-center justify-center pulse-gold">
                <i data-lucide="plus" class="w-6 h-6 stroke-[2.5]"></i>
            </button>
        </div>

        <!-- Bottom Navigation Bar & Home Indicator Bar -->
        <nav class="w-full bg-app-surface border-t border-app-line px-3 pt-2.5 pb-2 flex flex-col items-center absolute bottom-0 left-0 right-0 z-30 shrink-0">
            <div class="w-full flex justify-around items-center mb-1">
                <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center py-1 px-4 text-brand-gold font-bold">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-1 font-medium">首頁資產</span>
                </button>
                <button onclick="switchTab('details')" id="nav-details" class="flex flex-col items-center py-1 px-4 text-app-muted font-medium">
                    <i data-lucide="receipt" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-1 font-medium">資產明細</span>
                </button>
                <button onclick="switchTab('stock-stats')" id="nav-stock-stats" class="flex flex-col items-center py-1 px-4 text-app-muted font-medium">
                    <i data-lucide="trending-up" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-1 font-medium">持股統計</span>
                </button>
            </div>
            <!-- iOS Home Indicator Bar -->
            <div class="w-32 h-1 bg-gray-400 dark:bg-gray-600 rounded-full mb-1"></div>
        </nav>

        <!-- Splash Screen -->
        <div id="splash-screen" class="absolute inset-0 bg-app-bg z-50 flex flex-col items-center justify-center transition-opacity duration-700">
            <div class="relative flex flex-col items-center animate-pop">
                <div class="w-24 h-24 rounded-3xl bg-app-surface p-1 shadow-xl flex items-center justify-center mb-5 border border-brand-gold/40">
                    <div class="w-full h-full bg-app-card rounded-[22px] flex items-center justify-center">
                        <i data-lucide="wallet" class="w-12 h-12 text-brand-gold"></i>
                    </div>
                </div>
                <h1 class="text-2xl font-bold tracking-wider text-brand-gold mb-1">智慧帳本</h1>
                <p class="text-xs text-brand-blue tracking-widest uppercase font-mono">iPhone 15 Pro Max Edition</p>
                <div class="mt-8 flex gap-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-brand-gold animate-ping"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-brand-blue animate-ping" style="animation-delay: 0.2s"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-brand-green animate-ping" style="animation-delay: 0.4s"></div>
                </div>
            </div>
        </div>

        <!-- Notification Drawer -->
        <div id="notif-drawer" onclick="closeModal('notif-drawer')" class="modal-backdrop absolute inset-0 bg-black/50 z-40 hidden flex justify-end">
            <div class="modal-sheet w-4/5 max-w-xs bg-app-surface shadow-2xl p-4 flex flex-col h-full border-l border-app-line pt-6 pb-6" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center pb-3 border-b border-app-line shrink-0">
                    <h3 class="font-bold text-brand-gold flex items-center gap-2 text-xs">
                        <i data-lucide="bell-ring" class="w-4 h-4"></i> 自動支出及存入通知記錄
                    </h3>
                    <button onclick="closeModal('notif-drawer')" class="text-app-muted hover:text-app-main p-1">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="notif-list" class="flex-1 overflow-y-auto my-3 space-y-2 pr-1"></div>
                <button onclick="clearNotifications()" class="text-xs text-app-muted hover:text-brand-red text-center py-2 border-t border-app-line shrink-0">
                    清空歷史通知
                </button>
            </div>
        </div>

        <!-- Settings Drawer -->
        <div id="settings-drawer" onclick="closeModal('settings-drawer')" class="modal-backdrop absolute inset-0 bg-black/50 z-40 hidden flex justify-start">
            <div class="modal-sheet w-full max-w-full bg-app-surface shadow-2xl p-5 flex flex-col h-full pt-6 pb-6" onclick="event.stopPropagation()">
                <div class="flex items-center pb-3.5 border-b border-app-line shrink-0">
                    <div class="flex items-center gap-2">
                        <button onclick="closeModal('settings-drawer')" class="p-1.5 rounded-xl bg-app-card border border-app-line text-brand-gold hover:opacity-80" title="返回">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        </button>
                        <h3 class="font-bold text-brand-gold flex items-center gap-2 text-base tracking-wide">
                            <i data-lucide="settings" class="w-5 h-5"></i> 系統設定面板
                        </h3>
                    </div>
                </div>
                <div id="settings-drawer-content" class="flex-1 overflow-y-auto my-3 space-y-4 pr-0.5 pb-16"></div>
            </div>
        </div>

        <!-- Transaction Modal -->
        <div id="transaction-modal" onclick="closeModal('transaction-modal')" class="modal-backdrop absolute inset-0 bg-black/50 z-40 hidden flex items-end justify-center p-0">
            <div class="modal-sheet w-full bg-app-surface rounded-t-3xl p-5 border-t border-app-line max-h-[88vh] flex flex-col pb-6" onclick="event.stopPropagation()">
                <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full mx-auto mb-3 cursor-pointer shrink-0"></div>
                <div class="flex justify-between items-center mb-3 shrink-0">
                    <h2 class="text-lg font-bold text-brand-gold flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> 新增帳務交易
                    </h2>
                    <button onclick="closeModal('transaction-modal')" class="text-app-muted hover:text-app-main p-1">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <form id="tx-form" onsubmit="handleTransactionSubmit(event)" class="flex-1 overflow-y-auto flex flex-col text-xs pb-1 pr-0.5">
                    <div class="space-y-3 flex-1 overflow-y-auto pr-0.5">
                        <div class="grid grid-cols-2 gap-2 bg-app-card p-1 rounded-xl text-sm shrink-0">
                            <button type="button" onclick="setModalMode('cash')" id="btn-mode-cash" class="py-2 rounded-lg font-medium transition-all bg-brand-gold text-white shadow">現金收支</button>
                            <button type="button" onclick="setModalMode('stock')" id="btn-mode-stock" class="py-2 rounded-lg font-medium transition-all text-app-muted">股票買賣</button>
                        </div>

                        <div class="flex gap-2 shrink-0">
                            <label onclick="setTxType('支出')" class="flex-1 text-center py-2.5 rounded-xl border border-app-line cursor-pointer transition-all shadow-sm" id="label-type-out">
                                <input type="radio" name="txType" value="支出" class="hidden" checked onchange="setTxType('支出')">
                                <span class="font-bold text-brand-red text-sm" id="txt-type-out">支出</span>
                            </label>
                            <label onclick="setTxType('存入')" class="flex-1 text-center py-2.5 rounded-xl border border-app-line cursor-pointer transition-all" id="label-type-in">
                                <input type="radio" name="txType" value="存入" class="hidden" onchange="setTxType('存入')">
                                <span class="font-bold text-brand-green text-sm" id="txt-type-in">存入</span>
                            </label>
                        </div>

                        <div id="field-asset-select">
                            <label class="block text-app-muted mb-1">選擇資產帳戶</label>
                            <input type="hidden" id="input-asset-type" value="TWD">
                            <button type="button" onclick="triggerTxAssetPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium">
                                <span id="tx-asset-btn-txt">台幣帳戶 (TWD)</span>
                                <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                            </button>
                        </div>

                        <div id="field-stock-market" class="hidden">
                            <label class="block text-app-muted mb-1">股票市場</label>
                            <input type="hidden" id="input-stock-market" value="TW_STOCK">
                            <button type="button" onclick="triggerTxMarketPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium">
                                <span id="tx-market-btn-txt">台股 (TWD)</span>
                                <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                            </button>
                        </div>

                        <div id="field-stock-details" class="hidden space-y-3">
                            <div>
                                <label class="block text-app-muted mb-1">股票標的 / 代碼</label>
                                <div class="relative flex items-center">
                                    <input type="text" id="input-stock-symbol" placeholder="例：2330 台積電 或 AAPL" oninput="toggleClearBtn(this)" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold">
                                    <button type="button" onclick="clearInput('input-stock-symbol')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-app-muted mb-1">交易股數</label>
                                    <div class="relative flex items-center">
                                        <input type="number" id="input-stock-shares" step="any" placeholder="0" oninput="toggleClearBtn(this); calculateStockTotal();" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold">
                                        <button type="button" onclick="clearInput('input-stock-shares', 'calculateStockTotal')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-app-muted mb-1">每股成交價</label>
                                    <div class="relative flex items-center">
                                        <input type="number" id="input-stock-price" step="any" placeholder="0" oninput="toggleClearBtn(this); calculateStockTotal();" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold">
                                        <button type="button" onclick="clearInput('input-stock-price', 'calculateStockTotal')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label class="block text-app-muted mb-1">手續費金額</label>
                                <div class="relative flex items-center">
                                    <input type="number" id="input-stock-fee" step="any" placeholder="0" oninput="toggleClearBtn(this); calculateStockTotal();" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold">
                                    <button type="button" onclick="clearInput('input-stock-fee', 'calculateStockTotal')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                                </div>
                            </div>
                        </div>

                        <div id="field-category">
                            <label class="block text-app-muted mb-1">消費 / 收入分類</label>
                            <input type="hidden" id="input-category" value="🍱 餐飲美食">
                            <button type="button" onclick="triggerTxCategoryPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium">
                                <span id="tx-category-btn-txt">🍱 餐飲美食</span>
                                <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                            </button>
                        </div>

                        <div>
                            <label class="block text-app-muted mb-1">金額 <span id="auto-calc-notice" class="text-brand-gold text-[10px] font-normal hidden">(自動計算總額)</span></label>
                            <div class="relative flex items-center">
                                <input type="number" id="input-amount" step="any" required placeholder="0" oninput="toggleClearBtn(this)" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main font-medium outline-none focus:border-brand-gold">
                                <button type="button" onclick="clearInput('input-amount')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-app-muted mb-1">日期</label>
                                <button type="button" onclick="openCustomDatePicker('TX_INPUT')" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main text-left flex items-center justify-between">
                                    <span class="flex items-center gap-1 font-mono text-xs">
                                        <i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i>
                                        <span id="input-date-display">2026-08-07</span>
                                    </span>
                                    <input type="hidden" id="input-date" value="2026-08-07">
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-app-muted shrink-0"></i>
                                </button>
                            </div>
                            <div>
                                <label class="block text-app-muted mb-1">備註說明</label>
                                <div class="relative flex items-center">
                                    <input type="text" id="input-note" placeholder="可選填..." oninput="toggleClearBtn(this)" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold">
                                    <button type="button" onclick="clearInput('input-note')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-brand-gold text-white font-bold py-3 rounded-xl mt-3 hover:opacity-90 transition-all shadow-md text-sm shrink-0">
                        確認儲存交易
                    </button>
                </form>
            </div>
        </div>

        <!-- Toast Modal -->

    <script>
        function getLocalDateStr(dateObj = new Date()) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getLocalMonthStr(dateObj = new Date()) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            return `${year}-${month}`;
        }

        function getDaysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }

        const DEFAULT_STATE = {
            appTitle: "智慧帳本",
            theme: "light",
            usdExchangeRate: 32.5,
            categoryBudgets: {},
            categories: [
                '🍱 餐飲美食', '🛒 日常購物', '🚗 交通出行', '🎮 娛樂休閒',
                '💰 薪資收入', '📈 投資收益', '🔄 固定扣款', '📝 其他雜項'
            ],
            assets: { TWD: 0, TW_STOCK: 0, USD: 0, US_STOCK: 0 },
            recurringRules: [],
            installments: [],
            notifications: [],
            transactions: []
        };

        let appData = loadAppData();
        let currentTab = 'home';
        let currentModalMode = 'cash';
        let filterAsset = 'ALL';
        let filterRange = 'RECENT30';
        let filterType = 'ALL';
        let stockSubFilter = 'ALL';
        
        let filterCustomDate = getLocalDateStr();
        let filterStartDate = getLocalDateStr();
        let filterEndDate = getLocalDateStr();
        let filterMonthDate = getLocalMonthStr();

        let datePickerTarget = null;
        let currentOptionTarget = null;

        function getValidCategoriesForType(txType) {
            if (txType === '存入') {
                return ['💰 薪資收入', '📈 投資收益', '📝 其他雜項', ...appData.categories.filter(c => !['🍱 餐飲美食', '🛒 日常購物', '🚗 交通出行', '🎮 娛樂休閒', '💰 薪資收入', '📈 投資收益', '🔄 固定扣款', '📝 其他雜項'].includes(c))];
            } else {
                const excludeKeywords = ['薪資收入', '固定扣款', '投資收益'];
                return appData.categories.filter(cat => !excludeKeywords.some(kw => cat.includes(kw)));
            }
        }

        function loadAppData() {
            const saved = localStorage.getItem('wealth_app_data_v22_iphone');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (!parsed.categories || !Array.isArray(parsed.categories)) {
                        parsed.categories = [...DEFAULT_STATE.categories];
                    }
                    if (!parsed.assets) {
                        parsed.assets = { TWD: 0, TW_STOCK: 0, USD: 0, US_STOCK: 0 };
                    }
                    if (!parsed.categoryBudgets) {
                        parsed.categoryBudgets = {};
                    }
                    return parsed;
                } catch(e) { console.error(e); }
            }
            return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }

        function saveData(triggerRender = true) {
            localStorage.setItem('wealth_app_data_v22_iphone', JSON.stringify(appData));
            applyTheme();
            if (triggerRender) renderCurrentView();
        }

        function getLiveAssetBalance(assetKey) {
            const initial = appData.assets[assetKey] || 0;
            const netTx = appData.transactions
                .filter(tx => tx.asset === assetKey)
                .reduce((sum, tx) => {
                    return sum + (tx.type === '存入' ? Number(tx.amount) : -Number(tx.amount));
                }, 0);
            return initial + netTx;
        }

        function applyTheme() {
            if (appData.theme === 'light') {
                document.body.classList.add('theme-light');
                document.body.classList.remove('theme-dark');
            } else {
                document.body.classList.add('theme-dark');
                document.body.classList.remove('theme-light');
            }
        }

        function setTheme(themeMode) {
            appData.theme = themeMode;
            saveData();
        }

        async function updateExchangeRateAuto(isManual = false) {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.rates && data.rates.TWD) {
                        const newRate = parseFloat(data.rates.TWD.toFixed(2));
                        if (newRate > 0) {
                            appData.usdExchangeRate = newRate;
                            saveData();
                            if (isManual) showToast("匯率即時更新成功", `1 USD = ${newRate} TWD`);
                        }
                    }
                }
            } catch (err) {
                if (isManual) showToast("更新失敗", "無法取得最新匯率，已保留當前匯率。");
            }
        }

        function updateHeaderDate() {
            const today = new Date();
            document.getElementById('header-date').innerText = `${today.getFullYear()} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日`;
            document.getElementById('app-title-display').innerText = appData.appTitle || '智慧帳本';
        }

        window.onload = function() {
            applyTheme();
            lucide.createIcons();
            const todayStr = getLocalDateStr();
            document.getElementById('input-date').value = todayStr;
            document.getElementById('input-date-display').innerText = todayStr;
            updateHeaderDate();
            checkRecurringTransactions();
            renderCurrentView();
            updateExchangeRateAuto();

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.classList.add('hidden'), 700);
                }
            }, 900);
        };

        function switchTab(tab, resetFilters = false) {
            if (resetFilters && tab !== currentTab) {
                filterAsset = 'ALL';
                filterRange = 'RECENT30';
                filterType = 'ALL';
                stockSubFilter = 'ALL';
            }
            currentTab = tab;
            ['home', 'details', 'stock-stats'].forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                if (navBtn) {
                    navBtn.className = t === tab ? "flex flex-col items-center py-1 px-4 text-brand-gold font-bold" : "flex flex-col items-center py-1 px-4 text-app-muted font-medium";
                }
            });

            const main = document.getElementById('main-content');
            if (main) {
                main.scrollTop = 0;
                main.classList.remove('animate-fade', 'animate-slide-left', 'animate-slide-right');
                void main.offsetWidth;
                main.classList.add('animate-fade');
            }
            renderCurrentView();
        }

        function navigateToDetails(assetKey) {
            filterAsset = assetKey;
            filterRange = 'RECENT30';
            filterType = 'ALL';
            switchTab('details', false);
        }

        function renderCurrentView() {
            const main = document.getElementById('main-content');
            if (!main) return;
            main.innerHTML = '';
            if (currentTab === 'home') renderHomeView(main);
            else if (currentTab === 'details') renderDetailsView(main);
            else if (currentTab === 'stock-stats') renderStockStatsView(main);
            
            const settingsDrawer = document.getElementById('settings-drawer');
            if (settingsDrawer && !settingsDrawer.classList.contains('hidden')) {
                renderSettingsDrawerContent();
            }

            if (window.lucide) lucide.createIcons();
            updateNotificationBadge();
        }

        function toggleClearBtn(inputElem) {
            if (!inputElem) return;
            const parent = inputElem.parentElement;
            if (!parent) return;
            const btn = parent.querySelector('.clear-btn');
            if (btn) {
                if (inputElem.value && inputElem.value.trim() !== '') btn.classList.remove('hidden');
                else btn.classList.add('hidden');
            }
        }

        function clearInput(inputId, callbackFnName) {
            const elem = document.getElementById(inputId);
            if (elem) {
                elem.value = '';
                toggleClearBtn(elem);
                if (callbackFnName && typeof window[callbackFnName] === 'function') window[callbackFnName]();
            }
        }

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.style.backgroundColor = '';
            document.body.classList.add('modal-open');
            modal.classList.remove('hidden');
            modal.classList.remove('is-closing');
            
            const sheet = modal.querySelector('.modal-sheet');
            if (sheet) {
                sheet.style.transform = '';
                sheet.style.transition = '';
                sheet.classList.remove('is-closing');
                void sheet.offsetWidth;
                sheet.classList.add('is-open');
            }
            if (window.lucide) lucide.createIcons();
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.style.backgroundColor = '';
            modal.classList.add('is-closing');
            const sheet = modal.querySelector('.modal-sheet');
            if (sheet) {
                sheet.style.transform = '';
                sheet.style.transition = '';
                sheet.classList.remove('is-open');
                sheet.classList.add('is-closing');
            }
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('is-closing');
                if (sheet) sheet.classList.remove('is-closing');
                document.body.classList.remove('modal-open');
                resetModalContent(modalId);
            }, 300);
        }

        function resetModalContent(modalId) {
            if (modalId === 'transaction-modal') {
                ['input-amount', 'input-note', 'input-stock-symbol', 'input-stock-shares', 'input-stock-price', 'input-stock-fee'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
                document.querySelectorAll('#transaction-modal .clear-btn').forEach(b => b.classList.add('hidden'));
            }
        }

        function toggleNotificationDrawer() {
            const drawer = document.getElementById('notif-drawer');
            if (!drawer) return;
            if (drawer.classList.contains('hidden')) {
                openModal('notif-drawer');
                renderNotifications();
                markNotificationsAsRead();
            } else {
                closeModal('notif-drawer');
            }
        }

        function markNotificationsAsRead() {
            if (appData.notifications && appData.notifications.length > 0) {
                let updated = false;
                appData.notifications.forEach(n => {
                    if (n.read === false) { n.read = true; updated = true; }
                });
                if (updated) { saveData(false); updateNotificationBadge(); }
            }
        }

        function toggleSettingsDrawer() {
            const drawer = document.getElementById('settings-drawer');
            if (!drawer) return;
            if (drawer.classList.contains('hidden')) {
                openModal('settings-drawer');
                renderSettingsDrawerContent();
            } else {
                closeModal('settings-drawer');
            }
        }

        function renderSettingsDrawerContent() {
            const container = document.getElementById('settings-drawer-content');
            if (!container) return;
            renderSettingsContentInto(container);
            if (window.lucide) lucide.createIcons();
        }

        function renderNotifications() {
            const container = document.getElementById('notif-list');
            if (!container) return;
            if (!appData.notifications || appData.notifications.length === 0) {
                container.innerHTML = `<div class="text-xs text-app-muted text-center py-6">目前沒有通知紀錄</div>`;
                return;
            }
            container.innerHTML = appData.notifications.map(n => `
                <div class="bg-app-card p-2.5 rounded-xl border border-app-line text-xs space-y-1">
                    <div class="flex justify-between items-center font-bold text-brand-gold">
                        <span>${n.title}</span>
                        <span class="text-[10px] text-app-muted font-mono">${n.time}</span>
                    </div>
                    <p class="text-app-main text-[11px]">${n.message}</p>
                </div>
            `).join('');
        }

        function clearNotifications() {
            appData.notifications = [];
            saveData();
            renderNotifications();
        }

        function updateNotificationBadge() {
            const badge = document.getElementById('notif-badge');
            if (!badge) return;
            const hasUnread = appData.notifications && appData.notifications.some(n => n.read === false);
            if (hasUnread) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
        }

        function showToast(title, msg) {
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            openModal('toast-modal');
        }

        function openTransactionModal() {
            openModal('transaction-modal');
            setModalMode(currentModalMode);
            const currentTxType = document.querySelector('input[name="txType"]:checked')?.value || '支出';
            setTxType(currentTxType);
        }

        function setModalMode(mode) {
            currentModalMode = mode;
            const btnCash = document.getElementById('btn-mode-cash');
            const btnStock = document.getElementById('btn-mode-stock');
            const fieldCategory = document.getElementById('field-category');
            const fieldAsset = document.getElementById('field-asset-select');
            const fieldStockMarket = document.getElementById('field-stock-market');
            const fieldStockDetails = document.getElementById('field-stock-details');
            const autoNotice = document.getElementById('auto-calc-notice');

            if (mode === 'cash') {
                btnCash.className = "py-2 rounded-lg font-medium transition-all bg-brand-gold text-white shadow";
                btnStock.className = "py-2 rounded-lg font-medium transition-all text-app-muted";
                fieldCategory.classList.remove('hidden');
                fieldAsset.classList.remove('hidden');
                fieldStockMarket.classList.add('hidden');
                fieldStockDetails.classList.add('hidden');
                autoNotice.classList.add('hidden');
                document.getElementById('txt-type-out').innerText = '支出';
                document.getElementById('txt-type-in').innerText = '存入';
                
                const txType = document.querySelector('input[name="txType"]:checked')?.value || '支出';
                setTxType(txType);
            } else {
                btnStock.className = "py-2 rounded-lg font-medium transition-all bg-brand-gold text-white shadow";
                btnCash.className = "py-2 rounded-lg font-medium transition-all text-app-muted";
                fieldCategory.classList.add('hidden');
                fieldAsset.classList.add('hidden');
                fieldStockMarket.classList.remove('hidden');
                fieldStockDetails.classList.remove('hidden');
                autoNotice.classList.remove('hidden');
                document.getElementById('txt-type-out').innerText = '賣出股票';
                document.getElementById('txt-type-in').innerText = '買進股票';
            }
        }

        function setTxType(val) {
            document.getElementsByName('txType').forEach(r => { if (r.value === val) r.checked = true; });
            const labelOut = document.getElementById('label-type-out');
            const labelIn = document.getElementById('label-type-in');
            const isSellOrExpense = (val === '支出' || val === '賣出股票');

            if (isSellOrExpense) {
                if (labelOut) {
                    labelOut.className = "flex-1 text-center py-2.5 rounded-xl border-2 border-brand-red bg-brand-red/10 cursor-pointer transition-all shadow-sm";
                    labelOut.style.borderColor = "var(--color-red)";
                }
                if (labelIn) {
                    labelIn.className = "flex-1 text-center py-2.5 rounded-xl border border-app-line opacity-60 cursor-pointer transition-all hover:opacity-100";
                    labelIn.style.borderColor = "";
                }
            } else {
                if (labelIn) {
                    labelIn.className = "flex-1 text-center py-2.5 rounded-xl border-2 border-brand-green bg-brand-green/10 cursor-pointer transition-all shadow-sm";
                    labelIn.style.borderColor = "var(--color-green)";
                }
                if (labelOut) {
                    labelOut.className = "flex-1 text-center py-2.5 rounded-xl border border-app-line opacity-60 cursor-pointer transition-all hover:opacity-100";
                    labelOut.style.borderColor = "";
                }
            }

            if (currentModalMode === 'cash') {
                const validCats = getValidCategoriesForType(val);
                const currentCat = document.getElementById('input-category').value;
                if (!validCats.includes(currentCat)) {
                    const fallbackCat = validCats[0];
                    document.getElementById('input-category').value = fallbackCat;
                    document.getElementById('tx-category-btn-txt').innerText = fallbackCat;
                }
            }
        }

        function calculateStockTotal() {
            if (currentModalMode !== 'stock') return;
            const shares = parseFloat(document.getElementById('input-stock-shares').value) || 0;
            const price = parseFloat(document.getElementById('input-stock-price').value) || 0;
            const fee = parseFloat(document.getElementById('input-stock-fee').value) || 0;
            const total = (shares * price) + fee;
            const amountElem = document.getElementById('input-amount');
            amountElem.value = total > 0 ? total.toFixed(2) : '';
            toggleClearBtn(amountElem);
        }

        function handleTransactionSubmit(e) {
            e.preventDefault();
            const txType = document.querySelector('input[name="txType"]:checked').value;
            const amount = parseFloat(document.getElementById('input-amount').value) || 0;
            const date = document.getElementById('input-date').value || getLocalDateStr();
            const note = document.getElementById('input-note').value || '';

            let asset = 'TWD', category = '🍱 餐飲美食', stockSymbol = '', shares = 0, price = 0, fee = 0;
            if (currentModalMode === 'cash') {
                asset = document.getElementById('input-asset-type').value;
                category = document.getElementById('input-category').value;
            } else {
                asset = document.getElementById('input-stock-market').value;
                stockSymbol = document.getElementById('input-stock-symbol').value || '股票交易';
                shares = parseFloat(document.getElementById('input-stock-shares').value) || 0;
                price = parseFloat(document.getElementById('input-stock-price').value) || 0;
                fee = parseFloat(document.getElementById('input-stock-fee').value) || 0;
                category = txType === '存入' ? '股票買進' : '股票賣出';
            }

            const newTx = { id: 'tx_' + Date.now(), type: txType, asset, category, amount, note, date, stockSymbol, shares, price, fee };
            appData.transactions.unshift(newTx);
            saveData();
            closeModal('transaction-modal');
        }

        function deleteTransaction(id) {
            const idx = appData.transactions.findIndex(t => t.id === id);
            if (idx !== -1) { appData.transactions.splice(idx, 1); saveData(); }
        }

        function openStockHistoryModal(symbol) {
            const stockTxList = appData.transactions.filter(tx => (tx.asset === 'TW_STOCK' || tx.asset === 'US_STOCK') && tx.stockSymbol === symbol);
            let totalShares = 0, totalCost = 0;
            stockTxList.forEach(tx => {
                const s = Number(tx.shares) || 0, a = Number(tx.amount) || 0;
                if (tx.type === '存入') { totalShares += s; totalCost += a; }
                else { totalShares -= s; totalCost -= a; }
            });
            const avgPrice = totalShares > 0 ? (totalCost / totalShares).toFixed(2) : 0;
            const isTW = stockTxList.length > 0 && stockTxList[0].asset === 'TW_STOCK';
            const currSymbol = isTW ? 'NT$' : '$';

            document.getElementById('stock-modal-symbol').innerText = `${symbol} 交易歷史`;
            document.getElementById('stock-modal-summary').innerHTML = `
                <div class="flex justify-between items-center text-xs">
                    <div><span class="text-app-muted">持股總數:</span> <strong class="font-mono text-app-main">${totalShares.toLocaleString()} 股</strong></div>
                    <div><span class="text-app-muted">平均成本:</span> <strong class="font-mono text-brand-gold">${currSymbol}${Number(avgPrice).toLocaleString()}</strong></div>
                </div>
            `;
            const listContainer = document.getElementById('stock-modal-list');
            if (stockTxList.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-app-muted py-4 text-xs">查無該股票的歷史紀錄</div>`;
            } else {
                listContainer.innerHTML = stockTxList.map(tx => `
                    <div class="bg-app-card border border-app-line p-2.5 rounded-xl flex justify-between items-center text-xs">
                        <div>
                            <div class="font-bold text-app-main flex items-center gap-1">
                                <span class="${tx.type === '存入' ? 'text-brand-green' : 'text-brand-red'} font-bold">${tx.type === '存入' ? '買進' : '賣出'}</span>
                                <span class="font-mono text-[10px] text-app-muted">(${tx.date})</span>
                            </div>
                            <div class="text-[10px] text-app-muted font-mono mt-0.5">${tx.shares} 股 @ ${currSymbol}${tx.price}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold font-mono text-xs ${tx.type === '存入' ? 'text-brand-green' : 'text-brand-red'}">${currSymbol}${Number(tx.amount).toLocaleString()}</div>
                            <button onclick="deleteTransaction('${tx.id}'); openStockHistoryModal('${symbol.replace(/'/g, "\\'")}');" class="text-[10px] text-app-muted hover:text-brand-red">刪除</button>
                        </div>
                    </div>
                `).join('');
            }
            openModal('stock-history-modal');
        }

        function saveTitleSetting() {
            const val = document.getElementById('setting-title')?.value;
            if (val !== undefined) { appData.appTitle = val; saveData(); updateHeaderDate(); showToast("更新成功", "App 標題名稱已更新。"); }
        }

        function saveCategoryBudgetExplicitly(cat, val) {
            if (!appData.categoryBudgets) appData.categoryBudgets = {};
            appData.categoryBudgets[cat] = val === '' ? 0 : (parseFloat(val) || 0);
            saveData();
        }

        function saveCategoryBudgetFromInput(cat, inputId) {
            const val = document.getElementById(inputId)?.value;
            saveCategoryBudgetExplicitly(cat, val);
            showToast("分類預算已設定", `「${cat}」本月預算已成功更新。`);
        }

        function resetCategoryBudgets() {
            appData.categoryBudgets = {};
            saveData();
            showToast("分類預算已重置", "所有分類支出預算已重置歸零。");
        }

        function saveAssetExplicitly(assetKey, val) {
            appData.assets[assetKey] = val === '' ? 0 : (parseFloat(val) || 0);
            saveData();
        }

        function saveAssetFromInput(assetKey, inputId) {
            const val = document.getElementById(inputId)?.value;
            appData.assets[assetKey] = val === '' || val === undefined ? 0 : (parseFloat(val) || 0);
            saveData();
            showToast("初始本金設定完成", `資產帳戶已成功更新。`);
        }

        function deleteRecurringRule(id) { appData.recurringRules = appData.recurringRules.filter(r => r.id !== id); saveData(); }
        function deleteInstallment(id) { appData.installments = appData.installments.filter(i => i.id !== id); saveData(); }

        function renderTxList(txList) {

                        </div>
                        <div class="bg-app-surface/90 p-3 rounded-xl border border-app-line space-y-2">

        function renderStockStatsView(container) {
            const stockTxList = appData.transactions.filter(tx => tx.asset === 'TW_STOCK' || tx.asset === 'US_STOCK');

                const s = Number(tx.shares) || 0, a = Number(tx.amount) || 0;
                if (tx.type === '存入') { holdingsMap[sym].totalShares += s; holdingsMap[sym].totalSpent += a; }
                else { holdingsMap[sym].totalShares -= s; holdingsMap[sym].totalSpent -= a; }
                holdingsMap[sym].txCount += 1;

        function openEditCategoryModal(catName) {
            document.getElementById('edit-category-old-name').value = catName;

        }

        function saveEditedCategory() {
            const oldName = document.getElementById('edit-category-old-name').value;
            const newName = document.getElementById('edit-category-input').value.trim();
            if (!newName || oldName === newName) { closeModal('edit-category-modal'); return; }
            if (appData.categories.includes(newName)) { showToast("編輯失敗", "該分類名稱已存在！"); return; }

            const idx = appData.categories.indexOf(oldName);
            if (idx !== -1) {
                appData.categories[idx] = newName;
                appData.transactions.forEach(tx => { if (tx.category === oldName) tx.category = newName; });
                saveData();
                closeModal('edit-category-modal');
                closeModal('custom-option-modal');
                showToast("編輯成功", `分類已更名為「${newName}」。`);
            }
        }

            openModal('delete-category-modal');

            showToast("已刪除", `分類「${catName}」已刪除。`);

            const newCat = input.value.trim();
            if (!newCat) return;
            if (!appData.categories.includes(newCat)) {
                appData.categories.push(newCat);
                saveData(false);
            }
            input.value = '';
            closeModal('custom-option-modal');
            showToast("新增成功", `已新增分類「${newCat}」。`);
        }

        function selectOptionValue(val, label) {
            if (currentOptionTarget === 'TX_ASSET') {
                document.getElementById('input-asset-type').value = val;
                document.getElementById('tx-asset-btn-txt').innerText = label;
            } else if (currentOptionTarget === 'TX_STOCK_MARKET') {
                document.getElementById('input-stock-market').value = val;
                document.getElementById('tx-market-btn-txt').innerText = label;
            } else if (currentOptionTarget === 'TX_CATEGORY') {
                document.getElementById('input-category').value = val;
                document.getElementById('tx-category-btn-txt').innerText = label;
            }
            closeModal('custom-option-modal');
        }

        function triggerTxAssetPicker() {
            openOptionModal('TX_ASSET', '選擇資產帳戶', [{ label: '台幣帳戶 (TWD)', value: 'TWD' }, { label: '美金帳戶 (USD)', value: 'USD' }], document.getElementById('input-asset-type').value);
        }
        function triggerTxMarketPicker() {
            openOptionModal('TX_STOCK_MARKET', '選擇股票市場', [{ label: '台股 (TWD)', value: 'TW_STOCK' }, { label: '美股 (USD)', value: 'US_STOCK' }], document.getElementById('input-stock-market').value);
        }
        function triggerTxCategoryPicker() {
            const currentTxType = document.querySelector('input[name="txType"]:checked')?.value || '支出';
            const validCats = getValidCategoriesForType(currentTxType);
            openOptionModal('TX_CATEGORY', `選擇 ${currentTxType} 分類`, validCats.map(c => ({ label: c, value: c })), document.getElementById('input-category').value);
        }

        function checkRecurringTransactions() {}
    </script>
</body>
</html>
