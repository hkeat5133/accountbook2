<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智慧帳本 - 理財</title>

    <meta name="theme-color" content="#c89b3c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="智慧帳本">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="manifest" id="manifest-link">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --color-gold: #c89b3c;
            --color-blue: #3a6b88;
            --color-red: #b84a39;
            --color-green: #5b8c5a;
            --color-dark: #2c2e2b;

            --bg-app: #f6f4ee;
            --bg-surface: #ffffff;
            --bg-card: #ece8df;
            --bg-input: #ffffff;
            --text-main: #2c2e2b;
            --text-muted: #7a7f78;
            --border-line: #d8d2c4;
            --phone-border: #d2cbba;
            --outer-bg: #f6f4ee;
        }

        body.theme-dark {
            --bg-app: #1c1d1b;
            --bg-surface: #272825;
            --bg-card: #333530;
            --bg-input: #21221f;
            --text-main: #f0eee6;
            --text-muted: #939890;
            --border-line: #454841;
            --phone-border: #2b2c28;
            --outer-bg: #1c1d1b;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--outer-bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        body.modal-open {
            overflow: hidden;
        }

        /* 經典完美的手機外框視圖（恢復改全屏之前的設定，保證絕無底部色塊） */
        .phone-container {
            width: 100%;
            max-width: 420px;
            height: 96vh;
            max-height: 900px;
            margin: auto;
            position: relative;
            background-color: var(--bg-app);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 40px;
            border: 8px solid var(--phone-border);
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.25);
        }

        @media (max-width: 639px) {
            body {
                background-color: var(--bg-app);
            }
            .phone-container {
                width: 100vw;
                height: 100dvh;
                max-height: none;
                margin: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes slideLeft {
            from { opacity: 0; transform: translate3d(25px, 0, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        @keyframes slideRight {
            from { opacity: 0; transform: translate3d(-25px, 0, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .animate-fade { animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-left { animation: slideLeft 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-right { animation: slideRight 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 12px rgba(200, 155, 60, 0.25); }
            50% { box-shadow: 0 0 22px rgba(200, 155, 60, 0.5); }
        }

        .modal-backdrop {
            will-change: opacity;
            animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-backdrop.is-closing {
            animation: fadeOut 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-sheet {
            will-change: transform, opacity;
            transform: translate3d(0, 100%, 0);
            opacity: 0;
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
        }

        .modal-sheet.is-open {
            transform: translate3d(0, 0, 0);
            opacity: 1;
        }

        .modal-sheet.is-closing {
            transform: translate3d(0, 100%, 0) !important;
            opacity: 0 !important;
        }

        button, a, label[class*="cursor-pointer"], .cursor-pointer {
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), opacity 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }
        button:active, a:active, label[class*="cursor-pointer"]:active, .cursor-pointer:active {
            transform: scale(0.96) !important;
            opacity: 0.85 !important;
        }

        .pulse-gold { animation: pulseGold 2.5s infinite; }

        .bg-app-bg { background-color: var(--bg-app); }
        .bg-app-surface { background-color: var(--bg-surface); }
        .bg-app-card { background-color: var(--bg-card); }
        .bg-app-input { background-color: var(--bg-input); }
        .text-app-main { color: var(--text-main); }
        .text-app-muted { color: var(--text-muted); }
        .border-app-line { border-color: var(--border-line); }

        .bg-brand-gold { background-color: var(--color-gold); }
        .bg-brand-blue { background-color: var(--color-blue); }
        .bg-brand-red { background-color: var(--color-red); }
        .bg-brand-green { background-color: var(--color-green); }

        .text-brand-gold { color: var(--color-gold); }
        .text-brand-blue { color: var(--color-blue); }
        .text-brand-red { color: var(--color-red); }
        .text-brand-green { color: var(--color-green); }

        ::-webkit-scrollbar {
            display: none;
            width: 0px;
            height: 0px;
            background: transparent;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="theme-light">

    <div class="phone-container text-app-main flex flex-col relative overflow-hidden" id="app-phone-container">

        <!-- Top Header Bar -->
        <header class="px-5 pt-3.5 pb-3.5 bg-app-surface border-b border-app-line flex justify-between items-center z-20 shrink-0 shadow-xs">
            <div class="flex items-center gap-1.5">
                <button onclick="toggleSettingsDrawer()" class="relative p-2 rounded-xl bg-app-card text-app-main transition-all border border-app-line" title="系統設定">
                    <i data-lucide="settings" class="w-5 h-5 text-brand-gold"></i>
                </button>
            </div>
            <div class="text-center">
                <h1 id="app-title-display" class="font-bold text-lg text-brand-gold tracking-wide flex items-center justify-center gap-2">
                    智慧帳本
                </h1>
                <p class="text-[11px] text-app-muted" id="header-date">2026 年 8 月 7 日</p>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="toggleNotificationDrawer()" class="relative p-2 rounded-xl bg-app-card text-app-main border border-app-line" title="通知紀錄">
                    <i data-lucide="bell" class="w-5 h-5 text-brand-gold"></i>
                    <span id="notif-badge" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-brand-red rounded-full ring-2 ring-white"></span>
                </button>
            </div>
        </header>

        <!-- Main Content Scroll Area -->
        <main class="flex-1 overflow-y-scroll p-4 space-y-4 pb-28 relative w-full touch-pan-y" id="main-content"></main>

        <!-- Floating Action Button -->
        <div class="absolute bottom-20 right-5 z-30">
            <button onclick="openTransactionModal()" class="bg-brand-gold text-white p-4 rounded-full shadow-xl flex items-center justify-center pulse-gold">
                <i data-lucide="plus" class="w-6 h-6 stroke-[2.5]"></i>
            </button>
        </div>

        <!-- Bottom Navigation Bar (Fixed Stable) -->
        <nav class="w-full bg-app-surface border-t border-app-line px-3 py-2.5 flex justify-around items-center absolute bottom-0 left-0 right-0 z-30 shrink-0">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center py-1 px-4 text-brand-gold font-bold">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">首頁資產</span>
            </button>
            <button onclick="switchTab('details')" id="nav-details" class="flex flex-col items-center py-1 px-4 text-app-muted font-medium">
                <i data-lucide="receipt" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">資產明細</span>
            </button>
            <button onclick="switchTab('stock-stats')" id="nav-stock-stats" class="flex flex-col items-center py-1 px-4 text-app-muted font-medium">
                <i data-lucide="trending-up" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">持股統計</span>
            </button>
        </nav>

        <!-- Splash Screen -->
        <div id="splash-screen" class="absolute inset-0 bg-app-bg z-50 flex flex-col items-center justify-center transition-opacity duration-700">
            <div class="relative flex flex-col items-center">
                <div class="w-24 h-24 rounded-3xl bg-app-surface p-1 shadow-xl flex items-center justify-center mb-5 border border-brand-gold/40">
                    <div class="w-full h-full bg-app-card rounded-[22px] flex items-center justify-center">
                        <i data-lucide="wallet" class="w-12 h-12 text-brand-gold"></i>
                    </div>
                </div>
                <h1 class="text-2xl font-bold tracking-wider text-brand-gold mb-1">智慧帳本</h1>
                <p class="text-xs text-brand-blue tracking-widest uppercase font-mono">Personal Wealth Ledger</p>
            </div>
        </div>

        <!-- Notification Drawer -->
        <div id="notif-drawer" onclick="closeModal('notif-drawer')" class="modal-backdrop absolute inset-0 bg-black/50 z-40 hidden flex justify-end">
            <div class="modal-sheet w-4/5 max-w-xs bg-app-surface shadow-2xl p-4 flex flex-col h-full border-l border-app-line" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center pb-3 border-b border-app-line shrink-0">
                    <h3 class="font-bold text-brand-gold flex items-center gap-2 text-xs">
                        <i data-lucide="bell-ring" class="w-4 h-4"></i> 自動通知紀錄
                    </h3>
                    <button onclick="closeModal('notif-drawer')" class="text-app-muted hover:text-app-main p-1">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="notif-list" class="flex-1 overflow-y-auto my-3 space-y-2 pr-1"></div>
                <button onclick="clearNotifications()" class="text-xs text-app-muted hover:text-brand-red text-center py-2 border-t border-app-line">清空歷史</button>
            </div>
        </div>

        <!-- Settings Drawer -->
        <div id="settings-drawer" onclick="closeModal('settings-drawer')" class="modal-backdrop absolute inset-0 bg-black/50 z-40 hidden flex justify-start">
            <div class="modal-sheet w-full max-w-full bg-app-surface shadow-2xl p-5 flex flex-col h-full" onclick="event.stopPropagation()">
                <div class="flex items-center pb-3.5 border-b border-app-line shrink-0">
                    <button onclick="closeModal('settings-drawer')" class="p-1.5 rounded-xl bg-app-card border border-app-line text-brand-gold mr-2">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <h3 class="font-bold text-brand-gold flex items-center gap-2 text-base">系統設定面板</h3>
                </div>
                <div id="settings-drawer-content" class="flex-1 overflow-y-auto my-3 space-y-4 pb-16"></div>
            </div>
        </div>

        <!-- Transaction Modal -->
        <div id="transaction-modal" onclick="closeModal('transaction-modal')" class="modal-backdrop absolute inset-0 bg-black/50 z-40 hidden flex items-end justify-center">
            <div class="modal-sheet w-full bg-app-surface rounded-t-3xl p-5 border-t border-app-line max-h-[85vh] flex flex-col" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center mb-3 shrink-0">
                    <h2 class="text-lg font-bold text-brand-gold flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> 新增帳務交易
                    </h2>
                    <button onclick="closeModal('transaction-modal')" class="text-app-muted p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>

                <form id="tx-form" onsubmit="handleTransactionSubmit(event)" class="flex-1 overflow-y-auto flex flex-col text-xs space-y-3 pb-2">
                    <div class="grid grid-cols-2 gap-2 bg-app-card p-1 rounded-xl text-sm">
                        <button type="button" onclick="setModalMode('cash')" id="btn-mode-cash" class="py-2 rounded-lg font-medium bg-brand-gold text-white shadow">現金收支</button>
                        <button type="button" onclick="setModalMode('stock')" id="btn-mode-stock" class="py-2 rounded-lg font-medium text-app-muted">股票買賣</button>
                    </div>

                    <div class="flex gap-2">
                        <label onclick="setTxType('支出')" class="flex-1 text-center py-2.5 rounded-xl border border-app-line cursor-pointer" id="label-type-out">
                            <input type="radio" name="txType" value="支出" class="hidden" checked onchange="setTxType('支出')">
                            <span class="font-bold text-brand-red text-sm" id="txt-type-out">支出</span>
                        </label>
                        <label onclick="setTxType('存入')" class="flex-1 text-center py-2.5 rounded-xl border border-app-line cursor-pointer" id="label-type-in">
                            <input type="radio" name="txType" value="存入" class="hidden" onchange="setTxType('存入')">
                            <span class="font-bold text-brand-green text-sm" id="txt-type-in">存入</span>
                        </label>
                    </div>

                    <div id="field-asset-select">
                        <label class="block text-app-muted mb-1">選擇資產帳戶</label>
                        <input type="hidden" id="input-asset-type" value="TWD">
                        <button type="button" onclick="triggerTxAssetPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium">
                            <span id="tx-asset-btn-txt">台幣帳戶 (TWD)</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                        </button>
                    </div>

                    <div id="field-stock-market" class="hidden">
                        <label class="block text-app-muted mb-1">股票市場</label>
                        <input type="hidden" id="input-stock-market" value="TW_STOCK">
                        <button type="button" onclick="triggerTxMarketPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium">
                            <span id="tx-market-btn-txt">台股 (TWD)</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                        </button>
                    </div>

                    <div id="field-stock-details" class="hidden space-y-3">
                        <div>
                            <label class="block text-app-muted mb-1">股票標的 / 代碼</label>
                            <input type="text" id="input-stock-symbol" placeholder="例：2330 台積電" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main outline-none focus:border-brand-gold">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-app-muted mb-1">交易股數</label>
                                <input type="number" id="input-stock-shares" step="any" placeholder="0" oninput="calculateStockTotal()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main outline-none">
                            </div>
                            <div>
                                <label class="block text-app-muted mb-1">每股成交價</label>
                                <input type="number" id="input-stock-price" step="any" placeholder="0" oninput="calculateStockTotal()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-app-muted mb-1">手續費</label>
                            <input type="number" id="input-stock-fee" step="any" placeholder="0" oninput="calculateStockTotal()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main outline-none">
                        </div>
                    </div>

                    <div id="field-category">
                        <label class="block text-app-muted mb-1">分類</label>
                        <input type="hidden" id="input-category" value="🍱 餐飲美食">
                        <button type="button" onclick="triggerTxCategoryPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium">
                            <span id="tx-category-btn-txt">🍱 餐飲美食</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                        </button>
                    </div>

                    <div>
                        <label class="block text-app-muted mb-1">金額</label>
                        <input type="number" id="input-amount" step="any" required placeholder="0" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main font-medium outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-app-muted mb-1">日期</label>
                            <input type="date" id="input-date" class="w-full bg-app-input border border-app-line rounded-xl px-2.5 py-2 text-app-main font-mono text-xs">
                        </div>
                        <div>
                            <label class="block text-app-muted mb-1">備註</label>
                            <input type="text" id="input-note" placeholder="可選填..." class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2 text-app-main outline-none">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-brand-gold text-white font-bold py-3 rounded-xl mt-2 shadow">確認儲存交易</button>
                </form>
            </div>
        </div>

        <!-- Custom Option Modal (With Predefined/Custom Category Edit & Delete) -->
        <div id="custom-option-modal" onclick="closeModal('custom-option-modal')" class="modal-backdrop absolute inset-0 bg-black/50 z-[60] hidden flex items-end justify-center">
            <div class="modal-sheet w-full max-w-md bg-app-surface rounded-t-3xl p-5 border-t border-app-line space-y-3 text-xs max-h-[75vh] flex flex-col" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center pb-2 border-b border-app-line shrink-0">
                    <h3 id="option-modal-title" class="font-bold text-brand-gold text-xs">選擇選項</h3>
                    <button onclick="closeModal('custom-option-modal')" class="text-app-muted p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div id="option-modal-list" class="space-y-1.5 flex-1 overflow-y-auto py-1"></div>
                <div id="custom-category-add-box" class="hidden pt-2 border-t border-app-line space-y-2 shrink-0">
                    <label class="text-[10px] text-app-muted block font-medium">+ 新增自訂分類</label>
                    <div class="flex gap-1.5">
                        <input type="text" id="new-category-input" placeholder="輸入新分類名稱..." class="flex-1 bg-app-input border border-app-line rounded-xl px-2.5 py-1.5 text-xs text-app-main outline-none">
                        <button type="button" onclick="addNewCustomCategory()" class="bg-brand-gold text-white font-bold px-3 py-1.5 rounded-xl text-xs">新增</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Category Modal -->
        <div id="edit-category-modal" onclick="closeModal('edit-category-modal')" class="modal-backdrop absolute inset-0 bg-black/60 z-[85] hidden flex items-center justify-center p-6">
            <div class="modal-sheet bg-app-surface border border-app-line p-5 rounded-3xl shadow-2xl max-w-xs w-full text-center space-y-3" onclick="event.stopPropagation()">
                <h3 class="font-bold text-sm text-brand-gold">編輯分類名稱</h3>
                <input type="hidden" id="edit-category-old-name" value="">
                <input type="text" id="edit-category-input" placeholder="輸入新的分類名稱..." class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2 text-xs text-app-main outline-none text-center">
                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeModal('edit-category-modal')" class="flex-1 bg-app-card border border-app-line text-app-main py-2 rounded-xl text-xs font-bold">取消</button>
                    <button type="button" onclick="saveEditedCategory()" class="flex-1 bg-brand-gold text-white py-2 rounded-xl text-xs font-bold">儲存</button>
                </div>
            </div>
        </div>

        <!-- Toast Modal -->
        <div id="toast-modal" onclick="closeModal('toast-modal')" class="modal-backdrop absolute inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-6">
            <div class="modal-sheet bg-app-surface border border-app-line p-5 rounded-3xl shadow-2xl max-w-xs w-full text-center space-y-3" onclick="event.stopPropagation()">
                <div class="w-10 h-10 rounded-full mx-auto flex items-center justify-center bg-brand-gold/20 text-brand-gold"><i data-lucide="info" class="w-6 h-6"></i></div>
                <h3 id="toast-title" class="font-bold text-sm text-app-main">系統提示</h3>
                <p id="toast-msg" class="text-xs text-app-muted leading-relaxed"></p>
                <button onclick="closeModal('toast-modal')" class="w-full bg-brand-gold text-white py-2 rounded-xl text-xs font-bold">確定</button>
            </div>
        </div>

    </div>

    <script>
        function getLocalDateStr(dateObj = new Date()) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const DEFAULT_STATE = {
            appTitle: "智慧帳本",
            theme: "light",
            usdExchangeRate: 32.5,
            categoryBudgets: {},
            categories: [
                '🍱 餐飲美食', '🛒 日常購物', '🚗 交通出行', '🎮 娛樂休閒',
                '💰 薪資收入', '📈 投資收益', '📝 其他雜項'
            ],
            assets: { TWD: 0, TW_STOCK: 0, USD: 0, US_STOCK: 0 },
            recurringRules: [],
            installments: [],
            notifications: [],
            transactions: []
        };

        let appData = loadAppData();
        let currentTab = 'home';
        let currentModalMode = 'cash';
        let filterAsset = 'ALL';
        let filterRange = 'RECENT30';
        let filterType = 'ALL';
        let stockSubFilter = 'ALL';
        let currentOptionTarget = null;

        function getValidCategoriesForType(txType) {
            if (txType === '存入') {
                return ['💰 薪資收入', '📈 投資收益', '📝 其他雜項', ...appData.categories.filter(c => !['🍱 餐飲美食', '🛒 日常購物', '🚗 交通出行', '🎮 娛樂休閒', '💰 薪資收入', '📈 投資收益', '📝 其他雜項'].includes(c))];
            } else {
                return appData.categories.filter(cat => !['💰 薪資收入', '📈 投資收益'].some(kw => cat.includes(kw)));
            }
        }

        function loadAppData() {
            const saved = localStorage.getItem('wealth_app_data_v22');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (!parsed.categories || !Array.isArray(parsed.categories)) {
                        parsed.categories = [...DEFAULT_STATE.categories];
                    }
                    return parsed;
                } catch(e) {}
            }
            return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }

        function saveData(triggerRender = true) {
            localStorage.setItem('wealth_app_data_v22', JSON.stringify(appData));
            applyTheme();
            if (triggerRender) renderCurrentView();
        }

        function getLiveAssetBalance(assetKey) {
            const initial = appData.assets[assetKey] || 0;
            const netTx = appData.transactions
                .filter(tx => tx.asset === assetKey)
                .reduce((sum, tx) => sum + (tx.type === '存入' ? Number(tx.amount) : -Number(tx.amount)), 0);
            return initial + netTx;
        }

        function applyTheme() {
            if (appData.theme === 'light') {
                document.body.classList.add('theme-light');
            } else {
                document.body.classList.remove('theme-light');
            }
        }

        function setTheme(themeMode) {
            appData.theme = themeMode;
            saveData();
        }

        window.onload = function() {
            applyTheme();
            lucide.createIcons();
            document.getElementById('input-date').value = getLocalDateStr();
            updateHeaderDate();
            renderCurrentView();

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.classList.add('hidden'), 700);
                }
            }, 800);
        };

        function updateHeaderDate() {
            const today = new Date();
            document.getElementById('header-date').innerText = `${today.getFullYear()} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日`;
            document.getElementById('app-title-display').innerText = appData.appTitle || '智慧帳本';
        }

        function switchTab(tab, resetFilters = false) {
            if (resetFilters && tab !== currentTab) {
                filterAsset = 'ALL';
                filterRange = 'RECENT30';
                filterType = 'ALL';
            }
            currentTab = tab;
            ['home', 'details', 'stock-stats'].forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                if (navBtn) {
                    navBtn.className = t === tab ? "flex flex-col items-center py-1 px-4 text-brand-gold font-bold" : "flex flex-col items-center py-1 px-4 text-app-muted font-medium";
                }
            });
            renderCurrentView();
        }

        function navigateToDetails(assetKey) {
            filterAsset = assetKey;
            filterRange = 'RECENT30';
            filterType = 'ALL';
            switchTab('details', false);
        }

        function renderCurrentView() {
            const main = document.getElementById('main-content');
            if (!main) return;
            main.innerHTML = '';
            if (currentTab === 'home') renderHomeView(main);
            else if (currentTab === 'details') renderDetailsView(main);
            else if (currentTab === 'stock-stats') renderStockStatsView(main);
            
            const settingsDrawer = document.getElementById('settings-drawer');
            if (settingsDrawer && !settingsDrawer.classList.contains('hidden')) {
                renderSettingsDrawerContent();
            }
            if (window.lucide) lucide.createIcons();
        }

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            document.body.classList.add('modal-open');
            modal.classList.remove('hidden');
            const sheet = modal.querySelector('.modal-sheet');
            if (sheet) {
                sheet.classList.remove('is-closing');
                void sheet.offsetWidth;
                sheet.classList.add('is-open');
            }
            if (window.lucide) lucide.createIcons();
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.classList.add('is-closing');
            const sheet = modal.querySelector('.modal-sheet');
            if (sheet) {
                sheet.classList.remove('is-open');
                sheet.classList.add('is-closing');
            }
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('is-closing');
                if (sheet) sheet.classList.remove('is-closing');
                document.body.classList.remove('modal-open');
            }, 280);
        }

        function toggleNotificationDrawer() {
            const drawer = document.getElementById('notif-drawer');
            if (drawer.classList.contains('hidden')) {
                openModal('notif-drawer');
                renderNotifications();
            } else {
                closeModal('notif-drawer');
            }
        }

        function toggleSettingsDrawer() {
            const drawer = document.getElementById('settings-drawer');
            if (drawer.classList.contains('hidden')) {
                openModal('settings-drawer');
                renderSettingsDrawerContent();
            } else {
                closeModal('settings-drawer');
            }
        }

        function renderNotifications() {
            const container = document.getElementById('notif-list');
            if (!container) return;
            if (!appData.notifications || appData.notifications.length === 0) {
                container.innerHTML = `<div class="text-xs text-app-muted text-center py-6">目前沒有通知紀錄</div>`;
                return;
            }
            container.innerHTML = appData.notifications.map(n => `
                <div class="bg-app-card p-2.5 rounded-xl border border-app-line text-xs space-y-1">
                    <div class="flex justify-between items-center font-bold text-brand-gold"><span>${n.title}</span><span class="text-[10px] text-app-muted">${n.time}</span></div>
                    <p class="text-app-main text-[11px]">${n.message}</p>
                </div>
            `).join('');
        }

        function clearNotifications() {
            appData.notifications = [];
            saveData();
            renderNotifications();
        }

        function showToast(title, msg) {
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            openModal('toast-modal');
        }

        function openTransactionModal() {
            openModal('transaction-modal');
            setModalMode(currentModalMode);
            setTxType('支出');
        }

        function setModalMode(mode) {
            currentModalMode = mode;
            const btnCash = document.getElementById('btn-mode-cash');
            const btnStock = document.getElementById('btn-mode-stock');
            const fieldCategory = document.getElementById('field-category');
            const fieldAsset = document.getElementById('field-asset-select');
            const fieldStockMarket = document.getElementById('field-stock-market');
            const fieldStockDetails = document.getElementById('field-stock-details');
            const autoNotice = document.getElementById('auto-calc-notice');

            if (mode === 'cash') {
                btnCash.className = "py-2 rounded-lg font-medium bg-brand-gold text-white shadow";
                btnStock.className = "py-2 rounded-lg font-medium text-app-muted";
                fieldCategory.classList.remove('hidden');
                fieldAsset.classList.remove('hidden');
                fieldStockMarket.classList.add('hidden');
                fieldStockDetails.classList.add('hidden');
                autoNotice.classList.add('hidden');
                document.getElementById('txt-type-out').innerText = '支出';
                document.getElementById('txt-type-in').innerText = '存入';
                setTxType('支出');
            } else {
                btnStock.className = "py-2 rounded-lg font-medium bg-brand-gold text-white shadow";
                btnCash.className = "py-2 rounded-lg font-medium text-app-muted";
                fieldCategory.classList.add('hidden');
                fieldAsset.classList.add('hidden');
                fieldStockMarket.classList.remove('hidden');
                fieldStockDetails.classList.remove('hidden');
                autoNotice.classList.remove('hidden');
                document.getElementById('txt-type-out').innerText = '賣出股票';
                document.getElementById('txt-type-in').innerText = '買進股票';
                setTxType('存入');
            }
        }

        function setTxType(val) {
            document.getElementsByName('txType').forEach(r => { if (r.value === val) r.checked = true; });
            const labelOut = document.getElementById('label-type-out');
            const labelIn = document.getElementById('label-type-in');
            const isSellOrExpense = (val === '支出' || val === '賣出股票');

            if (isSellOrExpense) {
                if (labelOut) labelOut.className = "flex-1 text-center py-2.5 rounded-xl border-2 border-brand-red bg-brand-red/10 cursor-pointer shadow-sm";
                if (labelIn) labelIn.className = "flex-1 text-center py-2.5 rounded-xl border border-app-line opacity-60 cursor-pointer";
            } else {
                if (labelIn) labelIn.className = "flex-1 text-center py-2.5 rounded-xl border-2 border-brand-green bg-brand-green/10 cursor-pointer shadow-sm";
                if (labelOut) labelOut.className = "flex-1 text-center py-2.5 rounded-xl border border-app-line opacity-60 cursor-pointer";
            }

            if (currentModalMode === 'cash') {
                const validCats = getValidCategoriesForType(val);
                const currentCat = document.getElementById('input-category').value;
                if (!validCats.includes(currentCat)) {
                    document.getElementById('input-category').value = validCats[0];
                    document.getElementById('tx-category-btn-txt').innerText = validCats[0];
                }
            }
        }

        function calculateStockTotal() {
            if (currentModalMode !== 'stock') return;
            const shares = parseFloat(document.getElementById('input-stock-shares').value) || 0;
            const price = parseFloat(document.getElementById('input-stock-price').value) || 0;
            const fee = parseFloat(document.getElementById('input-stock-fee').value) || 0;
            const total = (shares * price) + fee;
            document.getElementById('input-amount').value = total > 0 ? total.toFixed(2) : '';
        }

        function handleTransactionSubmit(e) {
            e.preventDefault();
            const txType = document.querySelector('input[name="txType"]:checked').value;
            const amount = parseFloat(document.getElementById('input-amount').value) || 0;
            const date = document.getElementById('input-date').value || getLocalDateStr();
            const note = document.getElementById('input-note').value || '';

            let asset = 'TWD', category = '🍱 餐飲美食', stockSymbol = '', shares = 0, price = 0, fee = 0;
            if (currentModalMode === 'cash') {
                asset = document.getElementById('input-asset-type').value;
                category = document.getElementById('input-category').value;
            } else {
                asset = document.getElementById('input-stock-market').value;
                stockSymbol = document.getElementById('input-stock-symbol').value || '股票交易';
                shares = parseFloat(document.getElementById('input-stock-shares').value) || 0;
                price = parseFloat(document.getElementById('input-stock-price').value) || 0;
                fee = parseFloat(document.getElementById('input-stock-fee').value) || 0;
                category = txType === '存入' ? '股票買進' : '股票賣出';
            }

            const newTx = { id: 'tx_' + Date.now(), type: txType, asset, category, amount, note, date, stockSymbol, shares, price, fee };
            appData.transactions.unshift(newTx);
            saveData();
            closeModal('transaction-modal');
        }

        function deleteTransaction(id) {
            const idx = appData.transactions.findIndex(t => t.id === id);
            if (idx !== -1) {
                appData.transactions.splice(idx, 1);
                saveData();
            }
        }

        function openOptionModal(target, title, options, currentVal) {
            currentOptionTarget = target;
            document.getElementById('option-modal-title').innerText = title;
            const listElem = document.getElementById('option-modal-list');

            listElem.innerHTML = options.map(opt => {
                const isSelected = opt.value === currentVal;
                const isEditableCategory = (target === 'TX_CATEGORY');

                return `
                    <div class="flex items-center gap-1.5 w-full">
                        <button type="button" onclick="selectOptionValue('${opt.value.replace(/'/g, "\\'")}', '${opt.label.replace(/'/g, "\\'")}')" class="flex-1 text-left p-2.5 rounded-xl border ${isSelected ? 'border-brand-gold bg-brand-gold/10 font-bold' : 'border-app-line bg-app-card'} flex justify-between items-center text-xs">
                            <span class="text-app-main">${opt.label}</span>
                            ${isSelected ? '<i data-lucide="check" class="w-4 h-4 text-brand-gold font-bold"></i>' : ''}
                        </button>
                        ${isEditableCategory ? `
                            <button type="button" onclick="event.stopPropagation(); openEditCategoryModal('${opt.value.replace(/'/g, "\\'")}')" class="p-2 rounded-xl bg-app-card border border-app-line text-brand-blue" title="編輯"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                            <button type="button" onclick="event.stopPropagation(); deleteCategoryItem('${opt.value.replace(/'/g, "\\'")}')" class="p-2 rounded-xl bg-app-card border border-app-line text-brand-red" title="刪除"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        ` : ''}
                    </div>
                `;
            }).join('');

            const customBox = document.getElementById('custom-category-add-box');
            if (target === 'TX_CATEGORY') customBox.classList.remove('hidden');
            else customBox.classList.add('hidden');
            openModal('custom-option-modal');
        }

        function openEditCategoryModal(catName) {
            document.getElementById('edit-category-old-name').value = catName;
            document.getElementById('edit-category-input').value = catName;
            openModal('edit-category-modal');
        }

        function saveEditedCategory() {
            const oldName = document.getElementById('edit-category-old-name').value;
            const newName = document.getElementById('edit-category-input').value.trim();
            if (!newName || oldName === newName) {
                closeModal('edit-category-modal');
                return;
            }
            if (appData.categories.includes(newName)) {
                showToast("編輯失敗", "該分類名稱已存在！");
                return;
            }

            const idx = appData.categories.indexOf(oldName);
            if (idx !== -1) {
                appData.categories[idx] = newName;
                appData.transactions.forEach(tx => { if (tx.category === oldName) tx.category = newName; });
                saveData();
                closeModal('edit-category-modal');
                closeModal('custom-option-modal');
                showToast("編輯成功", `分類已更名為「${newName}」。`);
            }
        }

        function deleteCategoryItem(catName) {
            appData.categories = appData.categories.filter(c => c !== catName);
            saveData(false);
            closeModal('custom-option-modal');
            showToast("已刪除", `分類「${catName}」已刪除。`);
        }

        function addNewCustomCategory() {
            const input = document.getElementById('new-category-input');
            if (!input) return;
            const newCat = input.value.trim();
            if (!newCat) return;
            if (!appData.categories.includes(newCat)) {
                appData.categories.push(newCat);
                saveData(false);
            }
            input.value = '';
            closeModal('custom-option-modal');
            showToast("新增成功", `已新增分類「${newCat}」。`);
        }

        function selectOptionValue(val, label) {
            if (currentOptionTarget === 'TX_ASSET') {
                document.getElementById('input-asset-type').value = val;
                document.getElementById('tx-asset-btn-txt').innerText = label;
            } else if (currentOptionTarget === 'TX_STOCK_MARKET') {
                document.getElementById('input-stock-market').value = val;
                document.getElementById('tx-market-btn-txt').innerText = label;
            } else if (currentOptionTarget === 'TX_CATEGORY') {
                document.getElementById('input-category').value = val;
                document.getElementById('tx-category-btn-txt').innerText = label;
            }
            closeModal('custom-option-modal');
        }

        function triggerTxAssetPicker() {
            openOptionModal('TX_ASSET', '選擇資產帳戶', [{ label: '台幣帳戶 (TWD)', value: 'TWD' }, { label: '美金帳戶 (USD)', value: 'USD' }], document.getElementById('input-asset-type').value);
        }
        function triggerTxMarketPicker() {
            openOptionModal('TX_STOCK_MARKET', '選擇股票市場', [{ label: '台股 (TWD)', value: 'TW_STOCK' }, { label: '美股 (USD)', value: 'US_STOCK' }], document.getElementById('input-stock-market').value);
        }
        function triggerTxCategoryPicker() {
            const currentTxType = document.querySelector('input[name="txType"]:checked')?.value || '支出';
            const validCats = getValidCategoriesForType(currentTxType);
            openOptionModal('TX_CATEGORY', `選擇 ${currentTxType} 分類`, validCats.map(c => ({ label: c, value: c })), document.getElementById('input-category').value);
        }

        function renderTxList(txList) {
            if (!txList || txList.length === 0) return `<div class="text-center text-xs text-app-muted py-6 bg-app-card rounded-2xl border border-app-line">查無相關交易紀錄</div>`;
            return txList.map(tx => {
                const isExpense = tx.type === '支出', isStock = tx.asset === 'TW_STOCK' || tx.asset === 'US_STOCK';
                const assetLabel = tx.asset === 'TW_STOCK' ? '台股' : tx.asset === 'US_STOCK' ? '美股' : tx.asset;
                const currency = (tx.asset === 'USD' || tx.asset === 'US_STOCK') ? 'USD $' : 'NT$';
                return `
                    <div class="bg-app-card border border-app-line p-3 rounded-2xl flex justify-between items-center w-full">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${isExpense ? 'bg-brand-red/15 text-brand-red' : 'bg-brand-green/15 text-brand-green'}">
                                <i data-lucide="${isStock ? 'trending-up' : isExpense ? 'arrow-up-right' : 'arrow-down-left'}" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0">
                                <div class="font-bold text-xs text-app-main flex items-center gap-1.5 truncate">
                                    <span class="truncate">${tx.stockSymbol ? tx.stockSymbol : tx.category || '一般交易'}</span>
                                    <span class="text-[9px] px-1.5 py-0.2 rounded font-mono shrink-0 border ${tx.asset.includes('STOCK') ? 'bg-app-surface text-brand-blue border-brand-blue/30' : 'bg-app-surface text-brand-gold border-brand-gold/30'}">${assetLabel}</span>
                                </div>
                                <div class="text-[10px] text-app-muted mt-0.5 font-mono truncate">${tx.date} ${tx.note ? `• ${tx.note}` : ''}</div>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="font-bold font-mono text-sm ${isExpense ? 'text-brand-red' : 'text-brand-green'}">${isExpense ? '-' : '+'} ${currency} ${Number(tx.amount).toLocaleString()}</div>
                            <button onclick="deleteTransaction('${tx.id}')" class="text-[10px] text-app-muted hover:text-brand-red">刪除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderHomeView(container) {
            const liveTWD = getLiveAssetBalance('TWD');
            const liveTWStock = getLiveAssetBalance('TW_STOCK');
            const liveUSD = getLiveAssetBalance('USD');
            const liveUSStock = getLiveAssetBalance('US_STOCK');
            const grandTotalTWD = liveTWD + liveTWStock + (liveUSD * appData.usdExchangeRate) + (liveUSStock * appData.usdExchangeRate);

            container.innerHTML = `
                <div class="animate-fade space-y-4 w-full">
                    <div onclick="navigateToDetails('ALL')" class="bg-app-card border border-brand-gold/40 rounded-2xl p-4 shadow-md relative overflow-hidden w-full cursor-pointer">
                        <div class="flex justify-between items-center text-xs text-app-muted mb-1">
                            <span>淨資產總額估算 (NTD) <i data-lucide="chevron-right" class="w-3.5 h-3.5 inline text-brand-gold"></i></span>
                            <span class="font-mono text-[10px]">1 USD = ${appData.usdExchangeRate} TWD</span>
                        </div>
                        <div class="text-3xl font-extrabold text-brand-gold tracking-tight font-mono">$ ${grandTotalTWD.toLocaleString('zh-TW', {maximumFractionDigits: 0})}</div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 w-full">
                        <div onclick="navigateToDetails('TWD')" class="bg-app-card border border-brand-gold/40 p-3.5 rounded-2xl cursor-pointer">
                            <div class="flex justify-between items-start mb-1.5"><span class="text-xs font-bold text-app-main">台幣現金</span><span class="text-[10px] bg-app-surface text-brand-gold px-1.5 py-0.5 rounded font-mono">TWD</span></div>
                            <div class="text-base font-bold text-brand-gold font-mono">$ ${liveTWD.toLocaleString()}</div>
                        </div>
                        <div onclick="navigateToDetails('TW_STOCK')" class="bg-app-card border border-brand-blue/40 p-3.5 rounded-2xl cursor-pointer">
                            <div class="flex justify-between items-start mb-1.5"><span class="text-xs font-bold text-app-main">台股市值</span><span class="text-[10px] bg-app-surface text-brand-blue px-1.5 py-0.5 rounded font-mono">TW Stock</span></div>
                            <div class="text-base font-bold text-brand-blue font-mono">$ ${liveTWStock.toLocaleString()}</div>
                        </div>
                        <div onclick="navigateToDetails('USD')" class="bg-app-card border border-brand-gold/40 p-3.5 rounded-2xl cursor-pointer">
                            <div class="flex justify-between items-start mb-1.5"><span class="text-xs font-bold text-app-main">美金現金</span><span class="text-[10px] bg-app-surface text-brand-gold px-1.5 py-0.5 rounded font-mono">USD</span></div>
                            <div class="text-base font-bold text-brand-gold font-mono">$ ${liveUSD.toLocaleString()}</div>
                        </div>
                        <div onclick="navigateToDetails('US_STOCK')" class="bg-app-card border border-brand-blue/40 p-3.5 rounded-2xl cursor-pointer">
                            <div class="flex justify-between items-start mb-1.5"><span class="text-xs font-bold text-app-main">美股市值</span><span class="text-[10px] bg-app-surface text-brand-blue px-1.5 py-0.5 rounded font-mono">US Stock</span></div>
                            <div class="text-base font-bold text-brand-blue font-mono">$ ${liveUSStock.toLocaleString()}</div>
                        </div>
                    </div>

                    <div class="pt-1">
                        <div class="flex justify-between items-center mb-2"><h3 class="text-xs font-bold text-app-main uppercase">近期帳務動態</h3><button onclick="switchTab('details')" class="text-[11px] text-brand-blue hover:underline">查看全部 ›</button></div>
                        <div class="space-y-2 w-full">${renderTxList(appData.transactions.slice(0, 5))}</div>
                    </div>
                </div>
            `;
        }

        function renderDetailsView(container) {
            let list = [...appData.transactions];
            if (filterAsset !== 'ALL') list = list.filter(tx => tx.asset === filterAsset);
            if (filterType !== 'ALL') list = list.filter(tx => tx.type === filterType);
            list = list.slice(0, 30);

            container.innerHTML = `
                <div class="animate-fade space-y-3 w-full">
                    <div class="bg-app-card p-3 rounded-2xl border border-app-line space-y-2 w-full">
                        <div class="flex gap-1 overflow-x-auto pb-1 text-xs">
                            ${['ALL', 'TWD', 'TW_STOCK', 'USD', 'US_STOCK'].map(a => `
                                <button onclick="filterAsset='${a}'; renderCurrentView();" class="px-3 py-1.5 rounded-lg whitespace-nowrap font-medium ${filterAsset === a ? 'bg-brand-gold text-white font-bold' : 'bg-app-surface text-app-muted'}">${a === 'ALL' ? '全部資產' : a}</button>
                            `).join('')}
                        </div>
                    </div>
                    <div class="space-y-2 w-full">${renderTxList(list)}</div>
                </div>
            `;
        }

        function renderStockStatsView(container) {
            const stockTxList = appData.transactions.filter(tx => tx.asset === 'TW_STOCK' || tx.asset === 'US_STOCK');
            const holdingsMap = {};
            stockTxList.forEach(tx => {
                const sym = tx.stockSymbol || '未知';
                if (!holdingsMap[sym]) holdingsMap[sym] = { symbol: sym, asset: tx.asset, totalShares: 0, totalSpent: 0 };
                if (tx.type === '存入') { holdingsMap[sym].totalShares += Number(tx.shares)||0; holdingsMap[sym].totalSpent += Number(tx.amount)||0; }
                else { holdingsMap[sym].totalShares -= Number(tx.shares)||0; holdingsMap[sym].totalSpent -= Number(tx.amount)||0; }
            });
            const holdings = Object.values(holdingsMap);

            container.innerHTML = `
                <div class="animate-fade space-y-3 w-full">
                    ${holdings.length === 0 ? '<div class="text-center py-10 text-app-muted text-xs">尚無股票持股</div>' : holdings.map(h => `
                        <div class="bg-app-card border border-app-line p-3 rounded-2xl flex justify-between items-center text-xs">
                            <div><strong class="text-app-main text-sm">${h.symbol}</strong><div class="text-app-muted font-mono mt-0.5">${h.totalShares.toLocaleString()} 股</div></div>
                            <div class="text-right font-mono font-bold text-brand-gold">$ ${h.totalSpent.toLocaleString()}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderSettingsContentInto(container) {
            container.innerHTML = `
                <div class="space-y-4 w-full">
                    <div class="bg-app-card p-4 rounded-2xl border border-app-line space-y-2">
                        <h3 class="text-xs font-bold text-brand-gold uppercase">色彩主題</h3>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <button onclick="setTheme('light')" class="p-2.5 rounded-xl border ${appData.theme === 'light' ? 'bg-brand-gold text-white font-bold' : 'bg-app-surface text-app-muted'}">淺色模式</button>
                            <button onclick="setTheme('dark')" class="p-2.5 rounded-xl border ${appData.theme !== 'light' ? 'bg-brand-gold text-white font-bold' : 'bg-app-surface text-app-muted'}">深色模式</button>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
