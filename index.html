<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智慧帳本 - 理財</title>

    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#c89b3c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="智慧帳本">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="manifest" id="manifest-link">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --color-gold: #c89b3c;
            --color-blue: #3a6b88;
            --color-red: #b84a39;
            --color-green: #5b8c5a;
            --color-dark: #2c2e2b;

            --bg-app: #f6f4ee;
            --bg-surface: #ffffff;
            --bg-card: #ece8df;
            --bg-input: #ffffff;
            --text-main: #2c2e2b;
            --text-muted: #7a7f78;
            --border-line: #d8d2c4;
            --phone-border: #d2cbba;
        }

        body.theme-dark {
            --bg-app: #1c1d1b;
            --bg-surface: #272825;
            --bg-card: #333530;
            --bg-input: #21221f;
            --text-main: #f0eee6;
            --text-muted: #939890;
            --border-line: #454841;
            --phone-border: #2b2c28;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        body.modal-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .phone-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 100vh;
            margin: 0 auto;
            position: relative;
            background-color: var(--bg-app);
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-color: var(--phone-border);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        @media (min-width: 640px) {
            .phone-container {
                height: 96vh;
                max-height: 940px;
                margin-top: 2vh;
                border-radius: 40px;
                border-width: 8px;
                padding-top: 0;
                padding-bottom: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(25px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-25px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .animate-fade { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-left { animation: slideLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-right { animation: slideRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 12px rgba(200, 155, 60, 0.25); }
            50% { box-shadow: 0 0 22px rgba(200, 155, 60, 0.5); }
        }

        .modal-backdrop {
            animation: fadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-backdrop.is-closing {
            animation: fadeOut 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-sheet {
            will-change: transform, opacity;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s ease;
            padding-bottom: calc(4.5rem + env(safe-area-inset-bottom));
        }

        .modal-sheet.is-open {
            transform: translateY(0) !important;
            opacity: 1 !important;
        }

        .modal-sheet.is-closing {
            transform: translateY(100%) !important;
            opacity: 0 !important;
        }

        #notif-drawer .modal-sheet {
            transform: translateX(100%);
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s ease;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #notif-drawer .modal-sheet.is-open {
            transform: translateX(0) !important;
            opacity: 1 !important;
        }

        #notif-drawer .modal-sheet.is-closing {
            transform: translateX(100%) !important;
            opacity: 0 !important;
        }

        #settings-drawer .modal-sheet {
            transform: translateX(-100%);
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s ease;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #settings-drawer .modal-sheet.is-open {
            transform: translateX(0) !important;
            opacity: 1 !important;
        }

        #settings-drawer .modal-sheet.is-closing {
            transform: translateX(-100%) !important;
            opacity: 0 !important;
        }

        button, a, label[class*="cursor-pointer"] {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.4), opacity 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }
        button:active, label[class*="cursor-pointer"]:active {
            transform: scale(0.85) translateY(1px) !important;
        }

        .pulse-gold { animation: pulseGold 2.5s infinite; }

        .bg-app-bg { background-color: var(--bg-app); }
        .bg-app-surface { background-color: var(--bg-surface); }
        .bg-app-card { background-color: var(--bg-card); }
        .bg-app-input { background-color: var(--bg-input); }
        .text-app-main { color: var(--text-main); }
        .text-app-muted { color: var(--text-muted); }
        .border-app-line { border-color: var(--border-line); }

        .bg-brand-gold { background-color: var(--color-gold); }
        .bg-brand-blue { background-color: var(--color-blue); }
        .bg-brand-red { background-color: var(--color-red); }
        .bg-brand-green { background-color: var(--color-green); }

        .text-brand-gold { color: var(--color-gold); }
        .text-brand-blue { color: var(--color-blue); }
        .text-brand-red { color: var(--color-red); }
        .text-brand-green { color: var(--color-green); }

        /* Hide scrollbars visually while maintaining full touch & wheel scroll capabilities */
        ::-webkit-scrollbar {
            display: none;
            width: 0px;
            height: 0px;
            background: transparent;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen theme-light">

    <div class="phone-container text-app-main flex flex-col relative overflow-hidden border-gray-300" id="app-phone-container">

        <!-- App Main Header Bar -->
        <header class="px-5 py-3.5 bg-app-surface border-b border-app-line flex justify-between items-center z-20 shrink-0 shadow-sm pt-[max(0.875rem,env(safe-area-inset-top))]">
            <div class="flex items-center gap-1.5">
                <button onclick="toggleSettingsDrawer()" id="nav-settings-header" class="relative p-2 rounded-xl bg-app-card hover:opacity-80 text-app-main transition-all active:scale-75 border border-app-line hover:scale-110" title="系統設定">
                    <i data-lucide="settings" class="w-5 h-5 text-brand-gold"></i>
                </button>
            </div>
            <div class="text-center">
                <h1 id="app-title-display" class="font-bold text-lg text-brand-gold tracking-wide flex items-center justify-center gap-2">
                    智慧帳本
                </h1>
                <p class="text-[11px] text-app-muted" id="header-date">2026 年 8 月 7 日</p>
            </div>
            <div class="flex items-center gap-1.5">
                <button id="pwa-install-btn" onclick="triggerPWAInstall()" class="hidden relative p-2 rounded-xl bg-brand-gold text-white hover:opacity-95 transition-all active:scale-75 border border-brand-gold/40 flex items-center gap-1 text-xs font-bold shadow-xs">
                    <i data-lucide="download" class="w-4 h-4"></i> 安裝
                </button>
                <button onclick="toggleNotificationDrawer()" class="relative p-2 rounded-xl bg-app-card hover:opacity-80 text-app-main transition-all active:scale-75 border border-app-line hover:scale-110" title="通知紀錄">
                    <i data-lucide="bell" class="w-5 h-5 text-brand-gold"></i>
                    <span id="notif-badge" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-brand-red rounded-full ring-2 ring-white dark:ring-gray-900"></span>
                </button>
            </div>
        </header>

        <!-- MAIN VIEW CONTAINER -->
        <main class="flex-1 overflow-y-scroll p-4 space-y-4 pb-28 relative w-full touch-pan-y" id="main-content"></main>

        <!-- Floating Action Button -->
        <div class="absolute bottom-20 right-5 z-20">
            <button onclick="openTransactionModal()" class="bg-brand-gold text-white p-4 rounded-full shadow-xl flex items-center justify-center pulse-gold active:scale-75 hover:scale-110 transition-transform">
                <i data-lucide="plus" class="w-6 h-6 stroke-[2.5]"></i>
            </button>
        </div>

        <!-- Navigation Bar -->
        <nav class="w-full bg-app-surface/95 backdrop-blur-lg border-t border-app-line px-3 py-2 flex justify-around items-center absolute bottom-0 left-0 z-30 shrink-0 pb-[max(0.5rem,env(safe-area-inset-bottom))]">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center py-1 px-4 text-brand-gold transition-all duration-200 active:scale-75 hover:scale-110">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">首頁資產</span>
            </button>
            <button onclick="switchTab('details')" id="nav-details" class="flex flex-col items-center py-1 px-4 text-app-muted transition-all duration-200 active:scale-75 hover:scale-110">
                <i data-lucide="receipt" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">資產明細</span>
            </button>
            <button onclick="switchTab('stock-stats')" id="nav-stock-stats" class="flex flex-col items-center py-1 px-4 text-app-muted transition-all duration-200 active:scale-75 hover:scale-110">
                <i data-lucide="trending-up" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">持股統計</span>
            </button>
        </nav>

        <!-- Splash Screen -->
        <div id="splash-screen" class="absolute inset-0 bg-app-bg z-50 flex flex-col items-center justify-center transition-opacity duration-700">
            <div class="relative flex flex-col items-center animate-pop">
                <div class="w-24 h-24 rounded-3xl bg-app-surface p-1 shadow-xl flex items-center justify-center mb-5 border border-brand-gold/40">
                    <div class="w-full h-full bg-app-card rounded-[22px] flex items-center justify-center">
                        <i data-lucide="wallet" class="w-12 h-12 text-brand-gold"></i>
                    </div>
                </div>
                <h1 class="text-2xl font-bold tracking-wider text-brand-gold mb-1">智慧帳本</h1>
                <p class="text-xs text-brand-blue tracking-widest uppercase font-mono">Personal Wealth Ledger</p>
                <div class="mt-8 flex gap-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-brand-gold animate-ping"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-brand-blue animate-ping" style="animation-delay: 0.2s"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-brand-green animate-ping" style="animation-delay: 0.4s"></div>
                </div>
            </div>
        </div>

        <!-- Notification Drawer -->
        <div id="notif-drawer" onclick="closeModal('notif-drawer')" class="modal-backdrop absolute inset-0 bg-black/60 backdrop-blur-xs z-40 hidden flex justify-end">
            <div class="modal-sheet w-4/5 max-w-xs bg-app-surface shadow-2xl p-4 flex flex-col h-full border-l border-app-line pt-[max(1rem,env(safe-area-inset-top))] pb-[max(1rem,env(safe-area-inset-bottom))]" onclick="event.stopPropagation()">
                <div class="w-10 h-1 bg-gray-300 dark:bg-gray-700 rounded-full mx-auto mb-2 cursor-pointer"></div>
                <div class="flex justify-between items-center pb-3 border-b border-app-line">
                    <h3 class="font-bold text-brand-gold flex items-center gap-2 text-xs">
                        <i data-lucide="bell-ring" class="w-4 h-4"></i> 自動支出及存入通知記錄
                    </h3>
                    <button onclick="closeModal('notif-drawer')" class="text-app-muted hover:text-app-main p-1 active:scale-75">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="notif-list" class="flex-1 overflow-y-auto my-3 space-y-2 pr-1"></div>
                <button onclick="clearNotifications()" class="text-xs text-app-muted hover:text-brand-red text-center py-2 border-t border-app-line active:scale-90">
                    清空歷史通知
                </button>
            </div>
        </div>

        <!-- Settings Drawer (Full Screen Mode) -->
        <div id="settings-drawer" onclick="closeModal('settings-drawer')" class="modal-backdrop absolute inset-0 bg-black/60 backdrop-blur-xs z-40 hidden flex justify-start">
            <div class="modal-sheet w-full max-w-full bg-app-surface shadow-2xl p-5 flex flex-col h-full pt-[max(1.25rem,env(safe-area-inset-top))] pb-[max(1.25rem,env(safe-area-inset-bottom))]" onclick="event.stopPropagation()">
                <div class="flex items-center pb-3.5 border-b border-app-line">
                    <div class="flex items-center gap-2">
                        <button onclick="closeModal('settings-drawer')" class="p-1.5 rounded-xl bg-app-card border border-app-line text-brand-gold hover:opacity-80 active:scale-75 transition-all" title="返回">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        </button>
                        <h3 class="font-bold text-brand-gold flex items-center gap-2 text-base tracking-wide">
                            <i data-lucide="settings" class="w-5 h-5"></i> 系統設定面板
                        </h3>
                    </div>
                </div>
                <div id="settings-drawer-content" class="flex-1 overflow-y-auto my-3 space-y-4"></div>
            </div>
        </div>

        <!-- Transaction Modal -->
        <div id="transaction-modal" onclick="closeModal('transaction-modal')" class="modal-backdrop absolute inset-0 bg-black/60 backdrop-blur-xs z-40 hidden flex items-end justify-center p-0">
            <div class="modal-sheet w-full bg-app-surface rounded-t-3xl p-5 border-t border-app-line max-h-[78vh] overflow-y-auto pb-[max(2.5rem,env(safe-area-inset-bottom))]" onclick="event.stopPropagation()">
                <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full mx-auto mb-3 cursor-pointer"></div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-brand-gold flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> 新增帳務交易
                    </h2>
                    <button onclick="closeModal('transaction-modal')" class="text-app-muted hover:text-app-main p-1 active:scale-75">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2 bg-app-card p-1 rounded-xl mb-4 text-sm">
                    <button type="button" onclick="setModalMode('cash')" id="btn-mode-cash" class="py-2 rounded-lg font-medium transition-all bg-brand-gold text-white shadow active:scale-75">現金收支</button>
                    <button type="button" onclick="setModalMode('stock')" id="btn-mode-stock" class="py-2 rounded-lg font-medium transition-all text-app-muted active:scale-75">股票買賣</button>
                </div>

                <form id="tx-form" onsubmit="handleTransactionSubmit(event)" class="space-y-3 text-xs pb-6">
                    <div class="flex gap-2">
                        <label onclick="setTxType('支出')" class="flex-1 text-center py-2.5 rounded-xl border border-app-line cursor-pointer transition-all shadow-sm active:scale-75" id="label-type-out">
                            <input type="radio" name="txType" value="支出" class="hidden" checked onchange="setTxType('支出')">
                            <span class="font-bold text-brand-red text-sm" id="txt-type-out">支出</span>
                        </label>
                        <label onclick="setTxType('存入')" class="flex-1 text-center py-2.5 rounded-xl border border-app-line cursor-pointer transition-all active:scale-75" id="label-type-in">
                            <input type="radio" name="txType" value="存入" class="hidden" onchange="setTxType('存入')">
                            <span class="font-bold text-brand-green text-sm" id="txt-type-in">存入</span>
                        </label>
                    </div>

                    <div id="field-asset-select">
                        <label class="block text-app-muted mb-1">選擇資產帳戶</label>
                        <input type="hidden" id="input-asset-type" value="TWD">
                        <button type="button" onclick="triggerTxAssetPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium active:scale-95">
                            <span id="tx-asset-btn-txt">台幣帳戶 (TWD)</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                        </button>
                    </div>

                    <div id="field-stock-market" class="hidden">
                        <label class="block text-app-muted mb-1">股票市場</label>
                        <input type="hidden" id="input-stock-market" value="TW_STOCK">
                        <button type="button" onclick="triggerTxMarketPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium active:scale-95">
                            <span id="tx-market-btn-txt">台股 (TWD)</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                        </button>
                    </div>

                    <div id="field-stock-details" class="hidden space-y-3">
                        <div>
                            <label class="block text-app-muted mb-1">股票標的 / 代碼</label>
                            <div class="relative flex items-center">
                                <input type="text" id="input-stock-symbol" placeholder="例：2330 台積電 或 AAPL" oninput="toggleClearBtn(this)" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold">
                                <button type="button" onclick="clearInput('input-stock-symbol')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-app-muted mb-1">交易股數</label>
                                <div class="relative flex items-center">
                                    <input type="number" id="input-stock-shares" step="any" placeholder="0" oninput="toggleClearBtn(this); calculateStockTotal();" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold placeholder:text-app-muted/40 placeholder:font-normal">
                                    <button type="button" onclick="clearInput('input-stock-shares', 'calculateStockTotal')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-app-muted mb-1">每股成交價</label>
                                <div class="relative flex items-center">
                                    <input type="number" id="input-stock-price" step="any" placeholder="0" oninput="toggleClearBtn(this); calculateStockTotal();" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold placeholder:text-app-muted/40 placeholder:font-normal">
                                    <button type="button" onclick="clearInput('input-stock-price', 'calculateStockTotal')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-app-muted mb-1">手續費金額</label>
                            <div class="relative flex items-center">
                                <input type="number" id="input-stock-fee" step="any" placeholder="0" oninput="toggleClearBtn(this); calculateStockTotal();" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main outline-none focus:border-brand-gold placeholder:text-app-muted/40 placeholder:font-normal">
                                <button type="button" onclick="clearInput('input-stock-fee', 'calculateStockTotal')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                            </div>
                        </div>
                    </div>

                    <div id="field-category">
                        <label class="block text-app-muted mb-1">消費 / 收入分類</label>
                        <input type="hidden" id="input-category" value="🍱 餐飲美食">
                        <button type="button" onclick="triggerTxCategoryPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-3 py-2.5 text-app-main flex justify-between items-center font-medium active:scale-95">
                            <span id="tx-category-btn-txt">🍱 餐飲美食</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-app-muted"></i>
                        </button>
                    </div>

                    <div>
                        <label class="block text-app-muted mb-1">金額 <span id="auto-calc-notice" class="text-brand-gold text-[10px] font-normal hidden">(自動計算總額)</span></label>
                        <div class="relative flex items-center">
                            <input type="number" id="input-amount" step="any" required placeholder="0" oninput="toggleClearBtn(this)" class="w-full bg-app-input border border-app-line rounded-xl pl-3 pr-8 py-2.5 text-app-main text-lg font-bold outline-none focus:border-brand-gold placeholder:text-app-muted/40 placeholder:font-normal">
                            <button type="button" onclick="clearInput('input-amount')" class="clear-btn hidden absolute right-2.5 text-app-muted hover:text-app-main font-bold text-xs p-1">✕</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-app-muted mb-1">日期</label>
                            <button type="button" onclick="openCustomDatePicker('TX_INPUT')" class="w-full bg-app-input border border-app-line rounded-xl px-2.5 py-2 text-app-main text-left flex items-center justify-between active:scale-95">
                                <span class="flex items-center gap-1 font-mono text-xs">
                                    <i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-gold shrink-0"></i>
                                    <span id="input-date-display">2026-08-07</span>
                                </span>
                                <input type="hidden" id="input-date" value="2026-08-07">
                                <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-app-muted shrink-0"></i>
                            </button>
                        </div>
                        <div>

    <script>
        function getLocalDateStr(dateObj = new Date()) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getLocalMonthStr(dateObj = new Date()) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            return `${year}-${month}`;
        }

        function getDaysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }

        const DEFAULT_STATE = {
            appTitle: "智慧帳本",
            theme: "light",
            usdExchangeRate: 32.5,
            monthlyBudget: 0,
            categories: [
                '🍱 餐飲美食', '🛒 日常購物', '🚗 交通出行', '🎮 娛樂休閒',
                '💰 薪資收入', '📈 投資收益', '🔄 固定扣款', '📝 其他雜項'
            ],
            assets: { TWD: 0, TW_STOCK: 0, USD: 0, US_STOCK: 0 },
            recurringRules: [],
            installments: [],
            notifications: [],
            transactions: []
        };

        let appData = loadAppData();
        let currentTab = 'home';
        let currentModalMode = 'cash';
        let filterAsset = 'ALL';
        let filterRange = 'RECENT30';
        let filterType = 'ALL';
        let stockSubFilter = 'ALL';
        
        let filterCustomDate = getLocalDateStr();
        let filterStartDate = getLocalDateStr();
        let filterEndDate = getLocalDateStr();
        let filterMonthDate = getLocalMonthStr();

        let exportJpgCustomDate = getLocalDateStr();
        let exportJpgStartDate = getLocalDateStr();
        let exportJpgEndDate = getLocalDateStr();
        let exportJpgMonthDate = getLocalMonthStr();

        let datePickerTarget = null;
        let currentOptionTarget = null;

        let touchStartX = 0;
        let touchEndX = 0;

        function loadAppData() {
            const saved = localStorage.getItem('wealth_app_data_v21_final');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (!parsed.categories || !Array.isArray(parsed.categories)) {
                        parsed.categories = [...DEFAULT_STATE.categories];
                    }
                    if (!parsed.assets) {
                        parsed.assets = { TWD: 0, TW_STOCK: 0, USD: 0, US_STOCK: 0 };
                    }
                    return parsed;
                } catch(e) { console.error(e); }
            }
            return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }

        function saveData(triggerRender = true) {
            localStorage.setItem('wealth_app_data_v21_final', JSON.stringify(appData));
            applyTheme();
            if (triggerRender) renderCurrentView();
        }

        function getLiveAssetBalance(assetKey) {
            const initial = appData.assets[assetKey] || 0;
            const netTx = appData.transactions
                .filter(tx => tx.asset === assetKey)
                .reduce((sum, tx) => {
                    return sum + (tx.type === '存入' ? Number(tx.amount) : -Number(tx.amount));
                }, 0);
            return initial + netTx;
        }

        function applyTheme() {
            if (appData.theme === 'light') {
                document.body.classList.add('theme-light');
                document.body.classList.remove('theme-dark');
            } else {
                document.body.classList.add('theme-dark');
                document.body.classList.remove('theme-light');
            }
        }

        function setTheme(themeMode) {
            appData.theme = themeMode;
            saveData();
        }

        async function updateExchangeRateAuto(isManual = false) {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.rates && data.rates.TWD) {
                        const newRate = parseFloat(data.rates.TWD.toFixed(2));
                        if (newRate > 0) {
                            appData.usdExchangeRate = newRate;
                            saveData();
                            if (isManual) showToast("匯率即時更新成功", `1 USD = ${newRate} TWD`);
                        }
                    }
                }
            } catch (err) {
                if (isManual) showToast("更新失敗", "無法取得最新匯率，已保留當前匯率。");
            }
        }

        function initPWAManifest() {
            const manifestObj = {
                name: appData.appTitle || "智慧帳本 - 理財",
                short_name: "智慧帳本",
                description: "個人資產與股票記帳應用程式",
                start_url: "./",
                scope: "./",
                display: "standalone",
                background_color: appData.theme === 'dark' ? "#1c1d1b" : "#f6f4ee",
                theme_color: "#c89b3c",
                orientation: "portrait",
                icons: [{ src: "./icon.png", sizes: "192x192 512x512", type: "image/png", purpose: "any maskable" }]
            };
            const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
            let link = document.getElementById('manifest-link');
            if (!link) {
                link = document.createElement('link');
                link.id = 'manifest-link';
                link.rel = 'manifest';
                document.head.appendChild(link);
            }
            link.href = URL.createObjectURL(blob);
        }

        function registerInlineServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swScript = `
                    const CACHE = 'wealth-ledger-v21';
                    self.addEventListener('install', e => { e.waitUntil(self.skipWaiting()); });
                    self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
                    self.addEventListener('fetch', e => {
                        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                    });
                `;
                const blob = new Blob([swScript], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: './' }).catch(() => {});
            }
        }

        window.onload = function() {
            applyTheme();
            lucide.createIcons();
            initPWA();
            initSwipeGestures();
            const todayStr = getLocalDateStr();
            document.getElementById('input-date').value = todayStr;
            document.getElementById('input-date-display').innerText = todayStr;
            updateHeaderDate();
            checkRecurringTransactions();
            renderCurrentView();
            updateExchangeRateAuto();

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';

                }

        function initSwipeGestures() {
            const mainContainer = document.getElementById('main-content');
            if (!mainContainer) return;

            mainContainer.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            mainContainer.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipeGesture();
            }, { passive: true });

            const notifDrawer = document.getElementById('notif-drawer');
            if (notifDrawer) {
                let notifStartX = 0;
                notifDrawer.addEventListener('touchstart', (e) => {
                    notifStartX = e.changedTouches[0].screenX;
                }, { passive: true });
                notifDrawer.addEventListener('touchend', (e) => {
                    let notifEndX = e.changedTouches[0].screenX;
                    if (notifEndX - notifStartX > 50) {
                        closeModal('notif-drawer');
                    }
                }, { passive: true });
            }

            const settingsDrawer = document.getElementById('settings-drawer');
            if (settingsDrawer) {
                let setStartX = 0;
                settingsDrawer.addEventListener('touchstart', (e) => {
                    setStartX = e.changedTouches[0].screenX;
                }, { passive: true });
                settingsDrawer.addEventListener('touchend', (e) => {
                    let setEndX = e.changedTouches[0].screenX;
                    if (setEndX - setStartX > 50) {
                        closeModal('settings-drawer');
                    }
                }, { passive: true });
            }
        }

        function handleSwipeGesture() {
            const swipeThreshold = 55;
            const diff = touchEndX - touchStartX;
            if (Math.abs(diff) < swipeThreshold) return;

            const tabOrder = ['home', 'details', 'stock-stats'];
            const currentIndex = tabOrder.indexOf(currentTab);
            if (currentIndex === -1) return;

            if (diff > 0 && currentIndex > 0) {
                switchTabWithAnimation(tabOrder[currentIndex - 1], 'right', false);
            } else if (diff < 0 && currentIndex < tabOrder.length - 1) {
                switchTabWithAnimation(tabOrder[currentIndex + 1], 'left', false);
            }
        }

        function switchTab(tab, resetFilters = false) {
            switchTabWithAnimation(tab, 'fade', resetFilters);
        }

        function switchTabWithAnimation(tab, direction = 'fade', resetFilters = false) {
            if (resetFilters && tab !== currentTab) {
                filterAsset = 'ALL';
                filterRange = 'RECENT30';
                filterType = 'ALL';
                stockSubFilter = 'ALL';
            }
            currentTab = tab;
            ['home', 'details', 'stock-stats'].forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                if (navBtn) {
                    navBtn.className = t === tab ? "flex flex-col items-center py-1 px-4 text-brand-gold transition-all duration-200 scale-105 font-bold" : "flex flex-col items-center py-1 px-4 text-app-muted transition-all duration-200 font-medium";
                }
            });

            const main = document.getElementById('main-content');
            if (main) {
                main.scrollTop = 0;
                main.classList.remove('animate-fade', 'animate-slide-left', 'animate-slide-right');
                void main.offsetWidth;
                if (direction === 'left') {
                    main.classList.add('animate-slide-left');
                } else if (direction === 'right') {
                    main.classList.add('animate-slide-right');
                } else {
                    main.classList.add('animate-fade');
                }
            }
            renderCurrentView();
        }

        function navigateToDetails(assetKey) {
            filterAsset = assetKey;
            filterRange = 'RECENT30';
            filterType = 'ALL';
            switchTabWithAnimation('details', 'left', false);
        }

        function renderCurrentView() {
            const main = document.getElementById('main-content');
            if (!main) return;
            main.innerHTML = '';
            if (currentTab === 'home') renderHomeView(main);
            else if (currentTab === 'details') renderDetailsView(main);
            else if (currentTab === 'stock-stats') renderStockStatsView(main);
            
            const settingsDrawer = document.getElementById('settings-drawer');
            if (settingsDrawer && !settingsDrawer.classList.contains('hidden')) {
                renderSettingsDrawerContent();
            }

            if (window.lucide) lucide.createIcons();
            updateNotificationBadge();
        }

        function toggleClearBtn(inputElem) {
            if (!inputElem) return;
            const parent = inputElem.parentElement;
            if (!parent) return;
            const btn = parent.querySelector('.clear-btn');
            if (btn) {
                if (inputElem.value && inputElem.value.trim() !== '') btn.classList.remove('hidden');
                else btn.classList.add('hidden');
            }
        }

        function clearInput(inputId, callbackFnName) {
            const elem = document.getElementById(inputId);
            if (elem) {
                elem.value = '';
                toggleClearBtn(elem);
                if (callbackFnName && typeof window[callbackFnName] === 'function') window[callbackFnName]();
            }
        }

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            document.body.classList.add('modal-open');
            modal.classList.remove('hidden');
            modal.classList.remove('is-closing');
            
            const sheet = modal.querySelector('.modal-sheet');
            if (sheet) {
                sheet.classList.remove('is-closing');
                void sheet.offsetWidth;
                sheet.classList.add('is-open');
            }
            if (window.lucide) lucide.createIcons();
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.classList.add('is-closing');
            const sheet = modal.querySelector('.modal-sheet');
            if (sheet) {
                sheet.classList.remove('is-open');
                sheet.classList.add('is-closing');
            }
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('is-closing');
                if (sheet) sheet.classList.remove('is-closing');
                document.body.classList.remove('modal-open');
                resetModalContent(modalId);
            }, 320);
        }

        function resetModalContent(modalId) {
            if (modalId === 'transaction-modal') {
                ['input-amount', 'input-note', 'input-stock-symbol', 'input-stock-shares', 'input-stock-price', 'input-stock-fee'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
                document.querySelectorAll('#transaction-modal .clear-btn').forEach(b => b.classList.add('hidden'));
            } else if (modalId === 'recurring-modal') {
                ['rec-name', 'rec-amount'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
                document.querySelectorAll('#recurring-modal .clear-btn').forEach(b => b.classList.add('hidden'));
            } else if (modalId === 'installment-modal') {
                ['inst-name', 'inst-total'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
                document.querySelectorAll('#installment-modal .clear-btn').forEach(b => b.classList.add('hidden'));
            } else if (modalId === 'export-jpg-modal') {
                const assetSel = document.getElementById('export-jpg-asset-select');

                const rangeSel = document.getElementById('export-jpg-range-select');

        function calculateStockTotal() {
            if (currentModalMode !== 'stock') return;
            const shares = parseFloat(document.getElementById('input-stock-shares').value) || 0;
            const price = parseFloat(document.getElementById('input-stock-price').value) || 0;
            const fee = parseFloat(document.getElementById('input-stock-fee').value) || 0;
            const total = (shares * price) + fee;
            const amountElem = document.getElementById('input-amount');
            amountElem.value = total > 0 ? total.toFixed(2) : '';
            toggleClearBtn(amountElem);
        }

        function handleTransactionSubmit(e) {
            e.preventDefault();
            const txType = document.querySelector('input[name="txType"]:checked').value;
            const amount = parseFloat(document.getElementById('input-amount').value) || 0;
            const date = document.getElementById('input-date').value || getLocalDateStr();
            const note = document.getElementById('input-note').value || '';

            let asset = 'TWD', category = '🍱 餐飲美食', stockSymbol = '', shares = 0, price = 0, fee = 0;
            if (currentModalMode === 'cash') {
                asset = document.getElementById('input-asset-type').value;
                category = document.getElementById('input-category').value;
            } else {
                asset = document.getElementById('input-stock-market').value;
                stockSymbol = document.getElementById('input-stock-symbol').value || '股票交易';
                shares = parseFloat(document.getElementById('input-stock-shares').value) || 0;
                price = parseFloat(document.getElementById('input-stock-price').value) || 0;
                fee = parseFloat(document.getElementById('input-stock-fee').value) || 0;
                category = txType === '存入' ? '股票買進' : '股票賣出';
            }

            const newTx = { id: 'tx_' + Date.now(), type: txType, asset, category, amount, note, date, stockSymbol, shares, price, fee };
            
            appData.transactions.unshift(newTx);
            saveData();
            closeModal('transaction-modal');
        }

        function deleteTransaction(id) {
            const idx = appData.transactions.findIndex(t => t.id === id);
            if (idx !== -1) {
                appData.transactions.splice(idx, 1);
                saveData();
            }
        }

        function openStockHistoryModal(symbol) {
            const stockTxList = appData.transactions.filter(tx => (tx.asset === 'TW_STOCK' || tx.asset === 'US_STOCK') && tx.stockSymbol === symbol);
            let totalShares = 0, totalCost = 0;
            stockTxList.forEach(tx => {
                const s = Number(tx.shares) || 0, a = Number(tx.amount) || 0;
                if (tx.type === '存入') { totalShares += s; totalCost += a; }
                else { totalShares -= s; totalCost -= a; }
            });
            const avgPrice = totalShares > 0 ? (totalCost / totalShares).toFixed(2) : 0;
            const isTW = stockTxList.length > 0 && stockTxList[0].asset === 'TW_STOCK';
            const currSymbol = isTW ? 'NT$' : '$';

            document.getElementById('stock-modal-symbol').innerText = `${symbol} 交易歷史`;
            document.getElementById('stock-modal-summary').innerHTML = `
                <div class="flex justify-between items-center text-xs">
                    <div><span class="text-app-muted">持股總數:</span> <strong class="font-mono text-app-main">${totalShares.toLocaleString()} 股</strong></div>
                    <div><span class="text-app-muted">平均成本:</span> <strong class="font-mono text-brand-gold">${currSymbol}${Number(avgPrice).toLocaleString()}</strong></div>
                </div>
            `;
            const listContainer = document.getElementById('stock-modal-list');
            if (stockTxList.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-app-muted py-4 text-xs">查無該股票的歷史紀錄</div>`;
            } else {
                listContainer.innerHTML = stockTxList.map(tx => `
                    <div class="bg-app-card border border-app-line p-2.5 rounded-xl flex justify-between items-center text-xs">
                        <div>
                            <div class="font-bold text-app-main flex items-center gap-1">
                                <span class="${tx.type === '存入' ? 'text-brand-green' : 'text-brand-red'} font-bold">${tx.type === '存入' ? '買進' : '賣出'}</span>
                                <span class="font-mono text-[10px] text-app-muted">(${tx.date})</span>
                            </div>
                            <div class="text-[10px] text-app-muted font-mono mt-0.5">${tx.shares} 股 @ ${currSymbol}${tx.price} (手續費: ${tx.fee || 0})</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold font-mono text-xs ${tx.type === '存入' ? 'text-brand-green' : 'text-brand-red'}">${currSymbol}${Number(tx.amount).toLocaleString()}</div>
                            <button onclick="deleteTransaction('${tx.id}'); openStockHistoryModal('${symbol.replace(/'/g, "\\'")}');" class="text-[10px] text-app-muted hover:text-brand-red active:scale-75">刪除</button>
                        </div>
                    </div>
                `).join('');
            }
            openModal('stock-history-modal');
        }

        function renderTxList(txList) {
            if (!txList || txList.length === 0) return `<div class="text-center text-xs text-app-muted py-6 bg-app-card rounded-2xl border border-app-line">查無相關交易紀錄</div>`;
            return txList.map(tx => {

        function renderStockStatsView(container) {
            const stockTxList = appData.transactions.filter(tx => tx.asset === 'TW_STOCK' || tx.asset === 'US_STOCK');
            const holdingsMap = {};
            stockTxList.forEach(tx => {
                const sym = tx.stockSymbol || '未知股票';
                if (!holdingsMap[sym]) holdingsMap[sym] = { symbol: sym, asset: tx.asset, totalShares: 0, totalSpent: 0, txCount: 0 };
                const s = Number(tx.shares) || 0, a = Number(tx.amount) || 0;
                if (tx.type === '存入') { holdingsMap[sym].totalShares += s; holdingsMap[sym].totalSpent += a; }
                else { holdingsMap[sym].totalShares -= s; holdingsMap[sym].totalSpent -= a; }
                holdingsMap[sym].txCount += 1;
            });
            const holdingsList = Object.values(holdingsMap);
            const twHoldings = holdingsList.filter(h => h.asset === 'TW_STOCK');
            const usHoldings = holdingsList.filter(h => h.asset === 'US_STOCK');
            const liveTWStock = getLiveAssetBalance('TW_STOCK');
            const liveUSStockUSD = getLiveAssetBalance('US_STOCK');
            const liveUSStockTWD = liveUSStockUSD * appData.usdExchangeRate;
            const totalStockVal = liveTWStock + liveUSStockTWD;

            const renderStockItem = (h) => {
                const avgCost = h.totalShares > 0 ? (h.totalSpent / h.totalShares).toFixed(2) : 0;
                const isTW = h.asset === 'TW_STOCK';
                const currencySymbol = isTW ? 'NT$' : '$';
                return `

                                </div>
                                <div class="text-[10px] text-app-muted mt-0.5 font-mono truncate">${h.totalShares.toLocaleString()} 股 • 均價 ${currencySymbol}${Number(avgCost).toLocaleString()}</div>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="font-bold font-mono text-sm text-brand-gold">${currencySymbol} ${h.totalSpent.toLocaleString()}</div>
                            <div class="text-[10px] text-app-muted font-mono">${h.txCount} 筆交易 ›</div>
                        </div>
                    </div>
                `;
            };

            const showTW = stockSubFilter === 'ALL' || stockSubFilter === 'TW_STOCK';
            const showUS = stockSubFilter === 'ALL' || stockSubFilter === 'US_STOCK';

            container.innerHTML = `

                            <span class="bg-app-surface text-brand-blue px-2.5 py-0.5 rounded-full text-[10px] border border-brand-blue/30 font-mono">${holdingsList.length} 檔標的</span>
                        </div>
                        <div class="text-3xl font-extrabold text-brand-blue tracking-tight font-mono">$ ${totalStockVal.toLocaleString('zh-TW', {maximumFractionDigits: 0})}</div>

                                    </div>
                                    ${usHoldings.length === 0 ? '<div class="bg-app-card border border-app-line p-4 rounded-2xl text-center text-xs text-app-muted">尚無美股持股紀錄</div>' : usHoldings.map(renderStockItem).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `}
                </div>
            `;

        function openOptionModal(target, title, options, currentVal) {
            currentOptionTarget = target;
            document.getElementById('option-modal-title').innerHTML = `<i data-lucide="list" class="w-4 h-4"></i> ${title}`;
            document.getElementById('option-modal-list').innerHTML = options.map(opt => `
                <button type="button" onclick="selectOptionValue('${opt.value.replace(/'/g, "\\'")}', '${opt.label.replace(/'/g, "\\'")}')" class="w-full text-left p-3 rounded-xl border ${opt.value === currentVal ? 'border-brand-gold bg-brand-gold/10 font-bold' : 'border-app-line bg-app-card'} hover:border-brand-gold flex justify-between items-center text-xs transition-all active:scale-75">
                    <span class="text-app-main">${opt.label}</span>
                    ${opt.value === currentVal ? '<i data-lucide="check" class="w-4 h-4 text-brand-gold font-bold"></i>' : ''}
                </button>
            `).join('');
            const customBox = document.getElementById('custom-category-add-box');
            if (target === 'TX_CATEGORY' || target === 'REC_CATEGORY') customBox.classList.remove('hidden');
            else customBox.classList.add('hidden');
            openModal('custom-option-modal');
        }

        function addNewCustomCategory() {
            const input = document.getElementById('new-category-input');
            if (!input) return;
            const newCat = input.value.trim();

            if (!appData.categories.includes(newCat)) {
                appData.categories.push(newCat);
                saveData();

            input.value = '';
            if (currentOptionTarget === 'TX_CATEGORY') { triggerTxCategoryPicker(); selectOptionValue(newCat, newCat); }

            } else if (currentOptionTarget === 'REC_ASSET') {

            } else if (currentOptionTarget === 'TX_ASSET') {

                document.getElementById('tx-asset-btn-txt').innerText = label;
            } else if (currentOptionTarget === 'TX_STOCK_MARKET') {

        function handleRecurringSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('rec-name').value;
            const type = document.getElementById('rec-type-val').value || '支出';
            const startDateStr = document.getElementById('rec-date-val').value || getLocalDateStr();
            const day = parseInt(startDateStr.split('-')[2]) || 1;
            const amount = parseFloat(document.getElementById('rec-amount').value) || 0;
            const asset = document.getElementById('rec-asset-val').value || 'TWD';
            if (!name || amount <= 0) return;

            appData.recurringRules.push({ id: 'r_' + Date.now(), name, type, startDate: startDateStr, day, amount, asset, category: '固定支出/存入', lastExecutedMonth: '' });
            saveData();
            closeModal('recurring-modal');
            checkRecurringTransactions();
            showToast("建立成功", `已新增「${name}」規則（日期：${startDateStr}）。`);
        }

        function handleInstallmentSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('inst-name').value;
            const total = parseFloat(document.getElementById('inst-total').value) || 0;
            const months = parseInt(document.getElementById('inst-months').value) || 12;
            const startDate = document.getElementById('inst-date-val').value || getLocalDateStr();
            const deductionDay = parseInt(startDate.split('-')[2]) || 1;
            if (!name || total <= 0 || months <= 0) return;

            const monthlyAmount = Math.round(total / months);
            appData.installments.push({ id: 'inst_' + Date.now(), name, totalAmount: total, monthlyAmount, totalMonths: months, paidMonths: 0, startDate, day: deductionDay, lastPaidMonth: '', asset: 'TWD' });
            saveData();
            closeModal('installment-modal');
            checkRecurringTransactions();
            showToast("建立成功", `已新增分期「${name}」（起始日：${startDate}）。`);
        }

        function checkRecurringTransactions() {
            const today = new Date();
            const currentDay = today.getDate();
            const todayStr = getLocalDateStr(today);
            const currentMonthStr = todayStr.slice(0, 7);
            let triggeredCount = 0;

            appData.recurringRules.forEach(rule => {
                const ruleStart = rule.startDate || todayStr;
                if (todayStr >= ruleStart && rule.lastExecutedMonth !== currentMonthStr) {
                    if (currentDay >= rule.day || todayStr >= ruleStart) {
                        rule.lastExecutedMonth = currentMonthStr;
                        const newTx = { id: 'auto_' + Date.now() + '_' + rule.id, type: rule.type, asset: rule.asset || 'TWD', category: rule.category || '固定支出/存入', amount: rule.amount, note: `[自動週期] ${rule.name}`, date: todayStr };
                        appData.transactions.unshift(newTx);
                        appData.notifications.unshift({ id: 'notif_' + Date.now(), title: '自動交易執行通知', message: `已自動執行「${rule.name}」${rule.type} $${rule.amount.toLocaleString()}`, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), read: false });
                        triggeredCount++;
                    }
                }
            });

            appData.installments.forEach(inst => {
                const instStart = inst.startDate || todayStr;
                if (inst.paidMonths < inst.totalMonths && todayStr >= instStart && inst.lastPaidMonth !== currentMonthStr) {
                    if (currentDay >= inst.day || todayStr >= instStart) {
                        inst.paidMonths += 1;
                        inst.lastPaidMonth = currentMonthStr;
                        const newTx = { id: 'inst_tx_' + Date.now() + '_' + inst.id, type: '支出', asset: inst.asset || 'TWD', category: '固定支出/存入', amount: inst.monthlyAmount, note: `[分期自動扣款] ${inst.name} (${inst.paidMonths}/${inst.totalMonths}期)`, date: todayStr };
                        appData.transactions.unshift(newTx);
                        appData.notifications.unshift({ id: 'notif_' + Date.now(), title: '分期扣款執行通知', message: `已自動執行「${inst.name}」第 ${inst.paidMonths}/${inst.totalMonths} 期扣款 NT$ ${inst.monthlyAmount.toLocaleString()}`, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), read: false });
                        triggeredCount++;
                    }
                }
            });

            if (triggeredCount > 0) saveData();
        }

        function openCustomDatePicker(target) {
            datePickerTarget = target;
            const titleElem = document.getElementById('date-modal-title');
            const content = document.getElementById('date-picker-content');
            if (target.includes('SINGLE') || target === 'TX_INPUT' || target === 'REC_DATE' || target === 'INST_DATE' || target.includes('START') || target.includes('END')) {
                titleElem.innerHTML = `<i data-lucide="calendar" class="w-4 h-4"></i> 選擇日期`;
                let currDate = filterCustomDate;
                if (target === 'TX_INPUT') currDate = document.getElementById('input-date').value || filterCustomDate;
                else if (target === 'REC_DATE') currDate = document.getElementById('rec-date-val').value || filterCustomDate;
                else if (target === 'INST_DATE') currDate = document.getElementById('inst-date-val').value || filterCustomDate;
                else if (target === 'EXPORT_JPG_SINGLE') currDate = exportJpgCustomDate;
                else if (target === 'EXPORT_JPG_START') currDate = exportJpgStartDate;
                else if (target === 'EXPORT_JPG_END') currDate = exportJpgEndDate;
                content.innerHTML = renderSingleDayPickerHtml(currDate);
            } else {
                titleElem.innerHTML = `<i data-lucide="calendar-days" class="w-4 h-4"></i> 選擇月份 (YYYY-MM)`;
                content.innerHTML = renderMonthPickerHtml(target === 'EXPORT_JPG_MONTH' ? exportJpgMonthDate : filterMonthDate);
            }
            openModal('custom-date-modal');
            if (window.lucide) lucide.createIcons();
        }

        function autoApplyDateFromPicker() {
            const yElem = document.getElementById('dp-year');
            const mElem = document.getElementById('dp-month');
            const dElem = document.getElementById('dp-day');
            if (!yElem || !mElem || !dElem) return;

            const yr = parseInt(yElem.value);
            const mo = parseInt(mElem.value);
            const maxDays = getDaysInMonth(yr, mo);
            let selectedDay = parseInt(dElem.value) || 1;
            if (selectedDay > maxDays) selectedDay = maxDays;

            const currentOptionCount = dElem.options.length;
            if (currentOptionCount !== maxDays) {
                dElem.innerHTML = Array.from({length: maxDays}, (_, i) => i + 1)
                    .map(dy => `<option value="${String(dy).padStart(2,'0')}" ${dy === selectedDay ? 'selected' : ''}>${dy}日</option>`)
                    .join('');
            } else {
                dElem.value = String(selectedDay).padStart(2, '0');
            }

            const selectedDate = `${yr}-${String(mo).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}`;

            if (datePickerTarget === 'SINGLE_DAY') filterCustomDate = selectedDate;
            else if (datePickerTarget === 'CUSTOM_START') filterStartDate = selectedDate;
            else if (datePickerTarget === 'CUSTOM_END') filterEndDate = selectedDate;
            else if (datePickerTarget === 'TX_INPUT') { 
                document.getElementById('input-date').value = selectedDate; 
                document.getElementById('input-date-display').innerText = selectedDate; 
            }
            else if (datePickerTarget === 'REC_DATE') { 
                document.getElementById('rec-date-val').value = selectedDate; 
                document.getElementById('rec-date-btn-txt').innerText = selectedDate; 
            }
            else if (datePickerTarget === 'INST_DATE') { 
                document.getElementById('inst-date-val').value = selectedDate; 
                document.getElementById('inst-date-btn-txt').innerText = selectedDate; 
            }
            else if (datePickerTarget === 'EXPORT_JPG_SINGLE') { exportJpgCustomDate = selectedDate; updateExportJpgRangeUI(); }
            else if (datePickerTarget === 'EXPORT_JPG_START') { exportJpgStartDate = selectedDate; updateExportJpgRangeUI(); }
            else if (datePickerTarget === 'EXPORT_JPG_END') { exportJpgEndDate = selectedDate; updateExportJpgRangeUI(); }

            renderCurrentView();
        }

        function autoApplyMonthFromPicker() {
            const yElem = document.getElementById('dp-m-year');
            const mElem = document.getElementById('dp-m-month');
            if (!yElem || !mElem) return;

            const mStr = `${yElem.value}-${mElem.value}`;
            if (datePickerTarget === 'EXPORT_JPG_MONTH') { 
                exportJpgMonthDate = mStr; 
                updateExportJpgRangeUI(); 
            } else {
                filterMonthDate = mStr;
            }
            renderCurrentView();
        }

        function renderSingleDayPickerHtml(currDateStr) {
            const [y, m, d] = (currDateStr || getLocalDateStr()).split('-').map(Number);
            const todayStr = getLocalDateStr();
            const currentYear = new Date().getFullYear();
            const maxDays = getDaysInMonth(y, m);
            const currentDay = Math.min(d, maxDays);

            return `
                <div class="space-y-3 text-xs pb-4">
                    <div class="grid grid-cols-3 gap-1">
                        <div><label class="block text-app-muted text-[10px] mb-1">年份</label><select id="dp-year" onchange="autoApplyDateFromPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-1.5 py-1.5 text-app-main font-mono">${Array.from({length: currentYear - 2000 + 1}, (_, i) => 2000 + i).map(yr => `<option value="${yr}" ${yr === y ? 'selected' : ''}>${yr}年</option>`).join('')}</select></div>
                        <div><label class="block text-app-muted text-[10px] mb-1">月份</label><select id="dp-month" onchange="autoApplyDateFromPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-1.5 py-1.5 text-app-main font-mono">${Array.from({length: 12}, (_, i) => i + 1).map(mo => `<option value="${String(mo).padStart(2,'0')}" ${mo === m ? 'selected' : ''}>${mo}月</option>`).join('')}</select></div>
                        <div><label class="block text-app-muted text-[10px] mb-1">日期</label><select id="dp-day" onchange="autoApplyDateFromPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-1.5 py-1.5 text-app-main font-mono">${Array.from({length: maxDays}, (_, i) => i + 1).map(dy => `<option value="${String(dy).padStart(2,'0')}" ${dy === currentDay ? 'selected' : ''}>${dy}日</option>`).join('')}</select></div>
                    </div>
                    <div class="flex gap-1.5 pt-1">
                        <button type="button" onclick="setQuickDate('${todayStr}')" class="flex-1 bg-app-card border border-app-line py-1.5 rounded-lg text-[10px] text-app-main font-medium active:scale-75">今日</button>
                        <button type="button" onclick="setQuickDate('${getRelativeDay(-1)}')" class="flex-1 bg-app-card border border-app-line py-1.5 rounded-lg text-[10px] text-app-main font-medium active:scale-75">昨天</button>
                        <button type="button" onclick="setQuickDate('${getRelativeDay(-7)}')" class="flex-1 bg-app-card border border-app-line py-1.5 rounded-lg text-[10px] text-app-main font-medium active:scale-75">7天前</button>
                    </div>
                    <button type="button" onclick="confirmCustomDate()" class="w-full bg-brand-gold text-white font-bold py-2.5 rounded-xl text-xs shadow active:scale-75">確認套用日期</button>
                </div>
            `;
        }

        function renderMonthPickerHtml(currMonthStr) {
            const [y, m] = (currMonthStr || getLocalMonthStr()).split('-').map(Number);
            const currentYear = new Date().getFullYear();
            return `
                <div class="space-y-3 text-xs pb-4">
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block text-app-muted text-[10px] mb-1">年份</label><select id="dp-m-year" onchange="autoApplyMonthFromPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-2 py-2 text-app-main font-mono">${Array.from({length: currentYear - 2000 + 1}, (_, i) => 2000 + i).map(yr => `<option value="${yr}" ${yr === y ? 'selected' : ''}>${yr}年</option>`).join('')}</select></div>
                        <div><label class="block text-app-muted text-[10px] mb-1">月份</label><select id="dp-m-month" onchange="autoApplyMonthFromPicker()" class="w-full bg-app-input border border-app-line rounded-xl px-2 py-2 text-app-main font-mono">${Array.from({length: 12}, (_, i) => i + 1).map(mo => `<option value="${String(mo).padStart(2,'0')}" ${mo === m ? 'selected' : ''}>${mo}月</option>`).join('')}</select></div>
                    </div>
                    <button type="button" onclick="confirmCustomMonth()" class="w-full bg-brand-gold text-white font-bold py-2.5 rounded-xl text-xs shadow active:scale-75">確認套用月份</button>
                </div>
            `;
        }

        function getRelativeDay(offsetDays) {
            const dt = new Date(); 
            dt.setDate(dt.getDate() + offsetDays); 
            return getLocalDateStr(dt);
        }

        function setQuickDate(dateStr) {
            const [y, m, d] = dateStr.split('-');
            const yElem = document.getElementById('dp-year');
            const mElem = document.getElementById('dp-month');
            const dElem = document.getElementById('dp-day');
            if (yElem) yElem.value = y; 
            if (mElem) mElem.value = m; 
            if (dElem) dElem.value = d;
            autoApplyDateFromPicker();
        }

        function confirmCustomDate() {
            autoApplyDateFromPicker();
            closeModal('custom-date-modal');
        }

        function confirmCustomMonth() {
            autoApplyMonthFromPicker();
            closeModal('custom-date-modal');
        }

        function updateExportJpgRangeUI() {
            const rangeVal = document.getElementById('export-jpg-range-select').value;
            const box = document.getElementById('export-jpg-date-picker-box');
            if (rangeVal === 'ALL' || rangeVal === 'RECENT30') { box.classList.add('hidden'); box.innerHTML = ''; }
            else if (rangeVal === 'SINGLE_DAY') {
                box.classList.remove('hidden');
                box.innerHTML = `<div class="flex items-center justify-between bg-app-input border border-app-line p-2 rounded-xl text-xs"><span class="text-app-muted">選擇日期:</span><button type="button" onclick="openCustomDatePicker('EXPORT_JPG_SINGLE')" class="bg-app-card text-brand-gold font-mono font-bold px-2.5 py-1 rounded-lg border border-brand-gold/40 flex items-center gap-1 active:scale-75"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${exportJpgCustomDate}</button></div>`;
            } else if (rangeVal === 'MONTHLY') {
                box.classList.remove('hidden');
                box.innerHTML = `<div class="flex items-center justify-between bg-app-input border border-app-line p-2 rounded-xl text-xs"><span class="text-app-muted">選擇月份:</span><button type="button" onclick="openCustomDatePicker('EXPORT_JPG_MONTH')" class="bg-app-card text-brand-gold font-mono font-bold px-2.5 py-1 rounded-lg border border-brand-gold/40 flex items-center gap-1 active:scale-75"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${exportJpgMonthDate}</button></div>`;
            } else if (rangeVal === 'CUSTOM') {
                box.classList.remove('hidden');
                box.innerHTML = `
                    <div class="space-y-1.5">
                        <div class="flex items-center justify-between bg-app-input border border-app-line p-2 rounded-xl text-xs"><span class="text-app-muted">起始日期:</span><button type="button" onclick="openCustomDatePicker('EXPORT_JPG_START')" class="bg-app-card text-brand-gold font-mono font-bold px-2.5 py-1 rounded-lg border border-brand-gold/40 flex items-center gap-1 active:scale-75"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${exportJpgStartDate}</button></div>
                        <div class="flex items-center justify-between bg-app-input border border-app-line p-2 rounded-xl text-xs"><span class="text-app-muted">結束日期:</span><button type="button" onclick="openCustomDatePicker('EXPORT_JPG_END')" class="bg-app-card text-brand-gold font-mono font-bold px-2.5 py-1 rounded-lg border border-brand-gold/40 flex items-center gap-1 active:scale-75"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${exportJpgEndDate}</button></div>
                    </div>
                `;
            }
            if (window.lucide) lucide.createIcons();
        }

        function generateAndDownloadJPG() {
            const assetKey = document.getElementById('export-jpg-asset-select').value;
            const rangeVal = document.getElementById('export-jpg-range-select').value;
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 1050;
            const ctx = canvas.getContext('2d');

            const isDark = appData.theme === 'dark';
            const bgColor = isDark ? '#1c1d1b' : '#f6f4ee';
            const cardBg = isDark ? '#272825' : '#ffffff';
            const borderCol = isDark ? '#454841' : '#d8d2c4';
            const textMain = isDark ? '#f0eee6' : '#2c2e2b';
            const textMuted = isDark ? '#939890' : '#7a7f78';
            const goldCol = '#c89b3c', blueCol = '#3a6b88', redCol = '#b84a39', greenCol = '#5b8c5a';

            ctx.fillStyle = bgColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = goldCol; ctx.lineWidth = 4; ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

            ctx.fillStyle = goldCol; ctx.font = '32px sans-serif'; ctx.fillText(appData.appTitle || '智慧帳本', 50, 75);
            ctx.fillStyle = textMuted; ctx.font = '16px sans-serif'; ctx.fillText(`產生日期：${new Date().toLocaleDateString('zh-TW')}`, 50, 110);

            ctx.strokeStyle = borderCol; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(50, 130); ctx.lineTo(750, 130); ctx.stroke();

            const liveTWD = getLiveAssetBalance('TWD');
            const liveTWStock = getLiveAssetBalance('TW_STOCK');
            const liveUSD = getLiveAssetBalance('USD');
            const liveUSStock = getLiveAssetBalance('US_STOCK');

            const twdStockInTWD = liveTWStock;
            const usdCashInTWD = liveUSD * appData.usdExchangeRate;
            const usdStockInTWD = liveUSStock * appData.usdExchangeRate;
            const grandTotalTWD = liveTWD + twdStockInTWD + usdCashInTWD + usdStockInTWD;

            let assetName = '全部資產總覽', mainValStr = `$ ${grandTotalTWD.toLocaleString()} NTD`, subValStr = '';
            if (assetKey === 'TWD') { assetName = '台幣現金 (TWD)'; mainValStr = `$ ${liveTWD.toLocaleString()} NTD`; }
            else if (assetKey === 'TW_STOCK') { assetName = '台股市值 (TW Stock)'; mainValStr = `$ ${liveTWStock.toLocaleString()} NTD`; }
            else if (assetKey === 'USD') { assetName = '美金現金 (USD)'; mainValStr = `$ ${liveUSD.toLocaleString()} USD`; subValStr = `折合台幣約：NT$ ${(liveUSD * appData.usdExchangeRate).toLocaleString('zh-TW', {maximumFractionDigits:0})}`; }
            else if (assetKey === 'US_STOCK') { assetName = '美股市值 (US Stock)'; mainValStr = `$ ${liveUSStock.toLocaleString()} USD`; subValStr = `折合台幣約：NT$ ${(liveUSStock * appData.usdExchangeRate).toLocaleString('zh-TW', {maximumFractionDigits:0})}`; }

            ctx.fillStyle = cardBg;
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(50, 150, 700, 140, 16); ctx.fill(); }
            else ctx.fillRect(50, 150, 700, 140);
            ctx.strokeStyle = goldCol; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = textMuted; ctx.font = '18px sans-serif'; ctx.fillText(assetName, 80, 185);
            ctx.fillStyle = goldCol; ctx.font = '38px sans-serif'; ctx.fillText(mainValStr, 80, 240);
            if (subValStr) { ctx.fillStyle = textMuted; ctx.font = '16px sans-serif'; ctx.fillText(subValStr, 80, 270); }

            let startY = 320;
            if (assetKey === 'ALL') {
                ctx.fillStyle = textMain; ctx.font = '20px sans-serif'; ctx.fillText('資產配置分布', 50, startY + 25);
                startY += 40;
                const cards = [
                    { title: '台幣現金', val: `$ ${liveTWD.toLocaleString()} TWD`, col: goldCol },
                    { title: '台股市值', val: `$ ${liveTWStock.toLocaleString()} TWD`, col: blueCol },
                    { title: '美金現金', val: `$ ${liveUSD.toLocaleString()} USD`, col: goldCol },
                    { title: '美股市值', val: `$ ${liveUSStock.toLocaleString()} USD`, col: blueCol }
                ];
                cards.forEach((c, idx) => {
                    const x = 50 + (idx % 2) * 360, y = startY + Math.floor(idx / 2) * 100;
                    ctx.fillStyle = cardBg;
                    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, 340, 85, 12); ctx.fill(); ctx.strokeStyle = borderCol; ctx.stroke(); }
                    else ctx.fillRect(x, y, 340, 85);
                    ctx.fillStyle = textMuted; ctx.font = '15px sans-serif'; ctx.fillText(c.title, x + 20, y + 30);
                    ctx.fillStyle = c.col; ctx.font = '20px sans-serif'; ctx.fillText(c.val, x + 20, y + 65);
                });
                startY += 210;
            }

            ctx.fillStyle = textMain; ctx.font = '20px sans-serif'; ctx.fillText('近期交易紀錄', 50, startY + 25);
            startY += 40;

            let filteredTxs = appData.transactions;
            if (assetKey !== 'ALL') filteredTxs = filteredTxs.filter(t => t.asset === assetKey);
            if (rangeVal === 'RECENT30') filteredTxs = filteredTxs.slice(0, 30);
            else if (rangeVal === 'SINGLE_DAY') filteredTxs = filteredTxs.filter(t => t.date === exportJpgCustomDate);
            else if (rangeVal === 'MONTHLY') filteredTxs = filteredTxs.filter(t => t.date.startsWith(exportJpgMonthDate));
            else if (rangeVal === 'CUSTOM') filteredTxs = filteredTxs.filter(t => t.date >= exportJpgStartDate && t.date <= exportJpgEndDate);
            filteredTxs = filteredTxs.slice(0, 7);

            if (filteredTxs.length === 0) {
                ctx.fillStyle = textMuted; ctx.font = '16px sans-serif'; ctx.fillText('尚無符合條件的交易明細紀錄', 50, startY + 30);
            } else {
                filteredTxs.forEach((tx, idx) => {
                    const y = startY + idx * 75;
                    ctx.fillStyle = cardBg;
                    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(50, y, 700, 65, 12); ctx.fill(); ctx.strokeStyle = borderCol; ctx.lineWidth = 1; ctx.stroke(); }
                    else ctx.fillRect(50, y, 700, 65);
                    const isExpense = tx.type === '支出', curStr = (tx.asset === 'USD' || tx.asset === 'US_STOCK') ? 'USD' : 'NT$';
                    ctx.fillStyle = textMain; ctx.font = '16px sans-serif'; ctx.fillText(`${tx.stockSymbol ? tx.stockSymbol : tx.category || '一般交易'}`, 70, y + 32);
                    ctx.fillStyle = textMuted; ctx.font = '13px sans-serif'; ctx.fillText(`${tx.date} ${tx.note ? ' • ' + tx.note : ''} ${tx.shares ? ' • ' + tx.shares + '股' : ''}`, 70, y + 52);
                    ctx.fillStyle = isExpense ? redCol : greenCol; ctx.font = '18px sans-serif'; ctx.textAlign = 'right';
                    ctx.fillText(`${isExpense ? '-' : '+'} ${curStr} ${Number(tx.amount).toLocaleString()}`, 730, y + 40);
                    ctx.textAlign = 'left';
                });
            }

            ctx.fillStyle = textMuted; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`${appData.appTitle || '智慧帳本'} 報表`, canvas.width / 2, canvas.height - 35);
            ctx.textAlign = 'left';

            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/jpeg', 0.92);
            a.download = `資產報表_${assetKey}_${getLocalDateStr()}.jpg`;
            a.click();
            closeModal('export-jpg-modal');
            showToast("匯出成功", `已成功匯出「${assetName}」JPG 報表！`);
        }

        function exportJSONData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `wealth_backup_${getLocalDateStr()}.json`; a.click();
        }

        function importJSONData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.assets && imported.transactions) { appData = imported; saveData(); showToast("還原成功", "備份資料已成功還原！"); }
                    else showToast("格式不符", "匯入的檔案格式不合。");
                } catch(err) { showToast("讀取失敗", "無法解析 JSON 檔案。"); }
            };
            reader.readAsText(file);
        }

        async function executeResetData() {
            closeModal('confirm-modal');
            appData = JSON.parse(JSON.stringify(DEFAULT_STATE));
            saveData();
            await updateExchangeRateAuto(false);
            showToast("重置完成", "系統所有資料與設定已完全重置歸零，並已同步更新最新即時匯率！");
        }
    </script>
</body>
</html>
